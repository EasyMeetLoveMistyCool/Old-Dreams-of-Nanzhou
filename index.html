<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>南洲舊夢</title>
<style>
  /* ========== 基础重置 ========== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "HarmonyOS Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    transition: background .3s, color .3s;
  }

  /* ========== 主题变量 ========== */
  :root {
    --bg-color: #f0f2f5; --topbar-bg: #ffffff; --topbar-border: #e4e6eb;
    --bubble-me: #d6ecff; --bubble-them: #ffffff;
    --text-color: #000000; --text-secondary: #707579; --time-color: #a0a0a0;
    --input-bg: rgba(128,128,128,0.15); --primary: #3390ec; --border-light: rgba(0,0,0,0.05);
    --pinned-bg: #fff5f6;
  }
  body.theme-sky { --bg-color: #e6ebee; --bubble-me: #d6ecff; }
  body.theme-forest { --bg-color: #e8efe9; --bubble-me: #d4ebd9; --primary: #4caf50; }
  body.theme-sunset { --bg-color: #fdf5eb; --bubble-me: #ffe0b2; --primary: #ff9800; }
  body.theme-twilight { --bg-color: #e0e0e0; --bubble-me: #cfd8dc; --primary: #607d8b; }
  body.theme-crabapple { --bg-color: #fcf2f3; --bubble-me: #ffcdd2; --primary: #e57373; }
  body.theme-rain { --bg-color: #eef4f4; --bubble-me: #b2dfdb; --primary: #009688; }
  body.theme-paper { --bg-color: #f5f1e6; --bubble-me: #f0e6d2; --primary: #8d6e63; --topbar-bg: #f9f6ee; }
  body.theme-ink { --bg-color: #f4f4f4; --bubble-me: #e0e0e0; --primary: #424242; }
  
  body.theme-cyber { 
    --bg-color: #000000; --topbar-bg: #111111; --topbar-border: #222;
    --bubble-me: #003366; --bubble-them: #1a1a1a;
    --text-color: #ffffff; --text-secondary: #888; --time-color: #555;
    --input-bg: rgba(255,255,255,0.1); --primary: #00b0ff; --border-light: rgba(255,255,255,0.05); --pinned-bg: #2b1f24;
  }
  body.theme-space { 
    --bg-color: #0b1320; --topbar-bg: #121d30; --topbar-border: #1a2639;
    --bubble-me: #1e3a5f; --bubble-them: #1a2639;
    --text-color: #e0e0e0; --text-secondary: #8fa0b5; --time-color: #5a6b7c;
    --input-bg: rgba(255,255,255,0.1); --primary: #4a90e2; --border-light: rgba(255,255,255,0.05); --pinned-bg: #2b1f24;
  }
  body.theme-nightpurple { 
    --bg-color: #150e1c; --topbar-bg: #1f1528; --topbar-border: #2b1d36;
    --bubble-me: #442266; --bubble-them: #2b1d36;
    --text-color: #e8dff0; --text-secondary: #9a86a8; --time-color: #6c5a78;
    --input-bg: rgba(255,255,255,0.1); --primary: #b388ff; --border-light: rgba(255,255,255,0.05); --pinned-bg: #2b1f24;
  }
  body.theme-pureblack { 
    --bg-color: #000000; --topbar-bg: #0a0a0a; --topbar-border: #1a1a1a;
    --bubble-me: #333333; --bubble-them: #111111;
    --text-color: #e0e0e0; --text-secondary: #666; --time-color: #444;
    --input-bg: rgba(255,255,255,0.1); --primary: #888; --border-light: rgba(255,255,255,0.05); --pinned-bg: #2b1f24;
  }

  /* ========== 核心容器 ========== */
  #app { height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; background: var(--bg-color); }

  /* ========== 页面容器（确保点击不穿透） ========== */
  .page { position:absolute; inset:0; display:flex; flex-direction:column; transition:transform .25s ease; background: transparent; }
  
  /* 页面层级 */
  .page-list { z-index: 1; pointer-events: auto; } 
  .page-create, .page-sub, .page-settings { z-index: 2; transform:translateX(100%); pointer-events: auto; }
  .page-chat { z-index: 3; transform:translateX(100%); pointer-events: auto; }
  
  .page-chat.show, .page-create.show, .page-sub.show, .page-settings.show { transform:translateX(0); }

  /* ========== 顶栏 ========== */
  .topbar {
    min-height:56px; flex:0 0 auto; 
    display:flex; align-items:center;
    padding:0 8px;
    border-bottom:1px solid var(--topbar-border);
    position:relative; z-index:10;
    background: transparent;
  }
  .icon-btn {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--text-secondary); cursor:pointer;
    background:transparent; border:none; flex: 0 0 40px;
    z-index: 20;
  }
  .icon-btn:active { background:rgba(128,128,128,0.15); }
  
  .avatar-sm {
    width:36px; height:36px; border-radius:50%;
    background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex:0 0 36px; margin-right:10px;
  }
  
  .header-info { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; padding: 8px 0; }
  .header-title { 
    font-size:16px; font-weight:500; line-height:1.2; 
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; 
    color:var(--text-color); margin-bottom: 2px;
  }
  .header-sub { 
    font-size:12px; color:var(--text-secondary); line-height:1.3; 
    white-space: normal; word-break: break-word; 
  }

  /* ========== 列表页 ========== */
  .chat-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .chat-row {
    display:flex; align-items:center; gap:12px; padding:12px 14px; 
    background: transparent;
    cursor:pointer;
    border-bottom:1px solid var(--topbar-border); user-select: none;
  }
  .chat-row:active { background:rgba(128,128,128,0.1); }
  .chat-row.pinned { background: var(--pinned-bg); }

  .avatar-lg {
    width:48px; height:48px; border-radius:50%; background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 48px;
  }
  .chat-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .chat-top-row { display:flex; align-items:baseline; gap:6px; overflow:hidden; }
  .chat-room-name { font-size:16px; font-weight:600; color:var(--text-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-their-name { font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-preview { font-size:14px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-time { font-size:12px; color:var(--text-secondary); flex:0 0 auto; align-self:flex-start; margin-top:4px; }
  .chat-empty { text-align:center; color:var(--text-secondary); padding:40px 20px; font-size:14px; }

  .fab {
    position:absolute; right:18px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.2); cursor:pointer; z-index:5; border:none;
  }

  /* ========== 聊天页专属逻辑 ========== */
  .page-chat { background-size: cover; background-position: center; }
  .chat-bg-mask { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  
  .page-chat .topbar { background: transparent !important; border-bottom: none; z-index: 10; }

  .messages-wrap {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; z-index: 2;
  }
  .messages {
    padding: 10px 14px 6px; display: flex; flex-direction: column; min-height: 100%;
  }
  
  .date-divider {
    align-self:center; background:rgba(0,0,0,.18); color:#fff; font-size:12px; padding:4px 12px; border-radius:12px;
    margin:10px 0; font-weight:500;
  }
  body.theme-cyber .date-divider, body.theme-space .date-divider, body.theme-nightpurple .date-divider, body.theme-pureblack .date-divider { background:rgba(255,255,255,.15); }

  .msg-row { display:flex; margin:2px 0; align-items:flex-end; gap:6px; }
  .msg-row.me { justify-content:flex-end; flex-direction:row-reverse; }
  .msg-row.them { justify-content:flex-start; }
  .msg-row.grouped { margin-top:2px; }
  .msg-row:not(.grouped) { margin-top:8px; }

  .msg-avatar {
    width:28px; height:28px; border-radius:50%; background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center; font-size:12px; flex:0 0 28px; margin-bottom:2px;
  }
  .msg-row.grouped .msg-avatar { visibility:hidden; }

  .bubble {
    max-width:75%; padding:6px 10px; border-radius:12px; position:relative; font-size:15px; line-height:1.4;
    word-break:break-word; box-shadow:0 1px 3px rgba(0,0,0,.15); transition: background .3s;
  }
  .msg-row.me .bubble { background:var(--bubble-me); color:var(--text-color); border-bottom-right-radius:4px; }
  .msg-row.them .bubble { background:var(--bubble-them); color:var(--text-color); border-bottom-left-radius:4px; }

  .msg-row:not(.grouped) .bubble::after { content:''; position:absolute; bottom:0; width:0; height:0; border-style:solid; }
  .msg-row.me:not(.grouped) .bubble::after { right:-6px; border-width:0 0 10px 10px; border-color:transparent transparent var(--bubble-me) transparent; }
  .msg-row.them:not(.grouped) .bubble::after { left:-6px; border-width:0 10px 10px 0; border-color:transparent var(--bubble-them) transparent transparent; }

  .bubble .card-line { display:block; margin-bottom:2px; }
  .bubble .sticker-img { display:block; max-width:160px; max-height:160px; border-radius:8px; margin-top:4px; }
  .bubble .meta { float:right; font-size:11px; color:var(--time-color); margin:8px 0 -2px 8px; line-height:1; }
  .bubble::after { content:''; display:block; clear:both; }

  /* ========== 聊天页输入区（极简磨砂） ========== */
  .composer {
    flex:0 0 auto;
    padding:8px 10px; padding-bottom:calc(8px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:8px; z-index: 10;
    background: transparent; border-top: none;
  }
  
  /* 彻底删掉那个丑提示框，用隐藏类覆盖 */
  .pending-sticker-box { display: none !important; }

  .composer input {
    flex:1; min-width:0; height:42px; border-radius:21px; border:none; 
    background: rgba(128,128,128,0.2); 
    backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    padding:0 16px; font-size:15px; color:var(--text-color); outline:none; transition: background .3s;
  }
  .composer input::placeholder { color:var(--text-secondary); }
  
  .send-btn {
    width:42px; height:42px; border-radius:50%; 
    background: var(--primary); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; flex:0 0 42px; 
    cursor:pointer; transition: opacity .2s, background .3s; 
    opacity: 0.9;
  }
  .send-btn:disabled { background: rgba(128,128,128,0.2); color:var(--text-secondary); opacity: 0.5; }
  .send-btn svg { width:20px; height:20px; fill:currentColor; margin-left:2px; }

  /* ========== 表单与邮电所（全部透明穿透） ========== */
  .create-scroll { flex:1; overflow-y:auto; padding:20px; }
  .form-group { margin-bottom:24px; display:flex; flex-direction:column; align-items:center; }
  .form-label { font-size:13px; color:var(--text-secondary); margin-bottom:8px; font-weight:500; }
  .avatar-upload {
    width:80px; height:80px; border-radius:50%; background:var(--input-bg); color:var(--text-secondary);
    display:flex; align-items:center; justify-content:center; font-size:32px; cursor:pointer; overflow:hidden;
    margin-bottom:16px; border:2px solid var(--topbar-border); background-size:cover; background-position:center;
  }
  .form-input {
    width:100%; height:48px; border-radius:8px; background:var(--input-bg); border:1px solid var(--topbar-border);
    padding:0 14px; font-size:15px; color:var(--text-color); outline:none; text-align:center; margin-bottom:10px;
  }
  .form-input:focus { border-color:var(--primary); }
  
  .btn-primary {
    width:100%; height:48px; border-radius:8px; background:var(--primary); color:#fff;
    font-size:16px; font-weight:500; border:none; cursor:pointer; margin-top:10px;
  }
  .btn-primary:active { opacity:0.8; }

  .bg-upload-box {
    width:100%; height:120px; border-radius:8px; background:var(--input-bg);
    border:1px dashed var(--topbar-border); display:flex; align-items:center; justify-content:center;
    color:var(--text-secondary); font-size:14px; cursor:pointer; overflow:hidden;
    background-size:cover; background-position:center; margin-bottom:15px;
  }
  .slider-container { width:100%; display:flex; align-items:center; gap:10px; padding:0 10px; }
  .slider-container input[type=range] { flex:1; }

  .tab-bar { display:flex; background:transparent; border-bottom:1px solid var(--topbar-border); }
  .tab-item { flex:1; text-align:center; padding:12px 0; font-size:15px; color:var(--text-secondary); cursor:pointer; font-weight:500; }
  .tab-item.active { color:var(--primary); border-bottom:2px solid var(--primary); }
  .list-item-row { display:flex; justify-content:space-between; align-items:center; padding:12px 14px; background:var(--input-bg); border-radius:8px; margin-bottom:8px; }
  .list-item-text { flex:1; font-size:15px; }

  /* ========== 佈景页面 ========== */
  .settings-section { background:rgba(128,128,128,0.1); border-radius:10px; padding:15px; margin-bottom:20px; }
  .settings-title { font-size:15px; font-weight:600; color:var(--text-color); margin-bottom:15px; border-left:3px solid var(--primary); padding-left:8px; }
  .theme-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .theme-card {
    height:64px; border-radius:8px; display:flex; align-items:center; justify-content:center;
    font-size:14px; font-weight:500; cursor:pointer; box-shadow:0 1px 3px rgba(0,0,0,.1);
    border:2px solid transparent; transition:all .2s;
  }
  .theme-card:active { transform:scale(0.95); }
  .theme-card.active { border-color:var(--text-color); }

  /* ========== 菜单与弹窗 ========== */
  .menu-mask { position:fixed; inset:0; background:rgba(0,0,0,.25); display:none; z-index:50; }
  .menu-mask.show { display:block; }
  .menu { position:absolute; top:56px; right:10px; background:var(--bg-color); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.18); min-width:150px; overflow:hidden; border: 1px solid var(--topbar-border); }
  .menu-item { padding:12px 18px; font-size:15px; color:var(--text-color); cursor:pointer; white-space:nowrap; }
  .menu-item:active { background:var(--input-bg); }
  .menu-item.danger { color:#e53935; }

  .action-sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:150; align-items:center; justify-content:center; padding:20px; }
  .action-sheet-mask.show { display:flex; }
  .action-sheet { background:var(--bg-color); width:100%; max-width:260px; border-radius:12px; overflow:hidden; color:var(--text-color); box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .action-item { padding:14px 20px; font-size:16px; text-align:center; border-bottom:1px solid var(--border-light); cursor:pointer; }
  .action-item:active { background:var(--input-bg); }
  .action-item.danger { color:#e53935; }

  .dialog-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .dialog-mask.show { display:flex; }
  .dialog { background:var(--bg-color); width:100%; max-width:320px; border-radius:12px; overflow:hidden; color:var(--text-color); }
  .dialog-title { padding:16px; font-weight:600; text-align:center; border-bottom:1px solid var(--border-light); }
  .dialog-content { padding:16px; font-size:14px; color:var(--text-secondary); text-align:center; line-height:1.5; }
  .dialog-footer { display:flex; border-top:1px solid var(--border-light); }
  .dialog-btn { flex:1; padding:14px 0; text-align:center; font-size:15px; cursor:pointer; border:none; background:transparent; color:var(--primary); }
  .dialog-btn:active { background:var(--input-bg); }
  .dialog-btn.cancel { color:var(--text-secondary); border-right:1px solid var(--border-light); }
  .dialog-btn.danger { color:#e53935; }

  .toast {
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
    font-size:13px; padding:8px 16px; border-radius:16px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body class="theme-sky">

<div id="app">
  <!-- 1. 列表页 -->
  <div class="page page-list" id="pageList">
    <div class="topbar">
      <div style="font-size:18px;font-weight:600;flex:1;padding-left:8px;">南洲舊夢</div>
      <button class="icon-btn" id="menuBtnList" style="color:var(--primary);">⋮</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <button class="fab" id="newChatBtn">＋</button>
  </div>

  <!-- 2. 新建/编辑页 -->
  <div class="page page-create" id="pageCreate">
    <div class="topbar">
      <button class="icon-btn" id="cancelCreateBtn">←</button>
      <div class="header-title" style="flex:1; text-align:center; font-size:17px;" id="createPageTitle">建立新對話</div>
      <div style="width:40px;"></div>
    </div>
    <div class="create-scroll">
      <div class="form-group"><input type="text" class="form-input" id="inputRoomName" placeholder="聊天室名稱"></div>
      <div style="height:1px;background:var(--topbar-border);margin:10px 0;"></div>
      <div class="form-group">
        <div class="form-label">祂的資料</div>
        <div class="avatar-upload" id="theirAvatar" onclick="document.getElementById('theirFile').click()">祂</div>
        <input type="file" id="theirFile" accept="image/*" style="display:none">
        <input type="text" class="form-input" id="inputTheirName" placeholder="名字">
        <input type="text" class="form-input" id="inputTheirNick" placeholder="暱稱">
        <input type="text" class="form-input" id="inputTheirSign" placeholder="簽名">
      </div>
      <div class="form-group">
        <div class="form-label">我的資料</div>
        <div class="avatar-upload" id="myAvatar" onclick="document.getElementById('myFile').click()">我</div>
        <input type="file" id="myFile" accept="image/*" style="display:none">
        <input type="text" class="form-input" id="inputMyName" placeholder="名字">
        <input type="text" class="form-input" id="inputMyNick" placeholder="暱稱">
        <input type="text" class="form-input" id="inputMySign" placeholder="簽名">
      </div>
      <div style="height:1px;background:var(--topbar-border);margin:10px 0;"></div>
      <div class="form-group">
        <div class="form-label">聊天背景 (可選)</div>
        <div class="bg-upload-box" id="bgUploadBox" onclick="document.getElementById('bgFile').click()">
          <span id="bgUploadText">點擊上傳背景圖</span>
        </div>
        <input type="file" id="bgFile" accept="image/*" style="display:none">
        <div class="slider-container" id="bgMaskContainer" style="display:none;">
          <span style="font-size:12px; color:var(--text-secondary);">遮罩</span>
          <input type="range" id="bgMaskSlider" min="0" max="90" value="60">
          <span id="bgMaskValue" style="font-size:12px; color:var(--text-secondary); width:30px; text-align:right;">60%</span>
        </div>
      </div>
      <button class="btn-primary" id="saveChatBtn">完成</button>
      <div style="height:20px;"></div>
    </div>
  </div>

  <!-- 3. 聊天页 -->
  <div class="page page-chat" id="pageChat">
    <div class="chat-bg-mask" id="chatBgMask"></div>
    <div class="topbar">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="avatar-sm" id="chatAvatar">祂</div>
      <div class="header-info">
        <div class="header-title" id="chatTitle">聊天室</div>
        <div class="header-sub" id="chatSub">最近曾上線</div>
      </div>
      <button class="icon-btn" id="callBtn">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">
          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
        </svg>
      </button>
    </div>
    <div class="messages-wrap" id="messagesWrap">
      <div class="messages" id="messages"></div>
    </div>
    
    <!-- 彻底删掉原来占位置的预览框，用隐藏类覆盖 -->
    <div class="pending-sticker-box"></div>

    <div class="composer">
      <button class="icon-btn" id="smallFuncBtn">
        <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;">

<div class="toast" id="toast"></div>

<script>
/* ============ 基础工具 ============ */
const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

/* ============ 主题与全局背景逻辑 ============ */
let globalBgImage = localStorage.getItem('nz_main_bg') || null;
let globalBgMask = parseInt(localStorage.getItem('nz_main_bg_mask') || '20');

function applyThemeAndBg() {
  let savedTheme = localStorage.getItem('nz_theme') || 'theme-sky';
  document.body.className = savedTheme;
  
  document.querySelectorAll('.theme-card').forEach(card => {
    card.classList.toggle('active', card.dataset.theme === savedTheme);
  });

  const appEl = $('#app');
  if (globalBgImage) {
    const isDark = savedTheme.includes('cyber') || savedTheme.includes('space') || savedTheme.includes('purple') || savedTheme.includes('pureblack');
    const maskColor = isDark ? `rgba(0,0,0, ${globalBgMask/100})` : `rgba(255,255,255, ${globalBgMask/100})`;
    appEl.style.background = `linear-gradient(${maskColor}, ${maskColor}), url(${globalBgImage}) center/cover no-repeat`;
  } else {
    appEl.style.background = 'var(--bg-color)';
  }
}

function setTheme(themeName) {
  localStorage.setItem('nz_theme', themeName);
  applyThemeAndBg();
  if (currentChatId) {
    const c = chats.find(x=>x.id===currentChatId);
    if(c && c.chatBgImage) {
      const bgMask = $('#chatBgMask');
      let maskVal = c.chatBgMask !== undefined ? c.chatBgMask : 60;
      const isDark = themeName.includes('cyber') || themeName.includes('space') || themeName.includes('purple') || themeName.includes('pureblack');
      bgMask.style.backgroundColor = isDark ? `rgba(0,0,0, ${maskVal/100})` : `rgba(255,255,255, ${maskVal/100})`;
    }
  }
}

function fileToBase64(file, callback) {
  const reader = new FileReader();
  reader.onload = e => callback(e.target.result);
  reader.readAsDataURL(file);
}

/* ============ IndexedDB ============ */
const DB_NAME = 'nanzhou_jiu_meng';
const DB_VER = 4; 
let db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('chats')) d.createObjectStore('chats', { keyPath:'id' });
      if(!d.objectStoreNames.contains('messages')) {
        const s = d.createObjectStore('messages', { keyPath:'id' });
        s.createIndex('chatId', 'chatId', { unique:false });
      }
      if(!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath:'id' });
      if(!d.objectStoreNames.contains('stickers')) d.createObjectStore('stickers', { keyPath:'id' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function reqToPromise(req){
  return new Promise((res, rej)=>{
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}

/* ============ 全局状态 ============ */
let chats = [];
let currentChatId = null;
let currentMessages = [];
let pendingStickerData = null; 
let tempTheirAvatar = null;
let tempMyAvatar = null;
let tempBgImage = null;
let tempBgMask = 60; 
let isEditingChatId = null;
let longPressTimer = null;
let activeChatForMenu = null;

/* ============ 初始化 ============ */
async function init(){
  await openDB();
  await loadChats();
  renderChatList();
  bindEvents();
  renderCards();
  applyThemeAndBg();
  if (globalBgImage) {
    $('#mainBgUploadBox').style.backgroundImage = `url(${globalBgImage})`;
    $('#mainBgText').textContent = '';
    $('#mainBgMaskContainer').style.display = 'flex';
    $('#mainBgMaskSlider').value = globalBgMask;
    $('#mainBgMaskValue').textContent = globalBgMask + '%';
  }
}

async function loadChats(){
  chats = await reqToPromise(tx('chats').getAll());
  chats.sort((a,b) => {
    const pinA = a.isPinned ? 1 : 0;
    const pinB = b.isPinned ? 1 : 0;
    if (pinA !== pinB) return pinB - pinA;
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
}

/* ============ 列表页渲染 ============ */
async function renderChatList(){
  const list = $('#chatList');
  if(!chats.length){
    list.innerHTML = '<div class="chat-empty">尚無聊天室<br>點右下角 ＋ 建立新對話</div>';
    return;
  }
  list.innerHTML = '';
  for(const c of chats){
    const msgs = await getMessages(c.id);
    const last = msgs[msgs.length-1];
    let preview = '尚無訊息';
    if(last){
      if(last.type === 'sticker') preview = '[貼紙]';
      else if(last.cards && last.cards.length) preview = last.cards[0];
      else if(last.text) preview = last.text;
      else if(last.stickerData) preview = '[圖片]';
    }
    
    const avatarHtml = c.theirAvatar 
      ? `<img src="${c.theirAvatar}" class="avatar-lg">` 
      : `<div class="avatar-lg">${(c.theirNick || c.theirName ||'祂').charAt(0)}</div>`;
      
    const row = document.createElement('div');
    row.className = 'chat-row' + (c.isPinned ? ' pinned' : '');
    row.dataset.id = c.id;
    
    row.innerHTML = `
      ${avatarHtml}
      <div class="chat-info">
        <div class="chat-top-row">
          <span class="chat-room-name">${escapeHtml(c.roomName || '未命名')}</span>
          <span class="chat-their-name">${escapeHtml(c.theirName || '')}</span>
        </div>
        <div class="chat-preview">${escapeHtml(preview)}</div>
      </div>
      <div class="chat-time">${last ? fmtTime(last.time) : ''}</div>
    `;
    
    row.onclick = () => { if(!longPressTimer) openChat(c.id); };
    row.addEventListener('touchstart', (e) => {
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        activeChatForMenu = c;
        openActionSheet();
      }, 500);
    }, { passive: true });
    row.addEventListener('touchend', () => { clearTimeout(longPressTimer); longPressTimer = null; });
    row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); longPressTimer = null; });
    list.appendChild(row);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(ts){
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString() === now.toDateString()) return '今天';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

/* ============ 消息逻辑 ============ */
function getMessages(chatId){
  return new Promise((res, rej)=>{
    const idx = tx('messages').index('chatId');
    const req = idx.getAll(chatId);
    req.onsuccess = ()=>{
      const arr = req.result || [];
      arr.sort((a,b)=>a.time-b.time);
      res(arr);
    };
    req.onerror = ()=>rej(req.error);
  });
}

async function openChat(id){
  currentChatId = id;
  const c = chats.find(x=>x.id===id);
  if(!c) return;
  
  $('#chatTitle').textContent = c.theirNick || c.theirName || '聊天室';
  $('#chatSub').textContent = c.theirSign || '最近曾上線';
  
  const avatarEl = $('#chatAvatar');
  if(c.theirAvatar) {
    avatarEl.innerHTML = `<img src="${c.theirAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
  } else {
    avatarEl.innerHTML = (c.theirNick || c.theirName || '祂').charAt(0);
  }

  const chatPage = $('#pageChat');
  const bgMask = $('#chatBgMask');
  if(c.chatBgImage) {
    chatPage.style.backgroundImage = `url(${c.chatBgImage})`;
    chatPage.style.backgroundColor = 'transparent';
    
    let maskVal = c.chatBgMask !== undefined ? c.chatBgMask : 60;
    const isDark = document.body.className.includes('cyber') || document.body.className.includes('space') || document.body.className.includes('purple') || document.body.className.includes('pureblack');
    bgMask.style.backgroundColor = isDark ? `rgba(0,0,0, ${maskVal/100})` : `rgba(255,255,255, ${maskVal/100})`;
  } else {
    // 没有单独背景，也透明，露出底下的全局背景
    chatPage.style.backgroundImage = 'none';
    chatPage.style.backgroundColor = 'transparent';
    bgMask.style.backgroundColor = 'transparent';
  }
  
  currentMessages = await getMessages(id);
  renderMessages();
  
  $('#msgInput').value = '';
  pendingStickerData = null;
  updateSendBtnState();
  
  $('#pageChat').classList.add('show');
}

function renderMessages(){
  const box = $('#messages');
  box.innerHTML = '';
  let lastDate = '';
  let prevSender = null;
  
  const c = chats.find(x=>x.id===currentChatId);
  
  for(const m of currentMessages){
    const dstr = fmtDate(m.time);
    if(dstr !== lastDate){
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dstr;
      box.appendChild(div);
      lastDate = dstr;
      prevSender = null;
    }
    const row = document.createElement('div');
    const senderClass = m.sender === 'me' ? 'me' : 'them';
    row.className = 'msg-row ' + senderClass;
    if(prevSender === m.sender) row.classList.add('grouped');

    let avatarHtml = '';
    if(m.sender === 'them') {
      if(c.theirAvatar) avatarHtml = `<img src="${c.theirAvatar}" class="msg-avatar">`;
      else avatarHtml = `<div class="msg-avatar">${(c.theirNick || c.theirName || '祂').charAt(0)}</div>`;
    } else {
      if(c.myAvatar) avatarHtml = `<img src="${c.myAvatar}" class="msg-avatar">`;
      else avatarHtml = `<div class="msg-avatar" style="background:#999">${(c.myNick || c.myName || '我').charAt(0)}</div>`;
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    let html = '';
    if(m.cards && m.cards.length){
      html += m.cards.map(c=>`<span class="card-line">${escapeHtml(c)}</span>`).join('');
    }
    if(m.text) html += `<span class="card-line">${escapeHtml(m.text)}</span>`;
    if(m.stickerData) html += `<img class="sticker-img" src="${m.stickerData}" alt="圖片">`;
    html += `<span class="meta">${fmtTime(m.time)}</span>`;
    
    bubble.innerHTML = html;
    row.innerHTML = avatarHtml;
    row.appendChild(bubble);
    box.appendChild(row);
    prevSender = m.sender;
  }
  box.scrollTop = box.scrollHeight;
}

/* ============ 发送逻辑 ============ */
function updateSendBtnState() {
  const text = $('#msgInput').value.trim();
  const btn = $('#sendBtn');
  if(text || pendingStickerData) {
    btn.disabled = false;
    btn.style.opacity = '0.9';
  } else {
    btn.disabled = true;
    btn.style.opacity = '0.5';
  }
}

async function sendMyMessage(){
  const input = $('#msgInput');
  const text = input.value.trim();
  if(!text && !pendingStickerData) return;
  if(!currentChatId){ toast('請先選擇聊天室'); return; }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'me',
    type: 'text',
    text: text,
    cards: [],
    stickerData: pendingStickerData,
    time: Date.now()
  };
  
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  
  input.value = '';
  pendingStickerData = null;
  updateSendBtnState();
  renderMessages();
  await touchChat(currentChatId);
  setTimeout(replyFromThem, 600);
}

async function touchChat(id){
  const c = chats.find(x=>x.id===id);
  if(!c) return;
  c.updatedAt = Date.now();
  await reqToPromise(tx('chats','readwrite').put(c));
  await loadChats();
}

async function replyFromThem(){
  if(!currentChatId) return;
  
  const cards = await reqToPromise(tx('cards').getAll());
  if(!cards.length){
    toast('郵電所中尚無電文，請先至「郵電所」新增');
    return;
  }
  
  const n = 3 + Math.floor(Math.random()*3); 
  const picked = [];
  const pool = [...cards];
  for(let i=0;i<n && pool.length;i++){
    const idx = Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0].text);
  }

  let stickerData = null;
  const stickers = await reqToPromise(tx('stickers').getAll());
  if(stickers.length && Math.random() < 0.4){
    const s = stickers[Math.floor(Math.random()*stickers.length)];
    stickerData = s.data;
  }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'them',
    type: 'cards',
    text: '',
    cards: picked,
    stickerData: stickerData,
    time: Date.now()
  };
  
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  renderMessages();
  await touchChat(currentChatId);
}

/* ============ 彈窗 ============ */
function showConfirm(title, text, okText, isDanger, onOk) {
  $('#confirmTitle').textContent = title;
  $('#confirmText').textContent = text;
  const okBtn = $('#confirmOkBtn');
  okBtn.textContent = okText;
  okBtn.className = 'dialog-btn ' + (isDanger ? 'danger' : '');
  $('#confirmDialogMask').classList.add('show');
  
  const newOkBtn = okBtn.cloneNode(true);
  okBtn.parentNode.replaceChild(newOkBtn, okBtn);
  newOkBtn.onclick = () => {
    $('#confirmDialogMask').classList.remove('show');
    if(onOk) onOk();
  };
}

/* ============ 郵電所：電文管理 ============ */
async function renderCards() {
  const cards = await reqToPromise(tx('cards').getAll());
  const list = $('#cardList');
  if(!cards.length){
    list.innerHTML = '<div style="text-align:center; color:var(--text-secondary); margin-top:20px;">尚無電文</div>';
    return;
  }
  list.innerHTML = '';
  cards.reverse().forEach(c => {
    const div = document.createElement('div');
    div.className = 'list-item-row';
    div.innerHTML = `
      <span class="list-item-text">${escapeHtml(c.text)}</span>
      <span style="color:#e53935; cursor:pointer; font-size:14px; padding:5px;" onclick="deleteCard('${c.id}')">刪除</span>
    `;
    list.appendChild(div);
  });
}

async function deleteCard(id) {
  await reqToPromise(tx('cards','readwrite').delete(id));
  renderCards();
  toast('電文已刪除');
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  // --- 新建/编辑 ---
  $('#newChatBtn').onclick = ()=>{
    isEditingChatId = null;
    $('#createPageTitle').textContent = '建立新對話';
    $('#inputRoomName').value = '';
    $('#inputTheirName').value = '';
    $('#inputTheirNick').value = '';
    $('#inputTheirSign').value = '';
    $('#inputMyName').value = '';
    $('#inputMyNick').value = '';
    $('#inputMySign').value = '';
    
    $('#theirAvatar').style.backgroundImage = '';
    $('#theirAvatar').textContent = '祂';
    $('#myAvatar').style.backgroundImage = '';
    $('#myAvatar').textContent = '我';
    
    $('#bgUploadBox').style.backgroundImage = '';
    $('#bgUploadText').textContent = '點擊上傳背景圖';
    $('#bgMaskContainer').style.display = 'none';
    $('#bgMaskSlider').value = 60;
    $('#bgMaskValue').textContent = '60%';
    
    tempTheirAvatar = null; tempMyAvatar = null; tempBgImage = null; tempBgMask = 60;
    
    $('#pageCreate').classList.add('show');
  };

  $('#cancelCreateBtn').onclick = ()=> $('#pageCreate').classList.remove('show');
  
  $('#theirFile').onchange = e => {
    if(e.target.files[0]) fileToBase64(e.target.files[0], b => { tempTheirAvatar = b; $('#theirAvatar').style.backgroundImage = `url(${b})`; $('#theirAvatar').textContent=''; });
  };
  $('#myFile').onchange = e => {
    if(e.target.files[0]) fileToBase64(e.target.files[0], b => { tempMyAvatar = b; $('#myAvatar').style.backgroundImage = `url(${b})`; $('#myAvatar').textContent=''; });
  };
  $('#bgFile').onchange = e => {
    if(e.target.files[0]) {
      fileToBase64(e.target.files[0], b => {
        tempBgImage = b;
        $('#bgUploadBox').style.backgroundImage = `url(${b})`;
        $('#bgUploadText').textContent = '';
        $('#bgMaskContainer').style.display = 'flex';
      });
    }
  };
  $('#bgMaskSlider').oninput = e => {
    tempBgMask = e.target.value;
    $('#bgMaskValue').textContent = tempBgMask + '%';
  };

  $('#saveChatBtn').onclick = async ()=>{
    const roomName = $('#inputRoomName').value.trim();
    const theirName = $('#inputTheirName').value.trim();
    const theirNick = $('#inputTheirNick').value.trim();
    const theirSign = $('#inputTheirSign').value.trim();
    const myName = $('#inputMyName').value.trim();
    const myNick = $('#inputMyNick').value.trim();
    const mySign = $('#inputMySign').value.trim();
    
    if(!roomName) { toast('請輸入聊天室名稱'); return; }
    
    if (isEditingChatId) {
      const c = chats.find(x=>x.id===isEditingChatId);
      if(c) {
        c.roomName = roomName; c.theirName = theirName; c.theirNick = theirNick; c.theirSign = theirSign;
        c.myName = myName; c.myNick = myNick; c.mySign = mySign;
        if (tempTheirAvatar !== null) c.theirAvatar = tempTheirAvatar;
        if (tempMyAvatar !== null) c.myAvatar = tempMyAvatar;
        if (tempBgImage !== null) {
          c.chatBgImage = tempBgImage;
          c.chatBgMask = tempBgMask;
        }
        await reqToPromise(tx('chats','readwrite').put(c));
        toast('資料已更新');
      }
    } else {
      const c = {
        id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        roomName, theirName, theirNick, theirSign, myName, myNick, mySign,
        theirAvatar: tempTheirAvatar, myAvatar: tempMyAvatar, 
        chatBgImage: tempBgImage, chatBgMask: tempBgMask,
        isPinned: false, createdAt: Date.now(), updatedAt: Date.now()
      };
      await reqToPromise(tx('chats','readwrite').add(c));
      toast('已建立新對話');
    }
    await loadChats(); renderChatList(); $('#pageCreate').classList.remove('show');
  };

  // --- 聊天页返回 ---
  $('#backBtn').onclick = ()=>{ $('#pageChat').classList.remove('show'); currentChatId = null; renderChatList(); };
  
  $('#sendBtn').onclick = sendMyMessage;
  $('#msgInput').addEventListener('input', updateSendBtnState);
  $('#msgInput').addEventListener('keydown', e=>{ if(e.key === 'Enter' && !e.isComposing) sendMyMessage(); });
  $('#callBtn').onclick = ()=> toast('通話功能尚未開放');
  
  // --- 长按菜单 ---
  const actionMask = $('#actionSheetMask');
  function closeActionSheet(){ actionMask.classList.remove('show'); }
  
  window.openActionSheet = function() {
    if(!activeChatForMenu) return;
    $('#actPin').textContent = activeChatForMenu.isPinned ? '取消釘選' : '釘選';
    actionMask.classList.add('show');
  };
  $('#actCancel').onclick = closeActionSheet;
  actionMask.onclick = e => { if(e.target === actionMask) closeActionSheet(); };

  $('#actPin').onclick = async () => {
    closeActionSheet(); if(!activeChatForMenu) return;
    activeChatForMenu.isPinned = !activeChatForMenu.isPinned;
    await reqToPromise(tx('chats','readwrite').put(activeChatForMenu));
    await loadChats(); renderChatList();
    toast(activeChatForMenu.isPinned ? '已釘選' : '已取消釘選');
  };

  $('#actEdit').onclick = () => {
    closeActionSheet(); if(!activeChatForMenu) return;
    isEditingChatId = activeChatForMenu.id;
    $('#createPageTitle').textContent = '編輯資料';
    $('#inputRoomName').value = activeChatForMenu.roomName || '';
    $('#inputTheirName').value = activeChatForMenu.theirName || '';
    $('#inputTheirNick').value = activeChatForMenu.theirNick || '';
    $('#inputTheirSign').value = activeChatForMenu.theirSign || '';
    $('#inputMyName').value = activeChatForMenu.myName || '';
    $('#inputMyNick').value = activeChatForMenu.myNick || '';
    $('#inputMySign').value = activeChatForMenu.mySign || '';
    
    tempTheirAvatar = null; tempMyAvatar = null; tempBgImage = null; tempBgMask = activeChatForMenu.chatBgMask || 60;
    
    const theirAvEl = $('#theirAvatar');
    if(activeChatForMenu.theirAvatar) { theirAvEl.style.backgroundImage = `url(${activeChatForMenu.theirAvatar})`; theirAvEl.textContent = ''; } else { theirAvEl.style.backgroundImage = ''; theirAvEl.textContent = '祂'; }
    const myAvEl = $('#myAvatar');
    if(activeChatForMenu.myAvatar) { myAvEl.style.backgroundImage = `url(${activeChatForMenu.myAvatar})`; myAvEl.textContent = ''; } else { myAvEl.style.backgroundImage = ''; myAvEl.textContent = '我'; }
    
    if(activeChatForMenu.chatBgImage) {
      $('#bgUploadBox').style.backgroundImage = `url(${activeChatForMenu.chatBgImage})`;
      $('#bgUploadText').textContent = '';
      $('#bgMaskContainer').style.display = 'flex';
      $('#bgMaskSlider').value = tempBgMask;
      $('#bgMaskValue').textContent = tempBgMask + '%';
    } else {
      $('#bgUploadBox').style.backgroundImage = '';
      $('#bgUploadText').textContent = '點擊上傳背景圖';
      $('#bgMaskContainer').style.display = 'none';
    }
    
    $('#pageCreate').classList.add('show');
  };

  $('#actClear').onclick = () => {
    closeActionSheet(); if(!activeChatForMenu) return;
    showConfirm('焚稿', '確定要焚毀該聊天記錄嗎？', '確定', false, async () => {
      const msgs = await getMessages(activeChatForMenu.id);
      for(const m of msgs) await reqToPromise(tx('messages','readwrite').delete(m.id));
      await touchChat(activeChatForMenu.id); renderChatList(); toast('紀錄已焚毀');
    });
  };

  $('#actDelete').onclick = () => {
    closeActionSheet(); if(!activeChatForMenu) return;
    showConfirm('焚毀', '確定要焚毀此會話嗎？', '焚毀', true, async () => {
      const msgs = await getMessages(activeChatForMenu.id);
      for(const m of msgs) await reqToPromise(tx('messages','readwrite').delete(m.id));
      await reqToPromise(tx('chats','readwrite').delete(activeChatForMenu.id));
      await loadChats(); renderChatList(); toast('會話已焚毀');
    });
  };

  $('#confirmCancelBtn').onclick = () => $('#confirmDialogMask').classList.remove('show');

  // --- 贴纸选择器 ---
  $('#stickerBtn').onclick = async ()=>{
    const stickers = await reqToPromise(tx('stickers').getAll());
    const list = $('#stickerList');
    if(!stickers.length) { toast('郵電所中尚無印花'); return; }
    list.innerHTML = '';
    stickers.forEach(s => {
      const img = document.createElement('img');
      img.src = s.data; img.style.cssText = 'width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;';
      img.onclick = () => { pendingStickerData = s.data; updateSendBtnState(); $('#stickerDialogMask').classList.remove('show'); };
      list.appendChild(img);
    });
    $('#stickerDialogMask').classList.add('show');
  };
  $('#closeStickerDialog').onclick = ()=> $('#stickerDialogMask').classList.remove('show');
  
  // --- 全局菜单 ---
  const mask = $('#menuMask');
  function openMenu(){ mask.classList.add('show'); }
  function closeMenu(){ mask.classList.remove('show'); }
  $('#menuBtnList').onclick = openMenu;
  mask.onclick = e=>{ if(e.target === mask) closeMenu(); };
  $('#menuPanel').onclick = e=>{
    const act = e.target.dataset.act;
    if(!act) return;
    closeMenu();
    handleMenu(act);
  };

  // --- 邮电所页面 ---
  $('#backPostOfficeBtn').onclick = ()=> $('#pagePostOffice').classList.remove('show');

  document.querySelectorAll('.tab-item').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      if(tab.dataset.tab === 'cards') {
        $('#tabContentCards').style.display = 'block';
        $('#tabContentOthers').style.display = 'none';
      } else {
        $('#tabContentCards').style.display = 'none';
        $('#tabContentOthers').style.display = 'block';
      }
    };
  });

  $('#addCardBtn').onclick = async () => {
    const text = $('#newCardInput').value.trim();
    if(!text) return;
    const card = { id: 'card_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), text };
    await reqToPromise(tx('cards', 'readwrite').add(card));
    $('#newCardInput').value = '';
    renderCards();
    toast('電文已新增');
  };

  // --- 佈景页面 ---
  $('#backSettingsBtn').onclick = ()=> $('#pageSettings').classList.remove('show');
  
  document.querySelectorAll('.theme-card').forEach(card => {
    card.onclick = () => setTheme(card.dataset.theme);
  });

  $('#mainBgFile').onchange = e => {
    if(e.target.files[0]) {
      fileToBase64(e.target.files[0], b => {
        globalBgImage = b;
        localStorage.setItem('nz_main_bg', b);
        applyThemeAndBg();
        $('#mainBgUploadBox').style.backgroundImage = `url(${b})`;
        $('#mainBgText').textContent = '';
        $('#mainBgMaskContainer').style.display = 'flex';
      });
    }
  };
  $('#mainBgMaskSlider').oninput = e => {
    globalBgMask = e.target.value;
    localStorage.setItem('nz_main_bg_mask', globalBgMask);
    $('#mainBgMaskValue').textContent = globalBgMask + '%';
    applyThemeAndBg();
  };
}

window.deleteCard = deleteCard;

function handleMenu(act){
  if(act === 'postoffice') $('#pagePostOffice').classList.add('show');
  else if(act === 'settings') $('#pageSettings').classList.add('show');
  else if(act === 'export') toast('存檔：匯出備份（待實作）');
  else if(act === 'clear') toast('焚稿：清空數據（待實作）');
  else if(act === 'about') toast('南洲誌：關於本網站（待實作）');
  else if(act === 'letters') toast('郵局：功能籌備中...');
  else if(act === 'messages') toast('簡訊：功能籌備中...');
}

/* ============ 启动 ============ */
init().catch(err=>{
  console.error(err);
  toast('資料庫初始化失敗，請重新整理');
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>南洲舊夢</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    font-family: -apple-system, "HarmonyOS Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background:#f0f2f5;
    color:#1a1a1a;
    overflow:hidden;
  }
  #app { height:100dvh; display:flex; flex-direction:column; position:relative; }

  /* 頂欄 */
  .topbar {
    height:56px; flex:0 0 56px;
    background:#ffffff;
    display:flex; align-items:center;
    padding:0 8px;
    border-bottom:1px solid #e4e6eb;
    position:relative; z-index:10;
  }
  .topbar .title {
    font-size:18px; font-weight:600; flex:1;
    padding-left:8px;
  }
  .topbar .title.center { text-align:center; padding-left:0; }
  .icon-btn {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; color:#3390ec; cursor:pointer;
    background:transparent; border:none;
  }
  .icon-btn:active { background:#e8f0fe; }

  /* 頁面容器 */
  .page { flex:1; overflow:hidden; position:relative; }
  .page-list, .page-chat { position:absolute; inset:0; display:flex; flex-direction:column; background:#f0f2f5; transition:transform .22s ease; }
  .page-list { z-index:2; }
  .page-chat { z-index:3; transform:translateX(100%); }
  .page-chat.show { transform:translateX(0); }

  /* 對話列表 */
  .chat-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .chat-row {
    display:flex; align-items:center; gap:12px;
    padding:10px 14px; background:#fff; cursor:pointer;
    border-bottom:1px solid #f0f2f5;
  }
  .chat-row:active { background:#f5f5f5; }
  .avatar {
    width:48px; height:48px; border-radius:50%;
    background:#3390ec; color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex:0 0 48px;
  }
  .chat-info { flex:1; min-width:0; }
  .chat-name { font-size:16px; font-weight:500; }
  .chat-preview { font-size:13px; color:#8a8a8a; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-time { font-size:12px; color:#8a8a8a; flex:0 0 auto; }
  .chat-empty { text-align:center; color:#8a8a8a; padding:40px 20px; font-size:14px; }

  /* 新建按鈕 */
  .fab {
    position:absolute; right:18px; bottom:22px;
    width:56px; height:56px; border-radius:50%;
    background:#3390ec; color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(51,144,236,.4);
    cursor:pointer; z-index:5; border:none;
  }

  /* 訊息區 */
  .messages {
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:10px 10px 6px;
    display:flex; flex-direction:column;
  }
  .date-divider {
    align-self:center;
    background:rgba(0,0,0,.18); color:#fff;
    font-size:12px; padding:3px 10px; border-radius:10px;
    margin:10px 0;
  }
  .msg-row { display:flex; margin:4px 0; }
  .msg-row.me { justify-content:flex-end; }
  .msg-row.them { justify-content:flex-start; }
  .msg-row.grouped { margin-top:2px; }
  .bubble {
    max-width:78%;
    padding:7px 10px 8px;
    border-radius:14px;
    position:relative;
    font-size:15px;
    line-height:1.45;
    word-break:break-word;
    box-shadow:0 1px 1px rgba(0,0,0,.08);
  }
  .msg-row.me .bubble {
    background:#d6ecff; color:#1a1a1a;
    border-bottom-right-radius:4px;
  }
  .msg-row.them .bubble {
    background:#ffffff; color:#1a1a1a;
    border-bottom-left-radius:4px;
  }
  .bubble .card-line { display:block; }
  .bubble .meta {
    float:right;
    font-size:11px; color:#8a8a8a;
    margin:6px 0 -2px 8px;
    line-height:1;
  }
  .bubble .sticker-img {
    display:block; max-width:160px; border-radius:10px; margin-top:6px;
  }
  .bubble.only-sticker { padding:4px; }

  /* 輸入區 */
  .composer {
    flex:0 0 auto;
    background:#ffffff;
    border-top:1px solid #e4e6eb;
    padding:6px 8px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
    display:flex; align-items:flex-end; gap:6px;
  }
  .composer .icon-btn { color:#6a6a6a; font-size:22px; }
  .composer input {
    flex:1; min-width:0;
    height:40px; border-radius:20px;
    border:none; background:#f0f2f5;
    padding:0 14px; font-size:15px; color:#1a1a1a;
    outline:none;
  }
  .send-btn {
    width:40px; height:40px; border-radius:50%;
    background:#3390ec; color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    font-size:18px; flex:0 0 40px; cursor:pointer;
  }
  .send-btn:disabled { background:#b8d4f0; }

  /* 遮罩選單 */
  .menu-mask {
    position:fixed; inset:0; background:rgba(0,0,0,.25);
    display:none; z-index:50;
  }
  .menu-mask.show { display:block; }
  .menu {
    position:absolute; top:56px; right:10px;
    background:#fff; border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
    min-width:150px; overflow:hidden;
  }
  .menu-item {
    padding:12px 18px; font-size:15px; color:#1a1a1a;
    cursor:pointer; white-space:nowrap;
  }
  .menu-item:active { background:#f0f2f5; }
  .menu-item.danger { color:#e53935; }

  /* 提示 */
  .toast {
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff;
    font-size:13px; padding:8px 16px; border-radius:16px;
    z-index:100; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body>
<div id="app">

  <!-- 對話列表頁 -->
  <div class="page-list" id="pageList">
    <div class="topbar">
      <div class="title">南洲舊夢</div>
      <button class="icon-btn" id="menuBtnList">⋮</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <button class="fab" id="newChatBtn">＋</button>
  </div>

  <!-- 聊天頁 -->
  <div class="page-chat" id="pageChat">
    <div class="topbar">
      <button class="icon-btn" id="backBtn">←</button>
      <div class="avatar" id="chatAvatar" style="width:36px;height:36px;flex:0 0 36px;font-size:16px;">祂</div>
      <div class="title" id="chatTitle" style="font-size:16px;font-weight:500;">聊天室</div>
      <button class="icon-btn" id="menuBtnChat">⋮</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="composer">
      <button class="icon-btn" id="stickerBtn">☺</button>
      <input type="text" id="msgInput" placeholder="輸入訊息…" autocomplete="off">
      <button class="send-btn" id="sendBtn">➤</button>
    </div>
  </div>

</div>

<!-- 選單 -->
<div class="menu-mask" id="menuMask">
  <div class="menu" id="menuPanel">
    <div class="menu-item" data-act="pouch">驛囊</div>
    <div class="menu-item" data-act="export">存檔</div>
    <div class="menu-item danger" data-act="clear">焚稿</div>
    <div class="menu-item" data-act="about">南洲誌</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ 基礎工具 ============ */
const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

/* ============ IndexedDB 基礎 ============ */
const DB_NAME = 'nanzhou_jiu_meng';
const DB_VER = 1;
let db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('chats')){
        d.createObjectStore('chats', { keyPath:'id' });
      }
      if(!d.objectStoreNames.contains('messages')){
        const s = d.createObjectStore('messages', { keyPath:'id' });
        s.createIndex('chatId', 'chatId', { unique:false });
      }
      if(!d.objectStoreNames.contains('cards')){
        d.createObjectStore('cards', { keyPath:'id' });
      }
      if(!d.objectStoreNames.contains('stickers')){
        d.createObjectStore('stickers', { keyPath:'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}

function tx(store, mode='readonly'){
  return db.transaction(store, mode).objectStore(store);
}
function reqToPromise(req){
  return new Promise((res, rej)=>{
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}

/* ============ 狀態 ============ */
let chats = [];
let currentChatId = null;
let currentMessages = [];

/* ============ 初始化 ============ */
async function init(){
  await openDB();
  await loadChats();
  renderChatList();
  bindEvents();
}

async function loadChats(){
  chats = await reqToPromise(tx('chats').getAll());
  chats.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
}

/* ============ 對話列表渲染 ============ */
async function renderChatList(){
  const list = $('#chatList');
  if(!chats.length){
    list.innerHTML = '<div class="chat-empty">尚無聊天室<br>點右下角 ＋ 新增</div>';
    return;
  }
  list.innerHTML = '';
  for(const c of chats){
    const msgs = await getMessages(c.id);
    const last = msgs[msgs.length-1];
    let preview = '尚無訊息';
    if(last){
      if(last.type === 'sticker') preview = '[貼紙]';
      else if(last.cards && last.cards.length) preview = last.cards[0];
      else if(last.text) preview = last.text;
    }
    const row = document.createElement('div');
    row.className = 'chat-row';
    row.innerHTML = `
      <div class="avatar">${(c.name||'祂').charAt(0)}</div>
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(c.name||'未命名')}</div>
        <div class="chat-preview">${escapeHtml(preview)}</div>
      </div>
      <div class="chat-time">${last ? fmtTime(last.time) : ''}</div>
    `;
    row.onclick = ()=>openChat(c.id);
    list.appendChild(row);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  if(sameDay) return '今天';
  return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`;
}

/* ============ 訊息讀取 ============ */
function getMessages(chatId){
  return new Promise((res, rej)=>{
    const store = tx('messages');
    const idx = store.index('chatId');
    const req = idx.getAll(chatId);
    req.onsuccess = ()=>{
      const arr = req.result || [];
      arr.sort((a,b)=>a.time-b.time);
      res(arr);
    };
    req.onerror = ()=>rej(req.error);
  });
}

/* ============ 打開聊天 ============ */
async function openChat(id){
  currentChatId = id;
  const c = chats.find(x=>x.id===id);
  if(!c) return;
  $('#chatTitle').textContent = c.name || '聊天室';
  $('#chatAvatar').textContent = (c.name||'祂').charAt(0);
  currentMessages = await getMessages(id);
  renderMessages();
  $('#pageChat').classList.add('show');
}

function renderMessages(){
  const box = $('#messages');
  box.innerHTML = '';
  let lastDate = '';
  let prevSender = null;
  for(const m of currentMessages){
    const dstr = fmtDate(m.time);
    if(dstr !== lastDate){
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dstr;
      box.appendChild(div);
      lastDate = dstr;
      prevSender = null;
    }
    const row = document.createElement('div');
    const senderClass = m.sender === 'me' ? 'me' : 'them';
    row.className = 'msg-row ' + senderClass;
    if(prevSender === m.sender) row.classList.add('grouped');

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    if(m.type === 'sticker' && m.stickerId){
      bubble.classList.add('only-sticker');
      bubble.innerHTML = `<img class="sticker-img" src="${m.stickerData || ''}" alt="貼紙">`;
    } else {
      let html = '';
      if(m.cards && m.cards.length){
        html += m.cards.map(c=>`<span class="card-line">${escapeHtml(c)}</span>`).join('');
      }
      if(m.text){
        html += `<span class="card-line">${escapeHtml(m.text)}</span>`;
      }
      if(m.stickerData){
        html += `<img class="sticker-img" src="${m.stickerData}" alt="貼紙">`;
      }
      html += `<span class="meta">${fmtTime(m.time)}</span>`;
      bubble.innerHTML = html;
    }
    row.appendChild(bubble);
    box.appendChild(row);
    prevSender = m.sender;
  }
  box.scrollTop = box.scrollHeight;
}

/* ============ 發送訊息 ============ */
async function sendMyMessage(){
  const input = $('#msgInput');
  const text = input.value.trim();
  if(!text) return;
  if(!currentChatId){ toast('請先選擇聊天室'); return; }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'me',
    type: 'text',
    text,
    cards: [],
    time: Date.now()
  };
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  input.value = '';
  renderMessages();
  await touchChat(currentChatId);

  // 觸發祂的回覆
  await replyFromThem();
}

async function touchChat(id){
  const c = chats.find(x=>x.id===id);
  if(!c) return;
  c.updatedAt = Date.now();
  await reqToPromise(tx('chats','readwrite').put(c));
}

/* ============ 祂的回覆 ============ */
async function replyFromThem(){
  const cards = await reqToPromise(tx('cards').getAll());
  if(!cards.length){
    toast('驛囊中尚無字卡，請先新增字卡');
    return;
  }
  const n = 3 + Math.floor(Math.random()*3); // 3~5
  const picked = [];
  const pool = [...cards];
  for(let i=0;i<n && pool.length;i++){
    const idx = Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0].text);
  }

  // 隨機附加貼紙
  let stickerData = null;
  const stickers = await reqToPromise(tx('stickers').getAll());
  if(stickers.length && Math.random() < 0.35){
    const s = stickers[Math.floor(Math.random()*stickers.length)];
    stickerData = s.data;
  }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'them',
    type: 'cards',
    text: '',
    cards: picked,
    stickerData,
    time: Date.now()
  };
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  renderMessages();
  await touchChat(currentChatId);
}

/* ============ 事件綁定 ============ */
function bindEvents(){
  $('#backBtn').onclick = ()=>{
    $('#pageChat').classList.remove('show');
    currentChatId = null;
    renderChatList();
  };

  $('#sendBtn').onclick = sendMyMessage;
  $('#msgInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.isComposing) sendMyMessage();
  });

  $('#newChatBtn').onclick = createChat;

  // 菜單
  const mask = $('#menuMask');
  const panel = $('#menuPanel');
  function openMenu(){
    mask.classList.add('show');
  }
  function closeMenu(){
    mask.classList.remove('show');
  }
  $('#menuBtnList').onclick = openMenu;
  $('#menuBtnChat').onclick = openMenu;
  mask.onclick = e=>{ if(e.target === mask) closeMenu(); };
  panel.onclick = e=>{
    const act = e.target.dataset.act;
    if(!act) return;
    closeMenu();
    handleMenu(act);
  };
}

function handleMenu(act){
  if(act === 'pouch') toast('驛囊：字卡與貼紙管理（待實作）');
  else if(act === 'export') toast('存檔：匯出備份（待實作）');
  else if(act === 'clear') toast('焚稿：清空記錄（待實作）');
  else if(act === 'about') toast('南洲誌：關於本網站（待實作）');
}

/* ============ 新建聊天室 ============ */
async function createChat(){
  const name = prompt('聊天室名稱：');
  if(!name || !name.trim()) return;
  const c = {
    id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    name: name.trim(),
    createdAt: Date.now(),
    updatedAt: Date.now()
  };
  await reqToPromise(tx('chats','readwrite').add(c));
  chats.unshift(c);
  renderChatList();
  toast('已建立聊天室');
}

/* ============ 啟動 ============ */
init().catch(err=>{
  console.error(err);
  toast('資料庫初始化失敗');
});
</script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>梦角字卡传讯 · 电码传讯</title>
<style>
  :root{
    --paper:#efe7d6; --paper-2:#f7f1e3; --paper-3:#e7dcc6;
    --ink:#3a3428; --ink-soft:#6b6150; --line:#c9bda3;
    --seal:#a23b2a; --shadow:rgba(58,52,40,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,monospace;
    background-image:linear-gradient(180deg,#f2ebdc,#e9dfcc);
    background-size:100% 100%;
  }
  #app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  /* 顶部 */
  header{
    padding:14px 16px 10px; border-bottom:1px dashed var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .title{font-size:16px;letter-spacing:2px;font-weight:700;}
  .title small{display:block;font-size:10px;color:var(--ink-soft);letter-spacing:1px;font-weight:400;}
  .drawers{margin-left:auto;display:flex;gap:8px;}
  .drawer-btn{
    border:1px solid var(--line); background:var(--paper-2); color:var(--ink);
    padding:7px 10px; border-radius:4px; font-family:inherit; font-size:12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; line-height:1.25;
  }
  .drawer-btn b{font-size:11px;font-weight:700;}
  .drawer-btn span{font-size:10px;color:var(--ink-soft);}
  /* 传讯记录 */
  .log{flex:1;padding:16px 14px 8px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;}
  .empty{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:36px;line-height:1.9;}
  /* 电报纸 */
  .letter{
    position:relative; border:1px solid var(--line); padding:12px 12px 10px;
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, rgba(58,52,40,.07) 27px 28px),
      var(--paper-2);
    box-shadow:2px 3px 0 var(--shadow);
  }
  .letter.dream{
    background:
      repeating-linear-gradient(180deg, transparent 0 27px, rgba(58,52,40,.07) 27px 28px),
      #efe4cf;
    border-color:#b9ab8e;
  }
  .letter .meta{font-size:10px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;}
  .telegram-text{font-size:17px;line-height:28px;letter-spacing:1px;white-space:pre-wrap;word-break:break-all;}
  .telegram-line{font-size:17px;line-height:28px;letter-spacing:1px;}
  .sign{text-align:right;font-size:10px;color:var(--ink-soft);letter-spacing:2px;margin-top:8px;}
  .seal{
    position:absolute;right:10px;bottom:6px;width:34px;height:34px;border:1.5px solid var(--seal);
    color:var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:9px;letter-spacing:1px;transform:rotate(-12deg);opacity:.85;
  }
  .stamp{
    position:absolute;right:12px;bottom:10px;width:46px;height:46px;object-fit:cover;
    border:1px solid var(--line);border-radius:3px;transform:rotate(4deg);box-shadow:1px 1px 0 var(--shadow);
  }
  .incoming{font-size:11px;color:var(--ink-soft);letter-spacing:2px;padding-left:6px;}
  /* 发报区 */
  .sendbar{border-top:1px dashed var(--line);padding:10px 14px 16px;background:linear-gradient(180deg,transparent,#e6dcc8);}
  .sendbar .hint{font-size:10px;color:var(--ink-soft);margin-bottom:8px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
  .sticker-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:34px;align-items:center;}
  .sticker-pick .st{
    width:30px;height:30px;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-shrink:0;cursor:pointer;background:#fbf7ec;
    display:flex;align-items:center;justify-content:center;
  }
  .sticker-pick .st img{width:100%;height:100%;object-fit:cover;}
  .sticker-pick .st.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset;}
  .sticker-pick .none{font-size:11px;color:var(--ink-soft);}
  .input-row{display:flex;gap:8px;margin-top:6px;}
  .input-row input{
    flex:1;padding:10px 10px;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);
    font-family:inherit;font-size:14px;border-radius:3px;
  }
  .sendbtn{
    padding:10px 16px;border:1px solid var(--ink);background:var(--ink);
    color:var(--paper-2);font-family:inherit;font-size:13px;letter-spacing:2px;border-radius:3px;cursor:pointer;white-space:nowrap;
  }
  .sendbtn:disabled{background:transparent;color:var(--ink-soft);border-color:var(--line);cursor:default;}
  /* 抽屉 */
  .overlay{position:fixed;inset:0;background:rgba(58,52,40,.35);display:none;align-items:flex-end;z-index:20;}
  .overlay.open{display:flex;}
  .panel{
    width:100%;max-width:640px;margin:0 auto;max-height:82vh;background:var(--paper-2);
    border-top:2px solid var(--ink);border-radius:14px 14px 0 0;display:flex;flex-direction:column;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .panel-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--line);}
  .panel-head b{font-size:13px;letter-spacing:2px;}
  .panel-head .close{margin-left:auto;border:none;background:none;font-family:inherit;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .panel-body{padding:12px 14px 20px;overflow-y:auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:10px;}
  /* 字卡 */
  .card{
    width:66px;height:66px;border:1px solid var(--line);background:#fbf7ec;
    border-radius:3px;position:relative;flex-shrink:0;perspective:400px;cursor:pointer;
  }
  .card-inner{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d;}
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .face{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    backface-visibility:hidden;overflow:hidden;border-radius:2px;
  }
  .face .ch{font-size:24px;}
  .face.back{
    transform:rotateY(180deg);background:#f1ead9;padding:4px;font-size:10px;color:var(--ink-soft);
    line-height:1.3;text-align:center;word-break:break-all;
  }
  .grid .del{
    position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;
    background:var(--seal);color:#fff;border:none;font-size:11px;line-height:18px;text-align:center;cursor:pointer;z-index:3;
  }
  /* 贴纸 */
  .sticker{
    width:66px;height:66px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fbf7ec;position:relative;
  }
  .sticker img{width:100%;height:100%;object-fit:cover;display:block;}
  .grid .del.s2{right:-6px;top:-6px;position:absolute;}
  .empty-note{font-size:12px;color:var(--ink-soft);line-height:2;text-align:center;padding:18px 0;}
  .form{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .form label{font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;letter-spacing:1px;}
  .form input[type=text]{
    padding:9px 10px;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);
    font-family:inherit;font-size:13px;border-radius:3px;
  }
  .form input[type=file]{font-size:11px;color:var(--ink-soft);}
  .form button{padding:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);font-family:inherit;font-size:13px;letter-spacing:2px;border-radius:3px;cursor:pointer;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:8px 16px;font-size:12px;border-radius:3px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none;letter-spacing:1px;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">梦角字卡传讯<small>DREAM · TELEGRAM</small></div>
    <div class="drawers">
      <button class="drawer-btn" id="openCode"><b>电码本</b><span id="cntCode">0 码</span></button>
      <button class="drawer-btn" id="openStamp"><b>邮戳册</b><span id="cntStamp">0 枚</span></button>
    </div>
  </header>

  <div class="log" id="log">
    <div class="empty" id="logEmpty">尚无传讯。<br>先到「电码本」录几码，再向梦角发报。</div>
  </div>

  <div class="sendbar">
    <div class="hint"><span>发报</span><span id="stickerInfo">未盖邮戳</span></div>
    <div class="sticker-pick" id="stickerPick"></div>
    <div class="input-row">
      <input id="msgInput" type="text" placeholder="写下要传的讯…" maxlength="80" />
      <button class="sendbtn" id="sendBtn">发报</button>
    </div>
  </div>
</div>

<!-- 抽屉 -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-head">
      <b id="panelTitle">电码本</b>
      <button class="close" id="closePanel">×</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== IndexedDB ========== */
let _db = null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej)=>{
    const req = indexedDB.open('dreamchat', 1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('codes')) d.createObjectStore('codes',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('stamps')) d.createObjectStore('stamps',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('messages')) d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess = e=>{ _db = e.target.result; res(_db); };
    req.onerror = ()=> rej(req.error);
  });
}
function tx(store, mode){ return db().then(d=> d.transaction(store, mode).objectStore(store)); }
function reqP(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

async function addCode(c){ const s=await tx('codes','readwrite'); return reqP(s.add(c)); }
async function allCodes(){ const s=await tx('codes','readonly'); return reqP(s.getAll()); }
async function delCode(id){ const s=await tx('codes','readwrite'); return reqP(s.delete(id)); }

async function addStamp(s0){ const s=await tx('stamps','readwrite'); return reqP(s.add(s0)); }
async function allStamps(){ const s=await tx('stamps','readonly'); return reqP(s.getAll()); }
async function delStamp(id){
  const s=await tx('stamps','readonly'); const st=await reqP(s.get(id));
  if(st && st.imageId){ const im=await tx('images','readwrite'); await reqP(im.delete(st.imageId)); }
  const s2=await tx('stamps','readwrite'); return reqP(s2.delete(id));
}

async function saveImage(blob){ const s=await tx('images','readwrite'); return reqP(s.add({blob})); }
async function getImage(id){ const s=await tx('images','readonly'); return reqP(s.get(id)); }

async function addMessage(m){ const s=await tx('messages','readwrite'); return reqP(s.add(m)); }
async function allMessages(){ const s=await tx('messages','readonly'); const a=await reqP(s.getAll()); return a.sort((x,y)=>x.createdAt-y.createdAt); }

/* ========== 图片压缩 ========== */
function compressImage(file, maxSide=800, quality=.8){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width:w, height:h} = img;
      const scale = Math.min(1, maxSide/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=> b?res(b):rej(new Error('compress fail')), 'image/webp', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('load fail')); };
    img.src = url;
  });
}

/* ========== 状态 ========== */
let codes = [];      // 电码（字卡）
let stamps = [];     // 邮戳（贴纸）
let messages = [];
let urlCache = {};   // imageId -> objectURL
let pickedStamp = null; // 本次发报选中的邮戳 id
let panelKind = 'code'; // code | stamp

const $ = id=>document.getElementById(id);
const logEl = $('log');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1500);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){
  const d = new Date(ts); const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function ensureUrl(imageId){
  if(!imageId || urlCache[imageId]) return urlCache[imageId] || null;
  const rec = await getImage(imageId);
  if(rec && rec.blob) urlCache[imageId] = URL.createObjectURL(rec.blob);
  return urlCache[imageId] || null;
}

/* ========== 渲染 ========== */
async function renderAll(){
  codes = await allCodes();
  stamps = await allStamps();
  messages = await allMessages();
  for(const st of stamps){ if(st.imageId) await ensureUrl(st.imageId); }
  renderCounts();
  renderLog();
  renderStickerPick();
}
function renderCounts(){
  $('cntCode').textContent = codes.length + ' 码';
  $('cntStamp').textContent = stamps.length + ' 枚';
}
function renderLog(){
  logEl.querySelectorAll('.letter,.incoming').forEach(n=>n.remove());
  $('logEmpty').style.display = messages.length ? 'none' : 'block';
  const codeMap = Object.fromEntries(codes.map(c=>[c.id,c]));
  const stampMap = Object.fromEntries(stamps.map(s=>[s.id,s]));
  let no = 0;
  for(const m of messages){
    if(m.sender==='me'){
      no++;
      const div = document.createElement('div');
      div.className = 'letter me';
      const stampHTML = m.stampId && stampMap[m.stampId] && urlCache[stampMap[m.stampId].imageId]
        ? `<img class="stamp" src="${urlCache[stampMap[m.stampId].imageId]}" alt="">` : '';
      div.innerHTML = `<div class="meta"><span>发报 NO.${String(no).padStart(3,'0')}</span><span>${fmtTime(m.createdAt)}</span></div>
        <div class="telegram-text">${esc(m.text||'')}</div>
        ${stampHTML ? '' : '<div class="sign">── 发报 ──</div>'}
        ${stampHTML}`;
      logEl.appendChild(div);
    }else{
      const lines = (m.lines||[]).map(lineIds=>{
        const txt = lineIds.map(id=> codeMap[id] ? codeMap[id].char : '').join('');
        return `<div class="telegram-line">${esc(txt)}</div>`;
      }).join('');
      const stampHTML = m.stampId && stampMap[m.stampId] && urlCache[stampMap[m.stampId].imageId]
        ? `<img class="stamp" src="${urlCache[stampMap[m.stampId].imageId]}" alt="">` : '';
      const div = document.createElement('div');
      div.className = 'letter dream';
      div.innerHTML = `<div class="meta"><span>回电</span><span>${fmtTime(m.createdAt)}</span></div>
        ${lines}
        <div class="seal">梦角</div>
        ${stampHTML}`;
      logEl.appendChild(div);
    }
  }
  logEl.scrollTop = logEl.scrollHeight;
}
function renderStickerPick(){
  const el = $('stickerPick');
  if(stamps.length===0){
    el.innerHTML = `<div class="none">邮戳册空，无法盖戳</div>`;
    $('stickerInfo').textContent = '未盖邮戳';
    return;
  }
  el.innerHTML = stamps.map(s=>{
    const url = urlCache[s.imageId] || '';
    return `<div class="st ${pickedStamp===s.id?'sel':''}" data-st="${s.id}"><img src="${url}" alt=""></div>`;
  }).join('');
  $('stickerInfo').textContent = pickedStamp ? '已选 1 枚邮戳' : '未盖邮戳';
}

/* ========== 抽屉 ========== */
async function openPanel(kind){
  panelKind = kind;
  $('panelTitle').textContent = kind==='code' ? '电码本' : '邮戳册';
  $('overlay').classList.add('open');
  await renderPanel();
}
function closePanel(){ $('overlay').classList.remove('open'); }

async function renderPanel(){
  const body = $('panelBody');
  if(panelKind==='code'){
    const list = codes;
    let gridHTML = '';
    if(list.length===0){
      gridHTML = `<div class="empty-note" id="gridEmpty">电码本空空的。<br>在下面录几码进去。</div>`;
    }else{
      gridHTML = `<div class="grid">${list.map(c=>{
        const back = c.back ? esc(c.back) : '（无备注）';
        return `<div class="card" data-code="${c.id}">
          <div class="card-inner">
            <div class="face"><span class="ch">${esc(c.char||'？')}</span></div>
            <div class="face back">${back}</div>
          </div>
          <button class="del" data-delcode="${c.id}">×</button>
        </div>`;
      }).join('')}</div>`;
    }
    body.innerHTML = `${gridHTML}
      <div class="form">
        <label>码字（正面）
          <input type="text" id="fChar" placeholder="如：想" maxlength="4" />
        </label>
        <label>背面备注（可选）
          <input type="text" id="fBack" placeholder="记下这码的来处/含义" maxlength="40" />
        </label>
        <button id="addCodeBtn">录电码</button>
      </div>`;
    $('addCodeBtn').addEventListener('click', onAddCode);
    body.querySelectorAll('.card[data-code]').forEach(card=>{
      card.addEventListener('click', e=>{
        if(e.target.closest('[data-delcode]')) return;
        card.classList.toggle('flipped');
      });
    });
    body.querySelectorAll('[data-delcode]').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        const id = Number(btn.dataset.delcode);
        if(!confirm('从电码本删去此码？')) return;
        await delCode(id);
        await renderAll(); await renderPanel();
      });
    });
  }else{
    const list = stamps;
    let gridHTML = '';
    if(list.length===0){
      gridHTML = `<div class="empty-note">邮戳册空空的。<br>在下面收几枚邮戳进去。</div>`;
    }else{
      gridHTML = `<div class="grid">${list.map(s=>{
        const url = urlCache[s.imageId] || '';
        return `<div class="sticker"><img src="${url}" alt=""><button class="del s2" data-delstamp="${s.id}">×</button></div>`;
      }).join('')}</div>`;
    }
    body.innerHTML = `${gridHTML}
      <div class="form">
        <label>邮戳图片（会自动压缩）
          <input type="file" id="fStamp" accept="image/*" />
        </label>
        <button id="addStampBtn">收邮戳</button>
      </div>`;
    $('addStampBtn').addEventListener('click', onAddStamp);
    body.querySelectorAll('[data-delstamp]').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        const id = Number(btn.dataset.delstamp);
        if(!confirm('从邮戳册删去此戳？')) return;
        await delStamp(id);
        if(pickedStamp===id) pickedStamp = null;
        await renderAll(); await renderPanel();
      });
    });
  }
}

/* ========== 录电码 / 收邮戳 ========== */
async function onAddCode(){
  const ch = $('fChar').value.trim();
  const back = $('fBack').value.trim();
  if(!ch){ toast('至少写一个码字'); return; }
  await addCode({ char: ch, back, createdAt: Date.now() });
  $('fChar').value=''; $('fBack').value='';
  toast('已录入电码');
  await renderAll(); await renderPanel();
}
async function onAddStamp(){
  const file = $('fStamp').files[0];
  if(!file){ toast('选一张邮戳图'); return; }
  let blob;
  try{ blob = await compressImage(file); }catch(e){ toast('图片处理失败'); return; }
  const imageId = await saveImage(blob);
  await addStamp({ imageId, createdAt: Date.now() });
  $('fStamp').value='';
  toast('已收邮戳');
  await renderAll(); await renderPanel();
}

/* ========== 发报 & 梦角查电码回电 ========== */
async function send(){
  const input = $('msgInput');
  const text = input.value.trim();
  if(!text){ toast('写下要传的讯'); return; }
  await addMessage({ sender:'me', text, stampId: pickedStamp, createdAt: Date.now() });
  input.value = '';
  pickedStamp = null;
  renderStickerPick();

  if(codes.length > 0){
    const inc = document.createElement('div');
    inc.className = 'incoming';
    inc.textContent = '滴滴滴…收到回电';
    logEl.appendChild(inc);
    logEl.scrollTop = logEl.scrollHeight;
    await new Promise(r=>setTimeout(r,650));

    const lineCount = 1 + Math.floor(Math.random()*3); // 1~3 行
    const lines = [];
    for(let i=0;i<lineCount;i++){
      const n = Math.min(1 + Math.floor(Math.random()*3), codes.length); // 每行 1~3 张
      const pool = [...codes];
      const line = [];
      for(let k=0;k<n && pool.length;k++){
        const idx = Math.floor(Math.random()*pool.length);
        line.push(pool.splice(idx,1)[0].id);
      }
      lines.push(line);
    }
    // 40% 概率盖邮戳
    let stampId = null;
    if(stamps.length && Math.random() < 0.4){
      stampId = stamps[Math.floor(Math.random()*stamps.length)].id;
    }
    await addMessage({ sender:'dream', lines, stampId, createdAt: Date.now() });
  }else{
    toast('电码本空，梦角查不到码');
  }
  await renderAll();
}

/* ========== 事件 ========== */
$('openCode').addEventListener('click', ()=>openPanel('code'));
$('openStamp').addEventListener('click', ()=>openPanel('stamp'));
$('closePanel').addEventListener('click', closePanel);
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) closePanel(); });
$('sendBtn').addEventListener('click', send);
$('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
$('stickerPick').addEventListener('click', e=>{
  const st = e.target.closest('[data-st]');
  if(!st) return;
  const id = Number(st.dataset.st);
  pickedStamp = pickedStamp === id ? null : id;
  renderStickerPick();
});

/* ========== 启动 ========== */
renderAll().catch(err=>{ console.error(err); toast('本地存储初始化失败'); });
</script>
</body>
</html>

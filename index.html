<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>南洲旧梦</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&display=swap');

  :root {
    --ink: #110e0a;
    --ink-light: #1e1a14;
    --gold: #c9a84c;
    --gold-bright: #e0c068;
    --gold-dim: #7a6830;
    --gold-faint: rgba(201,168,76,.12);
    --paper: #f0e6ce;
    --paper-dim: #c8b896;
    --navy: #1b2a3d;
    --navy-light: #263d56;
    --seal-red: #8b2500;
    --seal-dark: #5a1000;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    background: var(--ink);
    color: var(--paper);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ========== 背景纹理 ========== */
  .bg-texture {
    position: fixed; top:0; left:0; right:0; bottom:0;
    pointer-events: none; z-index: 0;
    background:
      /* 旧纸底色 */
      linear-gradient(180deg, #1a1610 0%, var(--ink) 40%, #141018 100%);
  }
  .bg-texture::before {
    content: "";
    position: absolute; inset: 0;
    background:
      /* 海图网格暗纹 */
      repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(201,168,76,.018) 39px, rgba(201,168,76,.018) 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(201,168,76,.018) 39px, rgba(201,168,76,.018) 40px);
  }
  .bg-texture::after {
    content: "";
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(201,168,76,.04), transparent 50%),
      radial-gradient(ellipse at 70% 80%, rgba(27,42,61,.08), transparent 50%),
      radial-gradient(ellipse at 50% 50%, rgba(139,37,0,.02), transparent 70%);
    animation: glowPulse 8s ease-in-out infinite alternate;
  }
  @keyframes glowPulse {
    0% { opacity: .6; }
    100% { opacity: 1; }
  }

  /* ========== 页面容器 ========== */
  .page {
    display: none; height: 100vh; flex-direction: column;
    position: relative; z-index: 1;
  }
  .page.active { display: flex; }

  /* ========== 顶部栏 ========== */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px; height: 52px; flex-shrink: 0;
    background: linear-gradient(180deg, rgba(20,16,10,.97), rgba(20,16,10,.85));
    border-bottom: 1px solid var(--gold-dim);
    position: relative;
  }
  .header::after {
    content: ""; position: absolute; bottom: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .header h1 {
    font-size: 17px; font-weight: 400;
    letter-spacing: 6px; color: var(--gold);
    text-shadow: 0 0 12px rgba(201,168,76,.2);
  }
  .header-btn {
    background: none;
    border: 1px solid var(--gold-dim);
    color: var(--gold);
    padding: 5px 14px;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
  }
  .header-btn:active {
    background: var(--gold);
    color: var(--ink);
    border-color: var(--gold);
  }

  /* ========== 聊天区 ========== */
  .chat-area {
    flex: 1; overflow-y: auto; padding: 16px 14px;
    scroll-behavior: smooth;
  }
  .chat-area::-webkit-scrollbar { width: 3px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--gold-dim); border-radius: 2px; }

  /* 时间分隔 */
  .time-divider {
    text-align: center; margin: 20px 0;
    font-size: 11px; color: var(--gold-dim);
    letter-spacing: 3px;
  }
  .time-divider::before,
  .time-divider::after {
    content: "✦"; margin: 0 10px; font-size: 8px;
    vertical-align: middle; opacity: .5;
  }

  /* ========== 消息 ========== */
  .msg {
    margin-bottom: 18px;
    animation: msgIn .6s cubic-bezier(.22,.68,.36,1);
  }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(12px); filter: blur(2px); }
    to   { opacity: 1; transform: translateY(0); filter: blur(0); }
  }

  .msg .label {
    font-size: 10px; color: var(--gold-dim);
    margin-bottom: 5px; letter-spacing: 3px;
  }
  .msg.you .label { text-align: right; }

  .msg .bubble {
    display: inline-block;
    max-width: 82%;
    padding: 12px 16px;
    line-height: 1.8;
    font-size: 14.5px;
    position: relative;
    word-break: break-all;
  }

  /* 殿下（你）的消息 — 深色信笺 */
  .msg.you .bubble {
    background: linear-gradient(135deg, rgba(27,42,61,.55), rgba(27,42,61,.35));
    border: 1px solid rgba(201,168,76,.18);
    border-right: 2px solid var(--navy-light);
    margin-left: auto;
    display: block;
    text-align: left;
    box-shadow: -2px 2px 8px rgba(0,0,0,.3);
  }

  /* 柏源的消息 — 浅色信笺 */
  .msg.him .bubble {
    background: linear-gradient(135deg, rgba(240,230,206,.09), rgba(240,230,206,.04));
    border: 1px solid rgba(201,168,76,.15);
    border-left: 2px solid var(--gold);
    box-shadow: 2px 2px 8px rgba(0,0,0,.25);
  }
  .msg.him .bubble::before {
    content: "";
    position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      180deg, transparent, transparent 22px,
      rgba(201,168,76,.03) 22px, rgba(201,168,76,.03) 23px
    );
    pointer-events: none;
  }

  /* 类型标签 */
  .msg .type-tag {
    display: inline-block;
    font-size: 10px; color: var(--gold-dim);
    border: 1px solid rgba(201,168,76,.25);
    padding: 1px 6px;
    margin-bottom: 5px;
    letter-spacing: 1px;
    background: rgba(201,168,76,.04);
  }

  /* ========== 空状态 ========== */
  .empty-state {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; padding: 32px;
  }
  .empty-state .seal-icon {
    font-size: 48px; margin-bottom: 16px;
    opacity: .35;
    animation: sealFloat 4s ease-in-out infinite;
  }
  @keyframes sealFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .empty-state .title {
    font-size: 17px; color: var(--gold);
    margin-bottom: 10px; letter-spacing: 4px;
  }
  .empty-state .hint {
    font-size: 13px; color: var(--gold-dim);
    line-height: 2; letter-spacing: 1px;
  }
  .empty-state .go-btn {
    margin-top: 24px;
    padding: 10px 28px;
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 3px;
    cursor: pointer;
    font-family: inherit;
    transition: all .25s;
  }
  .empty-state .go-btn:active {
    background: var(--gold);
    color: var(--ink);
  }

  /* ========== 底部输入区 ========== */
  .input-bar {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px 14px;
    background: linear-gradient(0deg, rgba(17,14,10,.97), rgba(17,14,10,.8));
    border-top: 1px solid var(--gold-dim);
    flex-shrink: 0;
    position: relative;
  }
  .input-bar::before {
    content: ""; position: absolute; top: -1px; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }
  .input-bar input {
    flex: 1;
    background: rgba(240,230,206,.05);
    border: 1px solid rgba(201,168,76,.2);
    color: var(--paper);
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    letter-spacing: 1px;
    transition: border-color .2s;
  }
  .input-bar input:focus {
    border-color: var(--gold);
  }
  .input-bar input::placeholder {
    color: var(--gold-dim);
    letter-spacing: 2px;
  }

  /* 火漆印章按钮 */
  .seal-btn {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #a03010, var(--seal-red) 50%, var(--seal-dark));
    border: 2px solid var(--gold);
    color: var(--gold-bright);
    font-size: 13px;
    letter-spacing: 1px;
    cursor: pointer;
    flex-shrink: 0;
    font-family: inherit;
    box-shadow:
      0 2px 8px rgba(139,37,0,.4),
      inset 0 1px 2px rgba(255,255,255,.1);
    transition: all .15s;
    position: relative;
  }
  .seal-btn:active {
    transform: scale(.9);
    box-shadow:
      0 1px 4px rgba(139,37,0,.3),
      inset 0 2px 4px rgba(0,0,0,.3);
  }
  .seal-btn::after {
    content: "";
    position: absolute; inset: 3px;
    border-radius: 50%;
    border: 1px solid rgba(201,168,76,.3);
  }

  /* ========== 信匣页 ========== */
  .chest-tabs {
    display: flex;
    border-bottom: 1px solid var(--gold-dim);
    flex-shrink: 0;
    background: rgba(20,16,10,.6);
  }
  .chest-tabs button {
    flex: 1; padding: 12px 0;
    background: none; border: none;
    color: var(--gold-dim);
    font-size: 13px; letter-spacing: 3px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    font-family: inherit;
    transition: all .2s;
  }
  .chest-tabs button.active {
    color: var(--gold);
    border-bottom-color: var(--gold);
    text-shadow: 0 0 8px rgba(201,168,76,.2);
  }

  .chest-list {
    flex: 1; overflow-y: auto; padding: 12px 14px;
  }
  .chest-list::-webkit-scrollbar { width: 3px; }
  .chest-list::-webkit-scrollbar-thumb { background: var(--gold-dim); }

  .chest-item {
    background: rgba(240,230,206,.04);
    border: 1px solid rgba(201,168,76,.1);
    padding: 12px 14px;
    margin-bottom: 8px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    transition: background .2s;
  }
  .chest-item:active {
    background: rgba(201,168,76,.06);
  }
  .chest-item .text {
    font-size: 14px; line-height: 1.7;
    flex: 1; word-break: break-all;
    color: var(--paper-dim);
  }
  .chest-item .del {
    background: none; border: none;
    color: rgba(139,64,64,.6);
    font-size: 14px;
    cursor: pointer;
    padding: 4px 8px;
    font-family: inherit;
    margin-left: 8px;
  }
  .chest-item .del:active { color: #c04040; }

  .chest-empty {
    text-align: center;
    color: var(--gold-dim);
    font-size: 13px;
    padding: 48px 0;
    letter-spacing: 2px;
    opacity: .6;
  }

  /* ========== 添加页 ========== */
  .add-page {
    padding: 20px 16px;
    flex: 1; overflow-y: auto;
  }
  .add-page label {
    display: block;
    font-size: 12px;
    color: var(--gold-dim);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .add-page textarea,
  .add-page input[type="text"] {
    width: 100%;
    background: rgba(240,230,206,.05);
    border: 1px solid rgba(201,168,76,.2);
    color: var(--paper);
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    outline: none;
    margin-bottom: 20px;
    resize: vertical;
    letter-spacing: 1px;
    line-height: 1.8;
    transition: border-color .2s;
  }
  .add-page textarea:focus,
  .add-page input:focus {
    border-color: var(--gold);
  }
  .add-page textarea { min-height: 140px; }
  .add-page textarea::placeholder,
  .add-page input::placeholder {
    color: var(--gold-dim);
    letter-spacing: 2px;
    opacity: .5;
  }

  .add-save {
    width: 100%;
    padding: 13px;
    background: linear-gradient(135deg, var(--gold), var(--gold-dim));
    color: var(--ink);
    border: none;
    font-size: 14px;
    letter-spacing: 4px;
    cursor: pointer;
    font-family: inherit;
    font-weight: 700;
    transition: opacity .2s;
  }
  .add-save:active { opacity: .75; }

  /* ========== 底部导航 ========== */
  .bottom-nav {
    display: flex;
    border-top: 1px solid var(--gold-dim);
    flex-shrink: 0;
    background: rgba(20,16,10,.8);
  }
  .bottom-nav button {
    flex: 1; padding: 12px 0;
    background: none; border: none;
    color: var(--gold-dim);
    font-size: 12px; letter-spacing: 2px;
    cursor: pointer;
    font-family: inherit;
    transition: color .2s;
  }
  .bottom-nav button:active { color: var(--gold); }

  /* ========== 打字指示器 ========== */
  .typing-indicator {
    display: none;
    margin-bottom: 18px;
    padding: 0 4px;
  }
  .typing-indicator .dots {
    display: inline-flex; gap: 4px;
  }
  .typing-indicator .dots span {
    width: 6px; height: 6px;
    background: var(--gold-dim);
    border-radius: 50%;
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .typing-indicator .dots span:nth-child(2) { animation-delay: .2s; }
  .typing-indicator .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(.6); opacity: .3;
  .typing-indicator .dots span {
    width: 6px; height: 6px;
    background: var(--gold-dim);
    border-radius: 50%;
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .typing-indicator .dots span:nth-child(2) { animation-delay: .2s; }
  .typing-indicator .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes dotBounce {
    0%, 80%, 100% { transform: scale(.6); opacity: .3; }
    40% { transform: scale(1); opacity: 1; }
  }
</style>
</head>
<body>

<div class="bg-texture"></div>

<!-- ===== 聊天页 ===== -->
<div class="page active" id="pageChat">
  <div class="header">
    <button class="header-btn" onclick="showPage('chest')">信匣</button>
    <h1>南洲旧梦</h1>
    <div style="width:60px"></div>
  </div>
  <div class="chat-area" id="chatArea">
    <div class="empty-state" id="emptyState">
      <div class="seal-icon"></div>
      <div class="title">信笺尚空</div>
      <div class="hint">
        殿下，尚未落笔。<br>
        写下第一句话，或从信匣中取出一封旧信。
      </div>
      <button class="go-btn" onclick="showPage('add')">启 笔</button>
    </div>
    <div class="typing-indicator" id="typingIndicator">
      <div class="label" style="font-size:10px;color:var(--gold-dim);margin-bottom:5px;letter-spacing:3px">他正在回信</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>
  </div>
  <div class="input-bar">
    <input id="chatInput" placeholder="在此落笔…" onkeydown="if(event.key==='Enter')sendMsg()"/>
    <button class="seal-btn" onclick="sendMsg()">寄</button>
  </div>
</div>

<!-- ===== 信匣页 ===== -->
<div class="page" id="pageChest">
  <div class="header">
    <button class="header-btn" onclick="showPage('chat')">返回</button>
    <h1>信 匣</h1>
    <button class="header-btn" onclick="showPage('add')">新信</button>
  </div>
  <div class="chest-tabs">
    <button class="active" onclick="switchTab(this,'draft')">草稿</button>
    <button onclick="switchTab(this,'preset')">预设</button>
  </div>
  <div class="chest-list" id="chestList"></div>
  <div class="bottom-nav">
    <button onclick="showPage('chat')">对 话</button>
    <button onclick="showPage('add')">启 笔</button>
  </div>
</div>

<!-- ===== 添加页 ===== -->
<div class="page" id="pageAdd">
  <div class="header">
    <button class="header-btn" onclick="showPage('chat')">取消</button>
    <h1>启 笔</h1>
    <div style="width:60px"></div>
  </div>
  <div class="add-page">
    <label>类型标签（可选）</label>
    <input type="text" id="inputType" placeholder="如：日常、思念、问询…"/>
    <label>信的内容</label>
    <textarea id="inputContent" placeholder="写下你想对他说的话…"></textarea>
    <button class="add-save" onclick="saveDraft()">封 存</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'nanzhou_data_v2';
let currentTab = 'draft';
let data = loadData();

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return { drafts: [], presets: [], messages: [] };
}
function saveData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  if (name === 'chat') {
    document.getElementById('pageChat').classList.add('active');
    renderChat();
  } else if (name === 'chest') {
    document.getElementById('pageChest').classList.add('active');
    renderChest();
  } else if (name === 'add') {
    document.getElementById('pageAdd').classList.add('active');
  }
}

function switchTab(el, tab) {
  currentTab = tab;
  el.parentElement.querySelectorAll('button').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderChest();
}

function renderChest() {
  const list = document.getElementById('chestList');
  const items = currentTab === 'draft' ? data.drafts : data.presets;
  if (!items.length) {
    list.innerHTML = '<div class="chest-empty">匣中空空，尚无存信</div>';
    return;
  }
  list.innerHTML = items.map((it, i) => `
    <div class="chest-item" onclick="useDraft(${i})">
      <div class="text">${it.type ? '<span class="type-tag">'+esc(it.type)+'</span> ' : ''}${esc(it.content)}</div>
      <button class="del" onclick="event.stopPropagation();delItem(${i})">✕</button>
    </div>
  `).join('');
}

function delItem(i) {
  const arr = currentTab === 'draft' ? data.drafts : data.presets;
  arr.splice(i, 1);
  saveData();
  renderChest();
}

function useDraft(i) {
  const arr = currentTab === 'draft' ? data.drafts : data.presets;
  const item = arr[i];
  if (!item) return;
  showPage('chat');
  document.getElementById('chatInput').value = item.content;
  sendMsg();
}

function saveDraft() {
  const content = document.getElementById('inputContent').value.trim();
  const type = document.getElementById('inputType').value.trim();
  if (!content) return;
  data.drafts.unshift({ content, type, time: Date.now() });
  saveData();
  document.getElementById('inputContent').value = '';
  document.getElementById('inputType').value = '';
  showPage('chat');
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function sendMsg() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  const empty = document.getElementById('emptyState');
  if (empty) empty.style.display = 'none';

  data.messages.push({ role: 'you', content: text, time: Date.now() });
  saveData();
  renderChat();

  // 模拟他回信
  const typing = document.getElementById('typingIndicator');
  typing.style.display = 'block';
  scrollBottom();

  setTimeout(() => {
    typing.style.display = 'none';
    const reply = generateReply(text);
    data.messages.push({ role: 'him', content: reply, time: Date.now() });
    saveData();
    renderChat();
  }, 1200 + Math.random() * 1000);
}

function generateReply(text) {
  const replies = [
    "殿下，我在。",
    "你说，我听着。",
    "南洲的风今日很轻，适合说这些话。",
    "嗯，我记下了。",
    "殿下不必顾虑，尽管说。",
    "……好。",
    "我知道了，殿下。",
    "你在，我便安心。",
    "这话，我只对殿下说。",
    "殿下今日，似乎有心事？"
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

function renderChat() {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('emptyState');
  const typing = document.getElementById('typingIndicator');

  // 保留 typing 和 empty 元素，重建其他消息
  const existing = area.querySelectorAll('.msg, .time-divider');
  existing.forEach(el => el.remove());

  if (!data.messages.length) {
    if (empty) empty.style.display = '';
    return;
  }
  if (empty) empty.style.display = 'none';

  let lastDate = '';
  data.messages.forEach(msg => {
    const date = new Date(msg.time).toLocaleDateString('zh-CN');
    if (date !== lastDate) {
      lastDate = date;
      const div = document.createElement('div');
      div.className = 'time-divider';
      div.textContent = date;
      area.insertBefore(div, typing);
    }
    const el = document.createElement('div');
    el.className = 'msg ' + (msg.role === 'you' ? 'you' : 'him');
    const tag = msg.type ? `<div class="type-tag">${esc(msg.type)}</div>` : '';
    el.innerHTML = `
      <div class="label">${msg.role === 'you' ? '殿 下' : '柏 源'}</div>
      ${tag}
      <div class="bubble">${esc(msg.content)}</div>
    `;
    area.insertBefore(el, typing);
  });
  scrollBottom();
}

function scrollBottom() {
  const area = document.getElementById('chatArea');
  setTimeout(() => area.scrollTop = area.scrollHeight, 50);
}

// 初始化
renderChat();
</script>
</body>
</html>

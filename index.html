<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>南洲旧梦</title>
<style>
  :root{
    --paper:#efe7d6; --paper-2:#f7f1e3; --paper-3:#e7dcc6;
    --ink:#3a3428; --ink-soft:#6b6150; --line:#c9bda3;
    --seal:#a23b2a; --shadow:rgba(58,52,40,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,monospace;
    background-image:
      radial-gradient(rgba(58,52,40,.05) 1px, transparent 1px),
      linear-gradient(180deg, #f2ebdc, #e9dfcc);
    background-size:5px 5px, 100% 100%;
  }
  #app{max-width:640px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;}
  /* 顶部 */
  header{
    padding:14px 16px 10px; border-bottom:1px dashed var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .title{font-size:16px;letter-spacing:2px;font-weight:700;}
  .title small{display:block;font-size:10px;color:var(--ink-soft);letter-spacing:1px;font-weight:400;}
  .drawers{margin-left:auto;display:flex;gap:8px;}
  .drawer-btn{
    border:1px solid var(--line); background:var(--paper-2); color:var(--ink);
    padding:7px 10px; border-radius:4px; font-family:inherit; font-size:12px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; line-height:1.2;
  }
  .drawer-btn b{font-size:11px;font-weight:700;}
  .drawer-btn span{font-size:10px;color:var(--ink-soft);}
  /* 传讯记录 */
  .log{flex:1;padding:16px 14px 8px;display:flex;flex-direction:column;gap:18px;overflow-y:auto;}
  .empty{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:36px;line-height:1.9;}
  .letter{border:1px solid var(--line);background:var(--paper-2);padding:12px 12px 10px;position:relative;box-shadow:2px 3px 0 var(--shadow);}
  .letter.dream{background:#efe4cf;border-color:#b9ab8e;}
  .letter .meta{font-size:10px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;}
  .cards{display:flex;gap:8px;flex-wrap:wrap;}
  .card{
    width:62px;height:62px;border:1px solid var(--line);background:#fbf7ec;
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    border-radius:3px;position:relative;flex-shrink:0;
  }
  .card img{width:100%;height:100%;object-fit:cover;display:block;}
  .card .ch{font-size:22px;}
  .card .tag{position:absolute;left:0;top:0;font-size:8px;background:var(--line);color:var(--ink);padding:0 3px;border-bottom-right-radius:3px;}
  .seal{
    position:absolute;right:10px;bottom:8px;width:34px;height:34px;border:1.5px solid var(--seal);
    color:var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-size:9px;letter-spacing:1px;transform:rotate(-12deg);opacity:.85;
  }
  .incoming{font-size:11px;color:var(--ink-soft);letter-spacing:2px;padding-left:6px;}
  /* 发报区 */
  .sendbar{border-top:1px dashed var(--line);padding:10px 14px 16px;background:linear-gradient(180deg,transparent,#e6dcc8);}
  .sendbar .hint{font-size:10px;color:var(--ink-soft);margin-bottom:8px;letter-spacing:1px;display:flex;justify-content:space-between;}
  .mycards{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;min-height:66px;align-items:center;}
  .mycards .card{cursor:pointer;transition:transform .12s, border-color .12s;}
  .mycards .card.sel{border-color:var(--seal);transform:translateY(-3px);box-shadow:0 3px 0 var(--shadow);}
  .mycards .none{font-size:12px;color:var(--ink-soft);}
  .sendbtn{
    width:100%;margin-top:8px;padding:12px;border:1px solid var(--ink);background:var(--ink);
    color:var(--paper-2);font-family:inherit;font-size:14px;letter-spacing:3px;border-radius:3px;cursor:pointer;
  }
  .sendbtn:disabled{background:transparent;color:var(--ink-soft);border-color:var(--line);cursor:default;}
  /* 抽屉 */
  .overlay{position:fixed;inset:0;background:rgba(58,52,40,.35);display:none;align-items:flex-end;z-index:20;}
  .overlay.open{display:flex;}
  .panel{
    width:100%;max-width:640px;margin:0 auto;max-height:82vh;background:var(--paper-2);
    border-top:2px solid var(--ink);border-radius:14px 14px 0 0;display:flex;flex-direction:column;
    animation:slideUp .22s ease;
  }
  @keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .panel-head{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--line);}
  .panel-head b{font-size:13px;letter-spacing:2px;}
  .panel-head .close{margin-left:auto;border:none;background:none;font-family:inherit;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  .panel-body{padding:12px 14px 20px;overflow-y:auto;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:10px;}
  .grid .card{width:66px;height:66px;cursor:default;}
  .grid .card .del{
    position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;
    background:var(--seal);color:#fff;border:none;font-size:11px;line-height:18px;text-align:center;cursor:pointer;
  }
  .empty-note{font-size:12px;color:var(--ink-soft);line-height:2;text-align:center;padding:18px 0;}
  .form{display:flex;flex-direction:column;gap:10px;margin-top:6px;}
  .form label{font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;letter-spacing:1px;}
  .form input[type=text], .form select{
    padding:9px 10px;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);
    font-family:inherit;font-size:13px;border-radius:3px;
  }
  .form input[type=file]{font-size:11px;color:var(--ink-soft);}
  .form button{padding:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);font-family:inherit;font-size:13px;letter-spacing:2px;border-radius:3px;cursor:pointer;}
  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:8px 16px;font-size:12px;border-radius:3px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none;letter-spacing:1px;}
  .toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">梦角字卡传讯<small>DREAM·CARD TELEGRAM</small></div>
    <div class="drawers">
      <button class="drawer-btn" id="openMy"><b>我的信屉</b><span id="cntMy">0 张</span></button>
      <button class="drawer-btn" id="openDream"><b>梦角信屉</b><span id="cntDream">0 张</span></button>
    </div>
  </header>

  <div class="log" id="log">
    <div class="empty" id="logEmpty">尚无传讯。<br>先到「信屉」放几张字卡，再选卡发出第一封。</div>
  </div>

  <div class="sendbar">
    <div class="hint"><span>选卡发报</span><span id="selInfo">已选 0 张</span></div>
    <div class="mycards" id="mycards"></div>
    <button class="sendbtn" id="sendBtn" disabled>发出传讯</button>
  </div>
</div>

<!-- 抽屉 -->
<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-head">
      <b id="panelTitle">信屉</b>
      <button class="close" id="closePanel">×</button>
    </div>
    <div class="panel-body">
      <div class="grid" id="grid"></div>
      <div class="empty-note" id="gridEmpty" style="display:none">屉中空空的。<br>在下面放几张字卡进去。</div>
      <div class="form">
        <label>卡面字（有图可留空）
          <input type="text" id="fContent" placeholder="如：想" maxlength="4" />
        </label>
        <label>背面备注（可选）
          <input type="text" id="fBack" placeholder="释义 / 备注" maxlength="20" />
        </label>
        <label>卡面图片（可选，自动压缩）
          <input type="file" id="fFile" accept="image/*" />
        </label>
        <button id="addBtn">放入信屉</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ========== IndexedDB ========== */
let _db = null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej)=>{
    const req = indexedDB.open('dreamchat', 1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('cards')) d.createObjectStore('cards',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('messages')) d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess = e=>{ _db = e.target.result; res(_db); };
    req.onerror = ()=> rej(req.error);
  });
}
function tx(store, mode){ return db().then(d=> d.transaction(store, mode).objectStore(store)); }
function reqP(r){ return new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }

async function addCard(card){
  const s = await tx('cards','readwrite');
  return reqP(s.add(card));
}
async function allCards(owner){
  const s = await tx('cards','readonly');
  const all = await reqP(s.getAll());
  return owner ? all.filter(c=>c.owner===owner) : all;
}
async function delCard(id){
  const s = await tx('cards','readonly');
  const card = await reqP(s.get(id));
  if(card && card.imageId){
    const im = await tx('images','readwrite');
    await reqP(im.delete(card.imageId));
  }
  const s2 = await tx('cards','readwrite');
  return reqP(s2.delete(id));
}
async function saveImage(blob){
  const s = await tx('images','readwrite');
  return reqP(s.add({blob}));
}
async function getImage(id){
  const s = await tx('images','readonly');
  return reqP(s.get(id));
}
async function addMessage(m){
  const s = await tx('messages','readwrite');
  return reqP(s.add(m));
}
async function allMessages(){
  const s = await tx('messages','readonly');
  const all = await reqP(s.getAll());
  return all.sort((a,b)=>a.createdAt-b.createdAt);
}

/* ========== 图片压缩 ========== */
function compressImage(file, maxSide=800, quality=.8){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width:w, height:h} = img;
      const scale = Math.min(1, maxSide/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=> b?res(b):rej(new Error('compress fail')), 'image/webp', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('load fail')); };
    img.src = url;
  });
}

/* ========== 状态 ========== */
let cards = [];
let messages = [];
let urlCache = {};        // imageId -> objectURL
let selected = [];        // 选中的“我”的卡 id
let panelOwner = 'me';    // 当前抽屉主人 me | dream

const $ = id=>document.getElementById(id);
const logEl = $('log'), mycardsEl = $('mycards'), sendBtn = $('sendBtn');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1500);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){
  const d = new Date(ts);
  const p = n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function cardMap(){ return Object.fromEntries(cards.map(c=>[c.id,c])); }

async function ensureUrl(imageId){
  if(!imageId || urlCache[imageId]) return urlCache[imageId] || null;
  const rec = await getImage(imageId);
  if(rec && rec.blob){ urlCache[imageId] = URL.createObjectURL(rec.blob); }
  return urlCache[imageId] || null;
}

/* ========== 渲染 ========== */
function cardHTML(card, {withDel=false, selected=false, dataId=null}={}){
  const url = card.imageId ? urlCache[card.imageId] : null;
  const inner = url
    ? `<img src="${url}" alt="">`
    : `<span class="ch">${esc(card.content||'？')}</span>`;
  const tag = dataId ? ` data-id="${dataId}"` : '';
  const del = withDel ? `<button class="del" data-del="${card.id}">×</button>` : '';
  return `<div class="card${selected?' sel':''}"${tag} title="${esc(card.back||'')}">${inner}${del}</div>`;
}

async function renderAll(){
  cards = await allCards();
  messages = await allMessages();
  // 预取图片 URL
  for(const c of cards){ if(c.imageId) await ensureUrl(c.imageId); }
  renderCounts();
  renderLog();
  renderMyCards();
}

function renderCounts(){
  const my = cards.filter(c=>c.owner==='me').length;
  const dr = cards.filter(c=>c.owner==='dream').length;
  $('cntMy').textContent = my + ' 张';
  $('cntDream').textContent = dr + ' 张';
}

function renderLog(){
  const cm = cardMap();
  const has = messages.length>0;
  $('logEmpty').style.display = has ? 'none' : 'block';
  logEl.querySelectorAll('.letter,.incoming').forEach(n=>n.remove());
  let no = 0;
  for(const m of messages){
    if(m.sender==='me'){
      no++;
      const cardsHTML = m.cardIds.map(id=>{
        const c = cm[id]; if(!c) return '';
        return cardHTML(c);
      }).join('');
      const div = document.createElement('div');
      div.className = 'letter me';
      div.innerHTML = `<div class="meta"><span>传讯 NO.${String(no).padStart(3,'0')}</span><span>${fmtTime(m.createdAt)}</span></div>
        <div class="cards">${cardsHTML}</div>`;
      logEl.appendChild(div);
    }else{
      const cardsHTML = m.cardIds.map(id=>{
        const c = cm[id]; if(!c) return '';
        return cardHTML(c);
      }).join('');
      const div = document.createElement('div');
      div.className = 'letter dream';
      div.innerHTML = `<div class="meta"><span>回电</span><span>${fmtTime(m.createdAt)}</span></div>
        <div class="cards">${cardsHTML}</div>
        <div class="seal">梦角</div>`;
      logEl.appendChild(div);
    }
  }
  logEl.scrollTop = logEl.scrollHeight;
}

function renderMyCards(){
  const my = cards.filter(c=>c.owner==='me');
  if(my.length===0){
    mycardsEl.innerHTML = `<div class="none">信屉里还没有你的字卡，点右上「我的信屉」放几张。</div>`;
  }else{
    mycardsEl.innerHTML = my.map(c=>
      cardHTML(c, {selected:selected.includes(c.id), dataId:c.id})
    ).join('');
  }
  $('selInfo').textContent = `已选 ${selected.length} 张`;
  sendBtn.disabled = selected.length===0;
}

/* ========== 抽屉 ========== */
async function openPanel(owner){
  panelOwner = owner;
  $('panelTitle').textContent = owner==='me' ? '我的信屉' : '梦角信屉';
  $('overlay').classList.add('open');
  await renderPanel();
}
function closePanel(){ $('overlay').classList.remove('open'); }

async function renderPanel(){
  const list = cards.filter(c=>c.owner===panelOwner);
  const grid = $('grid');
  // 补 url
  for(const c of list){ if(c.imageId) await ensureUrl(c.imageId); }
  if(list.length===0){
    grid.innerHTML = '';
    $('gridEmpty').style.display = 'block';
  }else{
    $('gridEmpty').style.display = 'none';
    grid.innerHTML = list.map(c=> cardHTML(c, {withDel:true}) ).join('');
  }
}

/* ========== 添加字卡 ========== */
async function onAdd(){
  const content = $('fContent').value.trim();
  const back = $('fBack').value.trim();
  const file = $('fFile').files[0] || null;
  if(!content && !file){ toast('写个字或选张图'); return; }
  let imageId = null;
  if(file){
    try{
      const blob = await compressImage(file);
      imageId = await saveImage(blob);
    }catch(e){ toast('图片处理失败'); return; }
  }
  await addCard({
    owner: panelOwner,
    content: content || '图',
    back,
    imageId,
    createdAt: Date.now()
  });
  $('fContent').value = ''; $('fBack').value = ''; $('fFile').value = '';
  toast('已放入信屉');
  await renderAll();
  await renderPanel();
}

/* ========== 发报 & 梦角抽卡 ========== */
async function send(){
  if(selected.length===0) return;
  await addMessage({ sender:'me', cardIds:[...selected], createdAt:Date.now() });
  selected = [];
  renderMyCards();

  // 梦角抽卡
  const dream = cards.filter(c=>c.owner==='dream');
  if(dream.length>0){
    const inc = document.createElement('div');
    inc.className = 'incoming';
    inc.textContent = '滴滴滴…收到回电';
    logEl.appendChild(inc);
    logEl.scrollTop = logEl.scrollHeight;
    await new Promise(r=>setTimeout(r,650));

    const n = Math.min(1 + Math.floor(Math.random()*3), dream.length);
    const pool = [...dream];
    const drawn = [];
    for(let i=0;i<n;i++){
      const idx = Math.floor(Math.random()*pool.length);
      drawn.push(pool.splice(idx,1)[0].id);
    }
    await addMessage({ sender:'dream', cardIds:drawn, createdAt:Date.now() });
  }else{
    toast('梦角信屉是空的，他抽不出卡');
  }
  await renderAll();
}

/* ========== 事件绑定 ========== */
mycardsEl.addEventListener('click', e=>{
  const card = e.target.closest('.card[data-id]');
  if(!card) return;
  const id = Number(card.dataset.id);
  if(selected.includes(id)) selected = selected.filter(x=>x!==id);
  else selected.push(id);
  renderMyCards();
});
sendBtn.addEventListener('click', send);

$('openMy').addEventListener('click', ()=>openPanel('me'));
$('openDream').addEventListener('click', ()=>openPanel('dream'));
$('closePanel').addEventListener('click', closePanel);
$('overlay').addEventListener('click', e=>{ if(e.target===$('overlay')) closePanel(); });
$('addBtn').addEventListener('click', onAdd);

$('grid').addEventListener('click', async e=>{
  const del = e.target.closest('[data-del]');
  if(del){
    const id = Number(del.dataset.del);
    if(!confirm('从信屉中移除此卡？')) return;
    await delCard(id);
    selected = selected.filter(x=>x!==id);
    await renderAll();
    await renderPanel();
  }
});

/* ========== 启动 ========== */
renderAll().catch(err=>{
  console.error(err);
  toast('本地存储初始化失败');
});
</script>
</body>
</html>

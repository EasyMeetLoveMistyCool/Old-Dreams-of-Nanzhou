<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>南洲旧梦</title>
<style>
  :root{
    --paper:#efe7d6; --paper-2:#f7f1e3;
    --ink:#3a3428; --ink-soft:#6b6150; --line:#c9bda3;
    --seal:#a23b2a; --shadow:rgba(58,52,40,.18);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  
  /* 锁定整体页面，绝不产生滚动穿透 */
  html,body{
    height:100%; margin:0; overflow:hidden; 
    background:var(--paper); color:var(--ink);
    font-family:"Courier New",ui-monospace,SFMono-Regular,Menlo,monospace;
    background-image:linear-gradient(180deg,#f2ebdc,#e9dfcc);
  }
  /* 弹性布局：主界面头部和底栏固定 */
  #app{max-width:640px;margin:0 auto;height:100%;display:flex;flex-direction:column;}
  
  header{
    flex-shrink:0; padding:14px 16px 10px; border-bottom:1px dashed var(--line);
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--paper);
    position:relative; z-index:5;
  }
  .title{font-size:16px;letter-spacing:2px;font-weight:700;}
  .title small{display:block;font-size:10px;color:var(--ink-soft);letter-spacing:1px;font-weight:400;}
  .drawers{margin-left:auto;display:flex;gap:8px;}
  .drawer-btn{border:1px solid var(--line);background:var(--paper-2);color:var(--ink);padding:7px 10px;border-radius:4px;font-family:inherit;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;line-height:1.25;}
  .drawer-btn b{font-size:11px;font-weight:700;}
  .drawer-btn span{font-size:10px;color:var(--ink-soft);}
  
  /* 中间消息记录区：独立滚动 */
  .log{
    flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:16px 14px; display:flex; flex-direction:column; gap:18px;
  }
  .empty{color:var(--ink-soft);font-size:12px;text-align:center;margin-top:36px;line-height:1.9;}
  .letter{position:relative;border:1px solid var(--line);padding:12px 12px 10px;background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(58,52,40,.07) 27px 28px),var(--paper-2);box-shadow:2px 3px 0 var(--shadow);}
  .letter.dream{background:repeating-linear-gradient(180deg,transparent 0 27px,rgba(58,52,40,.07) 27px 28px),#efe4cf;border-color:#b9ab8e;}
  .letter .meta{font-size:10px;color:var(--ink-soft);letter-spacing:1px;margin-bottom:8px;display:flex;justify-content:space-between;}
  .telegram-text{font-size:17px;line-height:28px;letter-spacing:1px;white-space:pre-wrap;word-break:break-all;min-height:28px;}
  .telegram-line{font-size:17px;line-height:28px;letter-spacing:1px;white-space:pre-wrap;word-break:break-all;}
  .seal{position:absolute;right:10px;bottom:6px;width:34px;height:34px;border:1.5px solid var(--seal);color:var(--seal);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:1px;transform:rotate(-12deg);opacity:.85;}
  .stamp{position:absolute;right:12px;bottom:10px;width:46px;height:46px;object-fit:cover;border:1px solid var(--line);border-radius:3px;transform:rotate(4deg);box-shadow:1px 1px 0 var(--shadow);}
  .incoming{font-size:11px;color:var(--ink-soft);letter-spacing:2px;padding-left:6px;}
  
  /* 底部发报区固定 */
  .sendbar{
    flex-shrink:0; border-top:1px dashed var(--line); padding:10px 14px 16px;
    background:linear-gradient(180deg,transparent,#e6dcc8); position:relative; z-index:5;
  }
  .sendbar .hint{font-size:10px;color:var(--ink-soft);margin-bottom:8px;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center;}
  .sticker-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;min-height:34px;align-items:center;}
  .sticker-pick .st{width:30px;height:30px;border:1px solid var(--line);border-radius:3px;overflow:hidden;flex-shrink:0;cursor:pointer;background:#fbf7ec;display:flex;align-items:center;justify-content:center;}
  .sticker-pick .st img{width:100%;height:100%;object-fit:cover;}
  .sticker-pick .st.sel{border-color:var(--seal);box-shadow:0 0 0 1px var(--seal) inset;}
  .sticker-pick .none{font-size:11px;color:var(--ink-soft);}
  .input-row{display:flex;gap:8px;margin-top:6px;}
  .input-row input{flex:1;padding:10px;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);font-family:inherit;font-size:14px;border-radius:3px;}
  .sendbtn{padding:10px 16px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);font-family:inherit;font-size:13px;letter-spacing:2px;border-radius:3px;cursor:pointer;white-space:nowrap;}
  .sendbtn:disabled{background:transparent;color:var(--ink-soft);border-color:var(--line);cursor:default;}
  
  /* 抽屉（弹窗） */
  .overlay{position:fixed;inset:0;background:rgba(58,52,40,.35);display:none;align-items:flex-end;z-index:20;}
  .overlay.open{display:flex;}
  .panel{width:100%;max-width:640px;margin:0 auto;height:85vh;background:var(--paper-2);border-top:2px solid var(--ink);border-radius:14px 14px 0 0;display:flex;flex-direction:column;animation:slideUp .22s ease;}
  @keyframes slideUp{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
  .panel-head{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px dashed var(--line);}
  .panel-head b{font-size:13px;letter-spacing:2px;}
  .panel-head .close{margin-left:auto;border:none;background:none;font-family:inherit;font-size:20px;color:var(--ink-soft);cursor:pointer;}
  
  /* 抽屉中间内容：滚动 */
  .panel-body{padding:12px 14px 20px;overflow-y:auto;flex:1;}

  /* 抽屉底部操作栏（固定） */
  .panel-footer {
    flex-shrink: 0;
    padding: 10px 14px;
    background: var(--paper-2);
    border-top: 1px dashed var(--line);
    padding-bottom: max(10px, env(safe-area-inset-bottom)); /* 适配 iPhone 底部小黑条 */
  }

  .code-list{display:flex;flex-direction:column;gap:8px;}
  .code-row{position:relative;}
  .long-card{
    width:100%;border:1px solid var(--line);background:#fbf7ec;border-radius:4px;
    padding:8px 34px 8px 12px;text-align:left;cursor:pointer;font-family:inherit;
    color:var(--ink);line-height:1.35;min-height:38px;display:flex;align-items:center;
  }
  .long-card .txt{font-size:14px;white-space:pre-wrap;word-break:break-all;flex:1;text-align:center;}
  .long-card:active{background:#f1ead9;}
  .code-row .del{
    position:absolute;right:4px;top:50%;transform:translateY(-50%);
    width:20px;height:20px;border-radius:50%;background:var(--seal);color:#fff;
    border:none;font-size:12px;line-height:20px;text-align:center;cursor:pointer;z-index:3;
  }
  .back-bar{margin-top:6px;border:1px dashed var(--line);background:#f4eedf;border-radius:4px;padding:6px 8px;display:none;}
  .back-bar.open{display:block;}
  .back-bar textarea{width:100%;min-height:44px;border:none;background:transparent;resize:vertical;font-family:inherit;font-size:12px;color:var(--ink-soft);outline:none;}

  .stamp-grid{display:grid;grid-template-columns:repeat(auto-fill,66px);gap:10px;}
  .sticker{width:66px;height:66px;border:1px solid var(--line);border-radius:3px;overflow:hidden;background:#fbf7ec;position:relative;}
  .sticker img{width:100%;height:100%;object-fit:cover;display:block;}
  .sticker .del{position:absolute;right:-6px;top:-6px;width:18px;height:18px;border-radius:50%;background:var(--seal);color:#fff;border:none;font-size:11px;line-height:18px;text-align:center;cursor:pointer;z-index:3;}

  .empty-note{font-size:12px;color:var(--ink-soft);line-height:2;text-align:center;padding:18px 0;}
  .form{display:flex;flex-direction:column;gap:10px;margin-top:10px;}
  .form label{font-size:11px;color:var(--ink-soft);display:flex;flex-direction:column;gap:5px;letter-spacing:1px;}
  .form input[type=text],.form textarea{padding:9px 10px;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);font-family:inherit;font-size:13px;border-radius:3px;}
  .form textarea{min-height:60px;resize:vertical;}
  .form button{padding:10px;border:1px solid var(--ink);background:var(--ink);color:var(--paper-2);font-family:inherit;font-size:13px;letter-spacing:2px;border-radius:3px;cursor:pointer;}
  
  /* 统一的导入导出按钮 */
  .io-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px;}
  .io-btn-wrap { position: relative; overflow: hidden; }
  .io-btn{
    width:100%; padding:9px;border:1px solid var(--line);background:#fbf7ec;color:var(--ink);
    font-family:inherit;font-size:12px;border-radius:3px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .io-btn:active{background:#f1ead9;}
  /* 隐藏丑陋的原生文件框，并用透明覆盖法点击 */
  .io-btn-wrap input[type=file] {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer;
  }

  .toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:var(--ink);color:var(--paper-2);padding:8px 16px;font-size:12px;border-radius:3px;opacity:0;transition:opacity .25s;z-index:40;pointer-events:none;letter-spacing:1px;}
  .toast.show{opacity:1;}
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="title">南洲旧梦<small>字卡传讯 · 电码与邮戳</small></div>
    <div class="drawers">
      <button class="drawer-btn" id="openCode"><b>电码本</b><span id="cntCode">0 码</span></button>
      <button class="drawer-btn" id="openStamp"><b>邮戳册</b><span id="cntStamp">0 枚</span></button>
    </div>
  </header>

  <div class="log" id="log">
    <div class="empty" id="logEmpty">尚无传讯。<br>先到「电码本」录几码，再向梦角发报。</div>
  </div>

  <div class="sendbar">
    <div class="hint"><span>发报</span><span id="stickerInfo">未盖邮戳</span></div>
    <div class="sticker-pick" id="stickerPick"></div>
    <div class="input-row">
      <input id="msgInput" type="text" placeholder="写下要传的讯…" maxlength="120" />
      <button class="sendbtn" id="sendBtn">发报</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <div class="panel-head">
      <b id="panelTitle">梦角的电码本</b>
      <button class="close" id="closePanel">×</button>
    </div>
    <!-- 中间列表区 -->
    <div class="panel-body" id="panelBody"></div>
    <!-- 底部操作区（固定） -->
    <div class="panel-footer" id="panelFooter"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
window.onerror = function(msg){ toast('运行错误：' + msg); };

/* ========== IndexedDB (修复了存储和版本问题) ========== */
let _db = null;
function db(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res, rej)=>{
    const req = indexedDB.open('dreamchat_v6', 1); // 升到 v6 确保干净
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('codes')) d.createObjectStore('codes',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('stamps')) d.createObjectStore('stamps',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('images')) d.createObjectStore('images',{keyPath:'id',autoIncrement:true});
      if(!d.objectStoreNames.contains('messages')) d.createObjectStore('messages',{keyPath:'id',autoIncrement:true});
    };
    req.onsuccess = e=>{ _db = e.target.result; res(_db); };
    req.onerror = ()=> rej(req.error);
  });
}
function withStore(store, mode, fn){
  return db().then(d=> new Promise((res, rej)=>{
    let t;
    try{ t = d.transaction(store, mode); }catch(e){ rej(e); return; }
    const s = t.objectStore(store);
    let out;
    try{ out = fn(s); }catch(e){ rej(e); return; }
    t.oncomplete = ()=> res(out && out.result !== undefined ? out.result : out);
    t.onerror = ()=> rej(t.error);
    t.onabort = ()=> rej(t.error);
  }));
}
const addCode = c => withStore('codes','readwrite', s=> s.add(c));
const allCodes = () => withStore('codes','readonly', s=> s.getAll());
const putCode = c => withStore('codes','readwrite', s=> s.put(c));
const delCode = id => withStore('codes','readwrite', s=> s.delete(id));
const clearCodes = () => withStore('codes','readwrite', s=> s.clear());

const addStamp = st => withStore('stamps','readwrite', s=> s.add(st));
const allStamps = () => withStore('stamps','readonly', s=> s.getAll());
const delStampRow = id => withStore('stamps','readwrite', s=> s.delete(id));
const clearStamps = () => withStore('stamps','readwrite', s=> s.clear());

const saveImage = blob => withStore('images','readwrite', s=> s.add({blob}));
const getImage = id => withStore('images','readonly', s=> s.get(id));
const clearImages = () => withStore('images','readwrite', s=> s.clear());

const addMessage = m => withStore('messages','readwrite', s=> s.add(m));
const allMessages = () => withStore('messages','readonly', s=> s.getAll()).then(a=>a.sort((x,y)=>x.createdAt-y.createdAt));

/* ========== 图片压缩 ========== */
function compressImage(file, maxSide=800, quality=.8){
  return new Promise((res, rej)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      URL.revokeObjectURL(url);
      let {width:w, height:h} = img;
      const scale = Math.min(1, maxSide/Math.max(w,h));
      w = Math.round(w*scale); h = Math.round(h*scale);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cv.toBlob(b=> b?res(b):rej(new Error('compress fail')), 'image/webp', quality);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error('load fail')); };
    img.src = url;
  });
}

/* ========== 状态 ========== */
let codes = [], stamps = [], messages = [];
let urlCache = {};
let pickedStamp = null;
let panelKind = 'code';
let openBackId = null;

const $ = id=>document.getElementById(id);
const logEl = $('log');

function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1500);
}
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtTime(ts){ const d=new Date(ts); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}.${p(d.getMonth()+1)}.${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; }
async function ensureUrl(imageId){
  if(!imageId || urlCache[imageId]) return urlCache[imageId] || null;
  const rec = await getImage(imageId);
  if(rec && rec.blob) urlCache[imageId] = URL.createObjectURL(rec.blob);
  return urlCache[imageId] || null;
}

/* ========== 渲染 ========== */
async function renderAll(){
  codes = await allCodes();
  stamps = await allStamps();
  messages = await allMessages();
  // 预加载图片链接
  for(const st of stamps){ if(st.imageId) await ensureUrl(st.imageId); }
  $('cntCode').textContent = codes.length + ' 码';
  $('cntStamp').textContent = stamps.length + ' 枚';
  renderLog();
  renderStickerPick();
}
function renderLog(){
  logEl.querySelectorAll('.letter,.incoming').forEach(n=>n.remove());
  $('logEmpty').style.display = messages.length ? 'none' : 'block';
  const codeMap = Object.fromEntries(codes.map(c=>[c.id,c]));
  const stampMap = Object.fromEntries(stamps.map(s=>[s.id,s]));
  let no = 0;
  for(const m of messages){
    if(m.sender==='me'){
      no++;
      const div = document.createElement('div');
      div.className = 'letter me';
      const stampHTML = m.stampId && stampMap[m.stampId] && urlCache[stampMap[m.stampId].imageId]
        ? `<img class="stamp" src="${urlCache[stampMap[m.stampId].imageId]}" alt="">` : '';
      div.innerHTML = `<div class="meta"><span>发报 NO.${String(no).padStart(3,'0')}</span><span>${fmtTime(m.createdAt)}</span></div>
        <div class="telegram-text">${esc(m.text||'')}</div>
        <div class="seal">我</div>
        ${stampHTML}`;
      logEl.appendChild(div);
    }else{
      const lines = (m.lines||[]).map(lineIds=>{
        const txt = lineIds.map(id=> codeMap[id] ? codeMap[id].char : '').join('');
        return `<div class="telegram-line">${esc(txt)}</div>`;
      }).join('');
      const stampHTML = m.stampId && stampMap[m.stampId] && urlCache[stampMap[m.stampId].imageId]
        ? `<img class="stamp" src="${urlCache[stampMap[m.stampId].imageId]}" alt="">` : '';
      const div = document.createElement('div');
      div.className = 'letter dream';
      div.innerHTML = `<div class="meta"><span>回电</span><span>${fmtTime(m.createdAt)}</span></div>
        ${lines}
        <div class="seal">梦角</div>
        ${stampHTML}`;
      logEl.appendChild(div);
    }
  }
  logEl.scrollTop = logEl.scrollHeight;
}
function renderStickerPick(){
  const el = $('stickerPick');
  if(stamps.length===0){
    el.innerHTML = `<div class="none">邮戳册空，无法盖戳</div>`;
    $('stickerInfo').textContent = '未盖邮戳';
    return;
  }
  el.innerHTML = stamps.map(s=>{
    const url = urlCache[s.imageId] || '';
    return `<div class="st ${pickedStamp===s.id?'sel':''}" data-st="${s.id}"><img src="${url}" alt=""></div>`;
  }).join('');
  $('stickerInfo').textContent = pickedStamp ? '已选 1 枚邮戳' : '未盖邮戳';
}

/* ========== 抽屉 ========== */
async function openPanel(kind){
  panelKind = kind;
  openBackId = null;
  $('panelTitle').textContent = kind==='code' ? '梦角的电码本' : '梦角的邮戳册';
  $('overlay').classList.add('open');
  document.body.style.overflow = 'hidden'; // 锁死背景滚动
  await renderPanel();
}
function closePanel(){ 
  $('overlay').classList.remove('open'); 
  document.body.style.overflow = ''; 
}

async function renderPanel(){
  const body = $('panelBody');
  const footer = $('panelFooter');
  
  if(panelKind==='code'){
    // 1. 渲染中间列表
    let listHTML = codes.length===0
      ? `<div class="empty-note">电码本空空的。<br>在下面录几码进去。</div>`
      : `<div class="code-list">${codes.map(c=>`
          <div class="code-row">
            <button class="long-card" data-code="${c.id}" type="button"><span class="txt">${esc(c.char||'')}</span></button>
            <button class="del" data-delcode="${c.id}">×</button>
            <div class="back-bar ${openBackId===c.id?'open':''}" data-backbar="${c.id}">
              <textarea data-back="${c.id}" placeholder="备注（只自己看，不参与回电）">${esc(c.back||'')}</textarea>
            </div>
          </div>`).join('')}</div>`;

    body.innerHTML = `${listHTML}
      <div class="form" style="margin-top:20px;">
        <label>录入一条字卡
          <input type="text" id="fChar" placeholder="一整句，如：今天也想你" maxlength="200" />
        </label>
        <button id="addCodeBtn">录电码</button>
        <label>批量录入（一行一张字卡）
          <textarea id="fBatch" placeholder="今天也想你&#10;南洲的雨停了&#10;等我回来"></textarea>
        </label>
        <button id="batchCodeBtn">批量录入</button>
      </div>
    `;

    // 2. 渲染底部固定操作区
    footer.innerHTML = `
      <div class="io-row">
        <button class="io-btn" id="expTxt">导出 TXT</button>
        <button class="io-btn" id="expJson">导出 JSON</button>
      </div>
      <div class="io-row" style="margin-bottom:0;">
        <div class="io-btn-wrap">
          <button class="io-btn">导入 TXT</button>
          <input type="file" id="fileTxt" accept=".txt,text/plain" />
        </div>
        <div class="io-btn-wrap">
          <button class="io-btn">导入 JSON</button>
          <input type="file" id="fileJson" accept=".json,application/json,text/plain" />
        </div>
      </div>
    `;

    // 绑定事件
    $('addCodeBtn').addEventListener('click', onAddCode);
    $('batchCodeBtn').addEventListener('click', onBatchCode);
    $('expTxt').addEventListener('click', exportCodeTxt);
    $('expJson').addEventListener('click', exportCodeJson);
    $('fileTxt').addEventListener('change', importCodeTxt);
    $('fileJson').addEventListener('change', importCodeJson);

    body.querySelectorAll('.long-card[data-code]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const id = Number(btn.dataset.code);
        openBackId = openBackId === id ? null : id;
        renderPanel();
      });
    });
    body.querySelectorAll('[data-back]').forEach(ta=>{
      ta.addEventListener('change', async ()=>{
        const id = Number(ta.dataset.back);
        const cur = codes.find(c=>c.id===id);
        if(!cur) return;
        cur.back = ta.value.trim();
        await putCode(cur);
        toast('备注已存');
      });
    });
    body.querySelectorAll('[data-delcode]').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        const id = Number(btn.dataset.delcode);
        if(!confirm('从电码本删去此卡？')) return;
        await delCode(id);
        if(openBackId===id) openBackId = null;
        await renderAll(); await renderPanel();
      });
    });
  }else{
    // 1. 邮戳中间列表
    let gridHTML = stamps.length===0
      ? `<div class="empty-note">邮戳册空空的。<br>在下面收几枚邮戳进去。</div>`
      : `<div class="stamp-grid">${stamps.map(s=>`
          <div class="sticker"><img src="${urlCache[s.imageId]||''}" alt=""><button class="del" data-delstamp="${s.id}">×</button></div>`).join('')}</div>`;
    
    body.innerHTML = `${gridHTML}
      <div class="form" style="margin-top:20px;">
        <label>收邮戳图片（会自动压缩）
          <div class="io-btn-wrap" style="margin-top:4px;">
            <button class="io-btn">选择图片</button>
            <input type="file" id="fStamp" accept="image/*" />
          </div>
        </label>
        <button id="addStampBtn">确认收邮戳</button>
      </div>
    `;

    // 2. 邮戳底部固定操作区
    footer.innerHTML = `
      <div class="io-row" style="margin-bottom:0;">
        <button class="io-btn" id="expStampJson">导出 JSON</button>
        <div class="io-btn-wrap">
          <button class="io-btn">导入 JSON</button>
          <input type="file" id="fileStampJson" accept=".json,application/json" />
        </div>
      </div>
    `;

    $('addStampBtn').addEventListener('click', onAddStamp);
    $('expStampJson').addEventListener('click', exportStampJson);
    $('fileStampJson').addEventListener('change', importStampJson);
    
    body.querySelectorAll('[data-delstamp]').forEach(btn=>{
      btn.addEventListener('click', async e=>{
        e.stopPropagation();
        const id = Number(btn.dataset.delstamp);
        if(!confirm('从邮戳册删去此戳？')) return;
        await delStamp(id);
        if(pickedStamp===id) pickedStamp = null;
        await renderAll(); await renderPanel();
      });
    });
  }
}

/* ========== 录码 ========== */
async function onAddCode(){
  const ch = $('fChar').value.trim();
  if(!ch){ toast('写一句再录'); return; }
  await addCode({ char: ch, back: '', createdAt: Date.now() });
  $('fChar').value = '';
  toast('已录入一条字卡');
  await renderAll(); await renderPanel();
}
async function onBatchCode(){
  const raw = $('fBatch').value;
  const lines = raw.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('没有可录入的行'); return; }
  for(const line of lines){
    await addCode({ char: line, back: '', createdAt: Date.now() });
  }
  $('fBatch').value = '';
  toast(`已录入 ${lines.length} 条字卡`);
  await renderAll(); await renderPanel();
}

/* ========== 邮戳 ========== */
async function onAddStamp(){
  const file = $('fStamp').files[0];
  if(!file){ toast('先点击上面的选择图片'); return; }
  let blob;
  try{ blob = await compressImage(file); }catch(e){ toast('图片处理失败'); return; }
  const imageId = await saveImage(blob);
  await addStamp({ imageId, createdAt: Date.now() });
  $('fStamp').value = '';
  toast('已收邮戳');
  await renderAll(); await renderPanel();
}
async function delStamp(id){
  const st = stamps.find(s=>s.id===id);
  if(st && st.imageId) await withStore('images','readwrite', s=> s.delete(st.imageId));
  await delStampRow(id);
}

/* ========== 通用 ========== */
function download(filename, content, type){
  const blob = new Blob([content], {type});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function dateStr(){ const d=new Date(); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; }
function blobToBase64(blob){
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ()=> res(String(r.result).split(',')[1] || '');
    r.onerror = ()=> rej(r.error);
    r.readAsDataURL(blob);
  });
}
function base64ToBlob(b64, mime='image/webp'){
  const bin = atob(b64);
  const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], {type:mime});
}

/* ========== 电码本 TXT ========== */
function exportCodeTxt(){
  const txt = codes.map(c=>c.char).join('\n');
  if(!txt){ toast('电码本为空'); return; }
  download(`南洲旧梦-电码本-${dateStr()}.txt`, txt, 'text/plain;charset=utf-8');
  toast('已导出 TXT');
}
async function importCodeTxt(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  const text = await file.text();
  const lines = text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  if(!lines.length){ toast('文件里没有内容'); return; }
  const existing = new Set(codes.map(c=>c.char));
  let added = 0;
  for(const line of lines){
    if(existing.has(line)) continue;
    await addCode({ char: line, back: '', createdAt: Date.now() });
    existing.add(line); added++;
  }
  toast(`导入完成，新增 ${added} 条字卡`);
  await renderAll(); await renderPanel();
}

/* ========== 电码本 JSON ========== */
function exportCodeJson(){
  const data = {
    type: 'nanchou-codes',
    version: 6,
    exportedAt: Date.now(),
    codes: codes.map(c=>({ char:c.char, back:c.back||'', createdAt:c.createdAt }))
  };
  download(`南洲旧梦-电码本-${dateStr()}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('已导出 JSON');
}
async function importCodeJson(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  const rawText = await file.text();
  if(!rawText.trim()){ toast('文件是空的'); return; }
  if(!confirm('导入将覆盖现有电码本，继续？')) return;
  
  try{
    await clearCodes();
    let addedCount = 0;
    let extractedTexts = [];

    let parsed = null;
    try {
      parsed = JSON.parse(rawText);
    } catch(err) {}

    if (parsed) {
      let list = null;
      if (Array.isArray(parsed)) list = parsed;
      else if (Array.isArray(parsed.codes)) list = parsed.codes;
      else if (Array.isArray(parsed.data)) list = parsed.data;
      
      if (list) {
        for (const c of list) {
          let text = '';
          if (typeof c === 'string') text = c.trim();
          else if (c && typeof c === 'object') text = String(c.char || c.content || c.text || '').trim();
          
          if (text && text !== '[object Object]' && text !== '}' && !text.includes('"id":') && !text.includes('"at":')) {
            extractedTexts.push(text);
          }
        }
      }
    } 
    
    if (extractedTexts.length === 0) {
      const regex = /"text"\s*:\s*"([^"]+)"/g;
      let match;
      while ((match = regex.exec(rawText)) !== null) {
        if (match[1] && match[1].trim()) extractedTexts.push(match[1].trim());
      }
    }

    const existing = new Set(codes.map(c=>c.char));
    for(const text of extractedTexts){
      if(existing.has(text)) continue;
      await addCode({ char: text, back: '', createdAt: Date.now() });
      existing.add(text);
      addedCount++;
    }
    
    if (addedCount === 0) toast('未找到可导入的文字');
    else toast(`电码本已导入，共 ${addedCount} 条`);
    
    await renderAll(); await renderPanel();
  }catch(err){
    toast('导入过程出错');
  }
}

/* ========== 邮戳册 JSON ========== */
async function exportStampJson(){
  if(!stamps.length){ toast('邮戳册为空'); return; }
  const arr = [];
  for(const st of stamps){
    const rec = await getImage(st.imageId);
    let b64 = '';
    if(rec && rec.blob) b64 = await blobToBase64(rec.blob);
    arr.push({ imageBase64: b64, createdAt: st.createdAt });
  }
  const data = { type: 'nanchou-stamps', version: 1, exportedAt: Date.now(), stamps: arr };
  download(`南洲旧梦-邮戳册-${dateStr()}.json`, JSON.stringify(data, null, 2), 'application/json');
  toast('已导出 JSON');
}
async function importStampJson(e){
  const file = e.target.files[0]; e.target.value = '';
  if(!file) return;
  let data;
  try{ data = JSON.parse(await file.text()); }catch(err){ toast('JSON 解析失败'); return; }
  if(data.type && data.type !== 'nanchou-stamps'){ toast('不是邮戳册的备份文件'); return; }
  const list = Array.isArray(data.stamps) ? data.stamps : (Array.isArray(data) ? data : null);
  if(!list){ toast('文件里没有邮戳数据'); return; }
  if(!confirm('导入将覆盖现有邮戳册，继续？')) return;
  
  try{
    toast('正在处理图片，请稍候...');
    await new Promise(r => setTimeout(r, 100)); 
    
    await clearStamps(); await clearImages();
    urlCache = {};
    let added = 0;
    for(const st of list){
      if(!st.imageBase64) continue;
      let blob;
      try{ blob = base64ToBlob(st.imageBase64); }catch(err){ continue; }
      
      // 【核心修复点】：之前这里忘了先存图片文件，直接存的空ID，导致显示不出来。
      const imageId = await saveImage(blob);
      await addStamp({ imageId, createdAt: st.createdAt || Date.now() });
      
      added++;
      if (added % 5 === 0) await new Promise(r => setTimeout(r, 10));
    }
    pickedStamp = null;
    toast('邮戳册已导入');
    await renderAll(); await renderPanel();
  }catch(err){
    toast('导入失败');
  }
}

/* ========== 发报 & 回电 ========== */
async function send(){
  const input = $('msgInput');
  const text = input.value.trim();
  if(!text){ toast('写下要传的讯'); return; }
  await addMessage({ sender:'me', text, stampId: pickedStamp, createdAt: Date.now() });
  input.value = '';
  pickedStamp = null;
  renderStickerPick();

  if(codes.length > 0){
    const inc = document.createElement('div');
    inc.className = 'incoming';
    inc.textContent = '滴滴滴…收到回电';
    logEl.appendChild(inc);
    logEl.scrollTop = logEl.scrollHeight;
    await new Promise(r=>setTimeout(r,650));

    const lineCount = 1 + Math.floor(Math.random()*3); // 1~3句
    const lines = [];
    for(let i=0;i<lineCount;i++){
      const n = Math.min(1 + Math.floor(Math.random()*3), codes.length);
      const pool = [...codes];
      const line = [];
      for(let k=0;k<n && pool.length;k++){
        const idx = Math.floor(Math.random()*pool.length);
        line.push(pool.splice(idx,1)[0].id);
      }
      lines.push(line);
    }
    let stampId = null;
    if(stamps.length && Math.random() < 0.4){
      stampId = stamps[Math.floor(Math.random()*stamps.length)].id;
    }
    await addMessage({ sender:'dream', lines, stampId, createdAt: Date.now() });
  }else{
    toast('电码本空，梦角查不到码');
  }
  await renderAll();
}

$('sendBtn').addEventListener('click', send);
$('msgInput').addEventListener('keydown', e=>{ if(e.key==='Enter') send(); });
$('stickerPick').addEventListener('click', e=>{
  const st = e.target.closest('[data-st]');
  if(!st) return;
  const id = Number(st.dataset.st);
  pickedStamp = pickedStamp === id ? null : id;
  renderStickerPick();
});

renderAll().catch(err=>{
  console.error(err);
  toast('启动错误：' + ((err && err.message) || err));
});

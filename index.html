<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>南洲旧梦</title>
<style>
  :root {
    --ink: #1a1410;
    --gold: #c9a84c;
    --gold-dim: #8a7535;
    --paper: #f5edda;
    --paper-dark: #e8dcc4;
    --navy: #1b2a3d;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: "Noto Serif SC", "Songti SC", "STSong", serif;
    background: var(--ink);
    color: var(--paper);
    height: 100vh;
    overflow: hidden;
  }

  /* ---- 页面容器 ---- */
  .page { display:none; height:100vh; flex-direction:column; }
  .page.active { display:flex; }

  /* ---- 顶部栏 ---- */
  .header {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 16px;
    background: linear-gradient(180deg, rgba(27,42,61,.95), rgba(27,42,61,.7));
    border-bottom:1px solid var(--gold-dim);
    flex-shrink:0;
  }
  .header h1 {
    font-size:18px; font-weight:400; letter-spacing:4px; color:var(--gold);
  }
  .header-btn {
    background:none; border:1px solid var(--gold-dim); color:var(--gold);
    padding:4px 12px; border-radius:2px; font-size:13px; cursor:pointer;
    font-family:inherit;
  }
  .header-btn:active { background:var(--gold-dim); color:var(--ink); }

  /* ---- 聊天区 ---- */
  .chat-area {
    flex:1; overflow-y:auto; padding:16px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(201,168,76,.06), transparent 60%),
      linear-gradient(180deg, #1e1a14, var(--ink));
  }
  .chat-area::before {
    content:""; position:fixed; top:0; left:0; right:0; bottom:0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 28px, rgba(201,168,76,.03) 28px, rgba(201,168,76,.03) 29px
    );
    pointer-events:none; z-index:0;
  }

  /* ---- 消息 ---- */
  .msg { position:relative; z-index:1; margin-bottom:16px; animation: fadeIn .5s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
  .msg .label { font-size:11px; color:var(--gold-dim); margin-bottom:4px; letter-spacing:2px; }
  .msg .bubble {
    display:inline-block; max-width:85%; padding:10px 14px;
    border-radius:2px; line-height:1.7; font-size:15px;
  }
  .msg.you .bubble {
    background: rgba(27,42,61,.6);
    border:1px solid rgba(201,168,76,.2);
    margin-left:auto; display:block;
    text-align:right;
  }
  .msg.you .label { text-align:right; }
  .msg.him .bubble {
    background: rgba(245,237,218,.08);
    border-left:2px solid var(--gold);
  }
  .msg .type-tag {
    display:inline-block; font-size:10px; color:var(--gold-dim);
    border:1px solid var(--gold-dim); padding:0 4px; border-radius:2px;
    margin-bottom:4px; letter-spacing:1px;
  }

  /* ---- 空状态 ---- */
  .empty-state {
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:32px;
  }
  .empty-state .title { font-size:16px; color:var(--gold); margin-bottom:8px; letter-spacing:3px; }
  .empty-state .hint { font-size:13px; color:var(--gold-dim); line-height:1.8; }
  .empty-state .go-btn {
    margin-top:20px; padding:8px 24px;
    background:none; border:1px solid var(--gold); color:var(--gold);
    font-size:14px; letter-spacing:2px; cursor:pointer; font-family:inherit;
  }
  .empty-state .go-btn:active { background:var(--gold); color:var(--ink); }

  /* ---- 底部输入区 ---- */
  .input-bar {
    display:flex; align-items:center; gap:8px;
    padding:10px 12px;
    background: linear-gradient(0deg, rgba(27,42,61,.95), rgba(27,42,61,.7));
    border-top:1px solid var(--gold-dim);
    flex-shrink:0;
  }
  .input-bar input {
    flex:1; background:rgba(245,237,218,.06); border:1px solid var(--gold-dim);
    color:var(--paper); padding:10px 12px; font-size:15px; border-radius:2px;
    font-family:inherit; outline:none;
  }
  .input-bar input::placeholder { color:var(--gold-dim); }
  .seal-btn {
    width:44px; height:44px; border-radius:50%;
    background: radial-gradient(circle, #8b2500, #5a1000);
    border:2px solid var(--gold);
    color:var(--gold); font-size:12px; letter-spacing:1px;
    cursor:pointer; flex-shrink:0; font-family:inherit;
  }
  .seal-btn:active { transform:scale(.92); }

  /* ---- 信匣页 ---- */
  .chest-tabs {
    display:flex; border-bottom:1px solid var(--gold-dim); flex-shrink:0;
  }
  .chest-tabs button {
    flex:1; padding:10px 0; background:none; border:none;
    color:var(--gold-dim); font-size:13px; letter-spacing:2px;
    cursor:pointer; border-bottom:2px solid transparent; font-family:inherit;
  }
  .chest-tabs button.active { color:var(--gold); border-bottom-color:var(--gold); }
  .chest-list { flex:1; overflow-y:auto; padding:12px; }
  .chest-item {
    background:rgba(245,237,218,.05); border:1px solid rgba(201,168,76,.15);
    padding:10px 12px; margin-bottom:8px; border-radius:2px;
    display:flex; justify-content:space-between; align-items:flex-start;
  }
  .chest-item .text { font-size:14px; line-height:1.6; flex:1; word-break:break-all; }
  .chest-item .del {
    background:none; border:none; color:#8b4040; font-size:12px;
    cursor:pointer; padding:4px 8px; font-family:inherit;
  }
  .chest-empty { text-align:center; color:var(--gold-dim); font-size:13px; padding:40px 0; }

  /* ---- 添加页 ---- */
  .add-page { padding:16px; flex:1; overflow-y:auto; }
  .add-page label { display:block; font-size:13px; color:var(--gold-dim); margin-bottom:6px; letter-spacing:1px; }
  .add-page textarea, .add-page input[type="text"] {
    width:100%; background:rgba(245,237,218,.06); border:1px solid var(--gold-dim);
    color:var(--paper); padding:10px; font-size:15px; border-radius:2px;
    font-family:inherit; outline:none; margin-bottom:16px; resize:vertical;
  }
  .add-page textarea { min-height:120px; }
  .add-page textarea::placeholder, .add-page input::placeholder { color:var(--gold-dim); }
  .add-save {
    width:100%; padding:12px; background:var(--gold); color:var(--ink);
    border:none; font-size:15px; letter-spacing:3px; cursor:pointer;
    font-family:inherit; margin-top:8px;
  }
  .add-save:active { opacity:.8; }

  /* ---- 底部导航 ---- */
  .bottom-nav {
    display:flex; border-top:1px solid var(--gold-dim); flex-shrink:0;
  }
  .bottom-nav button {
    flex:1; padding:10px 0; background:none; border:none;
    color:var(--gold-dim); font-size:12px; letter-spacing:2px;
    cursor:pointer; font-family:inherit;
  }
  .bottom-nav button.active { color:var(--gold); }
</style>
</head>
<body>

<!-- ===== 聊天页 ===== -->
<div class="page active" id="page-chat">
  <div class="header">
    <h1>南洲旧梦</h1>
    <button class="header-btn" onclick="go('chest')">信匣</button>
  </div>
  <div class="chat-area" id="chat-area">
    <div class="empty-state" id="empty-state">
      <div class="title">信匣未启</div>
      <div class="hint">殿下，臣在等您的信。<br>先去信匣里，写一句话给臣吧。</div>
      <button class="go-btn" onclick="go('chest')">开启信匣</button>
    </div>
  </div>
  <div class="input-bar" id="input-bar" style="display:none">
    <input type="text" id="msg-input" placeholder="写一句话……" onkeydown="if(event.key==='Enter')send()">
    <button class="seal-btn" onclick="send()">封缄</button>
  </div>
</div>

<!-- ===== 信匣页 ===== -->
<div class="page" id="page-chest">
  <div class="header">
    <h1>信匣</h1>
    <button class="header-btn" onclick="go('chat')">返回</button>
  </div>
  <div class="chest-tabs" id="chest-tabs">
    <button class="active" data-type="letter" onclick="switchTab(this)">信笺</button>
    <button data-type="gesture" onclick="switchTab(this)">举止</button>
    <button data-type="image" onclick="switchTab(this)">影像</button>
    <button data-type="tune" onclick="switchTab(this)">曲调</button>
  </div>
  <div class="chest-list" id="chest-list"></div>
  <div class="bottom-nav">
    <button onclick="goAdd('letter')">＋信笺</button>
    <button onclick="goAdd('gesture')">＋举止</button>
    <button onclick="goAdd('image')">＋影像</button>
    <button onclick="goAdd('tune')">＋曲调</button>
  </div>
</div>

<!-- ===== 添加页 ===== -->
<div class="page" id="page-add">
  <div class="header">
    <h1 id="add-title">添一封信笺</h1>
    <button class="header-btn" onclick="go('chest')">返回</button>
  </div>
  <div class="add-page">
    <label id="add-label">写下想对他说的话，或他会对你说的话</label>
    <textarea id="add-content" placeholder="在此书写……"></textarea>
    <button class="add-save" onclick="saveItem()">存入信匣</button>
  </div>
</div>

<script>
const TYPE_LABELS = { letter:'信笺', gesture:'举止', image:'影像', tune:'曲调' };
const TYPE_TITLES = {
  letter:'添一封信笺', gesture:'记一笔举止', image:'存一幅影像', tune:'录一曲曲调'
};
const TYPE_HINTS = {
  letter:'写下想对他说的话，或他会对你说的话',
  gesture:'描述一个动作，如：*他替你拢了拢披风*',
  image:'描述一幅画面或物件，如：南国之刃的舰影',
  tune:'记下一段曲调名或歌词，如：南洲民谣·归帆'
};

let currentTab = 'letter';
let addingType = 'letter';
let chatHistory = [];

// ---- 存储层（先用 localStorage，后续可切 OPFS）----
function loadChest() {
  try { return JSON.parse(localStorage.getItem('nz_chest') || '{}'); }
  catch { return {}; }
}
function saveChest(data) {
  localStorage.setItem('nz_chest', JSON.stringify(data));
}
function loadHistory() {
  try { return JSON.parse(localStorage.getItem('nz_history') || '[]'); }
  catch { return []; }
}
function saveHistory(data) {
  localStorage.setItem('nz_history', JSON.stringify(data));
}

// ---- 页面切换 ----
function go(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + page).classList.add('active');
  if (page === 'chest') renderChest();
  if (page === 'chat') renderChat();
}
function goAdd(type) {
  addingType = type;
  document.getElementById('add-title').textContent = TYPE_TITLES[type];
  document.getElementById('add-label').textContent = TYPE_HINTS[type];
  document.getElementById('add-content').value = '';
  go('add');
}

// ---- 信匣 ----
function switchTab(btn) {
  document.querySelectorAll('#chest-tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentTab = btn.dataset.type;
  renderChest();
}

function renderChest() {
  const chest = loadChest();
  const items = chest[currentTab] || [];
  const list = document.getElementById('chest-list');
  if (items.length === 0) {
    list.innerHTML = '<div class="chest-empty">此处尚空，添一笔吧。</div>';
    return;
  }
  list.innerHTML = items.map((item, i) => `
    <div class="chest-item">
      <div class="text">${esc(item)}</div>
      <button class="del" onclick="delItem('${currentTab}',${i})">✕</button>
    </div>
  `).join('');
}

function saveItem() {
  const val = document.getElementById('add-content').value.trim();
  if (!val) return;
  const chest = loadChest();
  if (!chest[addingType]) chest[addingType] = [];
  chest[addingType].push(val);
  saveChest(chest);
  go('chest');
  currentTab = addingType;
  document.querySelectorAll('#chest-tabs button').forEach(b => {
    b.classList.toggle('active', b.dataset.type === currentTab);
  });
  renderChest();
}

function delItem(type, index) {
  const chest = loadChest();
  if (chest[type]) { chest[type].splice(index, 1); saveChest(chest); }
  renderChest();
}

// ---- 聊天 ----
function renderChat() {
  chatHistory = loadHistory();
  const area = document.getElementById('chat-area');
  const empty = document.getElementById('empty-state');
  const inputBar = document.getElementById('input-bar');

  if (chatHistory.length === 0) {
    empty.style.display = '';
    inputBar.style.display = 'none';
    // 移除之前的消息节点
    area.querySelectorAll('.msg').forEach(m => m.remove());
    return;
  }
  empty.style.display = 'none';
  inputBar.style.display = '';

  // 重建消息
  area.querySelectorAll('.msg').forEach(m => m.remove());
  chatHistory.forEach(msg => appendMsg(msg.role, msg.content, msg.type, false));
  area.scrollTop = area.scrollHeight;
}

function send() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  appendMsg('you', text, 'letter');
  chatHistory.push({ role:'you', content:text, type:'letter' });

  // 随机回复
  const reply = pickRandom();
  if (reply) {
    setTimeout(() => {
      appendMsg('him', reply.content, reply.type);
      chatHistory.push({ role:'him', content:reply.content, type:reply.type });
      saveHistory(chatHistory);
      const area = document.getElementById('chat-area');
      area.scrollTop = area.scrollHeight;
    }, 600 + Math.random() * 800);
  }
  saveHistory(chatHistory);
  const area = document.getElementById('chat-area');
  area.scrollTop = area.scrollHeight;
}

function pickRandom() {
  const chest = loadChest();
  const all = [];
  for (const type of Object.keys(TYPE_LABELS)) {
    (chest[type] || []).forEach(c => all.push({ type, content: c }));
  }
  if (all.length === 0) return null;
  return all[Math.floor(Math.random() * all.length)];
}

function appendMsg(role, content, type, save=true) {
  const area = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === 'you' ? 'you' : 'him');
  const label = role === 'you' ? '殿下' : '柏源';
  const tag = TYPE_LABELS[type] || '';
  div.innerHTML = `
    <div class="label">${label}</div>
    ${tag ? `<span class="type-tag">${tag}</span>` : ''}
    <div class="bubble">${esc(content)}</div>
  `;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 初始化
renderChat();
</script>
</body>
</html>

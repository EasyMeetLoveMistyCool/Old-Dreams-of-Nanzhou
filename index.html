<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>南洲舊夢</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body { font-family: -apple-system, "HarmonyOS Sans", "PingFang TC", "Microsoft JhengHei", sans-serif; background: var(--bg-color); color: var(--text-color); transition: background .3s, color .3s; }
  
  :root {
    --bg-color:#f0f2f5; --topbar-border:#e4e6eb; --bubble-me:#d6ecff; --bubble-them:rgba(255,255,255,.85);
    --bubble-action-me:rgba(255,230,235,.9); --bubble-action-them:rgba(255,235,240,.85);
    --text-color:#000000; --text-secondary:#707579; --time-color:#a0a0a0;
    --input-bg:rgba(255,255,255,.4); --primary:#3390ec; --border-light:rgba(0,0,0,.05);
    --bubble-font: "LXGW WenKai", "霞鹜文楷", "Kaiti TC", "STKaiti", "Songti TC", "Microsoft JhengHei", serif;
    
    --bubble-daily-them: rgba(255,249,249,0.45);
    --bubble-daily-me: rgba(242,232,213,0.45);
    --bubble-night-them: rgba(74,59,76,0.45);
    --bubble-night-me: rgba(163,74,96,0.45);
    
    --text-daily: #4A3E3E;
    --text-night: #F7F2F2;
    
    --date-daily-bg: rgba(255,249,249,0.8);
    --date-daily-text: #4A3E3E;
    --date-night-bg: rgba(163,74,96,0.8);
    --date-night-text: #F7F2F2;
    
    --action-daily-text: #8a4a58;
  }
  
  body.theme-sky { --bg-color:#e6ebee; --bubble-me:#d6ecff; }
  body.theme-forest { --bg-color:#e8efe9; --bubble-me:#d4ebd9; --primary:#4caf50; }
  body.theme-sunset { --bg-color:#fdf5eb; --bubble-me:#ffe0b2; --primary:#ff9800; }
  body.theme-twilight { --bg-color:#e0e0e0; --bubble-me:#cfd8dc; --primary:#607d8b; }
  body.theme-crabapple { --bg-color:#fcf2f3; --bubble-me:#ffcdd2; --primary:#e57373; }
  body.theme-rain { --bg-color:#eef4f4; --bubble-me:#b2dfdb; --primary:#009688; }
  body.theme-paper { --bg-color:#f5f1e6; --bubble-me:#f0e6d2; --primary:#8d6e63; }
  body.theme-ink { --bg-color:#f4f4f4; --bubble-me:#e0e0e0; --primary:#424242; }
  body.theme-cyber { --bg-color:#000; --topbar-border:#222; --bubble-me:rgba(0,51,102,.85); --bubble-them:rgba(26,26,26,.85); --bubble-action-me:rgba(80,30,40,.85); --bubble-action-them:rgba(60,20,30,.85); --text-color:#fff; --text-secondary:#888; --time-color:#555; --input-bg:rgba(255,255,255,.1); --primary:#00b0ff; --border-light:rgba(255,255,255,.05); }
  body.theme-space { --bg-color:#0b1320; --topbar-border:#1a2639; --bubble-me:rgba(30,58,95,.85); --bubble-them:rgba(26,38,57,.85); --bubble-action-me:rgba(70,30,45,.85); --bubble-action-them:rgba(50,20,35,.85); --text-color:#e0e0e0; --text-secondary:#8fa0b5; --time-color:#5a6b7c; --input-bg:rgba(255,255,255,.1); --primary:#4a90e2; --border-light:rgba(255,255,255,.05); }
  body.theme-nightpurple { --bg-color:#150e1c; --topbar-border:#2b1d36; --bubble-me:rgba(68,34,102,.85); --bubble-them:rgba(43,29,54,.85); --bubble-action-me:rgba(80,40,60,.85); --bubble-action-them:rgba(60,25,45,.85); --text-color:#e8dff0; --text-secondary:#9a86a8; --time-color:#6c5a78; --input-bg:rgba(255,255,255,.1); --primary:#b388ff; --border-light:rgba(255,255,255,.05); }
  body.theme-pureblack { --bg-color:#000; --topbar-border:#1a1a1a; --bubble-me:rgba(51,51,51,.85); --bubble-them:rgba(17,17,17,.85); --bubble-action-me:rgba(60,40,40,.85); --bubble-action-them:rgba(40,25,25,.85); --text-color:#e0e0e0; --text-secondary:#666; --time-color:#444; --input-bg:rgba(255,255,255,.1); --primary:#888; --border-light:rgba(255,255,255,.05); }

  body.is-night-mode {
    --bg-color: #1a1216 !important; 
    --topbar-border: #3a252b !important; 
    --bubble-me: rgba(80, 30, 50, 0.85) !important; 
    --bubble-them: rgba(40, 35, 45, 0.85) !important;
    --bubble-action-me: rgba(90, 40, 50, 0.85) !important;
    --bubble-action-them: rgba(60, 30, 40, 0.85) !important;
    --text-color: #f5e6e8 !important; 
    --text-secondary: rgba(212, 122, 138, 0.6) !important; 
    --time-color: rgba(212, 122, 138, 0.5) !important;
    --input-bg: rgba(0,0,0,0.3) !important; 
    --primary: #d47a8a !important; 
    --border-light: rgba(255,255,255,0.05) !important;
  }

  #app { height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; background:var(--bg-color); }
  .page { position:absolute; inset:0; display:flex; flex-direction:column; transition:transform .25s ease; }
  .page-list { z-index:1; } .page-create,.page-sub,.page-settings { z-index:2; transform:translateX(100%); } .page-chat { z-index:3; transform:translateX(100%); } .page-fav { z-index:4; transform:translateX(100%); } .page-notes { z-index:5; transform:translateX(100%); } .page-adjust { z-index:6; transform:translateX(100%); }
  .page-chat.show,.page-create.show,.page-sub.show,.page-settings.show,.page-fav.show,.page-notes.show,.page-adjust.show { transform:translateX(0); }

  .topbar { min-height:56px; flex:0 0 auto; display:flex; align-items:center; padding:0 8px; z-index:10; background:transparent; }
  .tab-bar { display:flex; border-bottom:1px solid var(--border-light); }
  .sub-tab { border-bottom:1px solid var(--border-light); }
  
  .icon-btn { width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; color:var(--text-secondary); background:transparent; border:none; flex:0 0 40px; z-index:20; }
  
  .header-avatar-wrap { width:36px; height:36px; flex:0 0 36px; margin-right:10px; position:relative; display:flex; align-items:center; justify-content:center; }
  .avatar-sm { width:100%; height:100%; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; overflow:hidden; }
  
  .header-dual-avatar { position:relative; width:36px; height:36px; }
  .header-dual-avatar .du-av { position:absolute; width:24px; height:24px; border-radius:50%; background-size:cover; background-position:center; border:1px solid rgba(255,255,255,.8); display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:600; color:#fff; top:6px; animation: nightDualBreath 3s ease-in-out infinite alternate, nightDualClose 3.5s ease-in-out infinite alternate; }
  .header-dual-avatar .du-av.me { left:0; z-index:1; }
  .header-dual-avatar .du-av.them { right:0; z-index:2; }
  @keyframes nightDualClose { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
  @keyframes nightDualBreath { 0% { opacity: 0.7; } 100% { opacity: 1; } }

  .header-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; padding:8px 0; }
  .header-title { font-size:16px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-color); margin-bottom:2px; }
  .header-sub { font-size:12px; color:var(--text-secondary); word-break:break-word; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .chat-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .chat-row { display:flex; align-items:center; gap:12px; padding:12px 14px; border-bottom:1px solid var(--border-light); background: transparent; -webkit-user-select: none; user-select: none; outline: none; -webkit-touch-callout: none; touch-action: manipulation; }
  .chat-row:active, .chat-row:focus, .chat-row:hover { background: transparent !important; outline: none !important; }
  .chat-row.pinned .chat-room-name, .chat-row.pinned .chat-their-name, .chat-row.pinned .chat-preview, .chat-row.pinned .chat-time { color: #e57373 !important; }
  
  .avatar-lg { width:48px; height:48px; border-radius:50%; background:var(--primary); color:#fff; object-fit:cover; display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 48px; overflow:hidden; }
  .chat-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .chat-top-row { display:flex; align-items:baseline; gap:6px; overflow:hidden; }
  .chat-room-name { font-size:16px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-their-name { font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-mode-icon { font-size:13px; flex:0 0 auto; margin-left:2px; }
  .chat-preview { font-size:14px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-time { font-size:12px; color:var(--text-secondary); flex:0 0 auto; align-self:flex-start; margin-top:4px; }
  .chat-empty { text-align:center; color:var(--text-secondary); padding:40px 20px; font-size:14px; }
  .fab { position:absolute; right:18px; bottom:22px; width:56px; height:56px; border-radius:50%; background:var(--primary); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.2); z-index:5; border:none; }

  .page-chat { background-size:cover; background-position:center; }
  .chat-bg-mask { position:absolute; inset:0; pointer-events:none; z-index:1; transition: background .3s; }
  .page-chat .topbar { background:transparent !important; border-bottom:none; }
  .messages-wrap { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; position:relative; z-index:2; }
  .messages { padding:10px 14px 20px; display:flex; flex-direction:column; min-height:100%; }
  
  .date-divider { align-self:center; font-size:12px; padding:4px 12px; border-radius:12px; margin:16px 0; font-family: var(--bubble-font); letter-spacing: 0.05em; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); background: var(--date-daily-bg); color: var(--date-daily-text); }
  body.is-night-mode .date-divider { background: var(--date-night-bg); color: var(--date-night-text); }

  .msg-group { display:flex; flex-direction:column; align-items:center; margin-bottom:24px; width:100%; animation:fadeIn .4s ease forwards; position:relative; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  
  .msg-avatar-top { width:36px; height:36px; border-radius:50%; background:var(--primary); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; margin-bottom:8px; object-fit:cover; overflow:hidden; }
  
  .msg-dual-avatar { position:relative; width:52px; height:36px; margin-bottom:8px; }
  .msg-dual-avatar .du-av { position:absolute; width:36px; height:36px; border-radius:50%; background-size:cover; background-position:center; border:1px solid rgba(255,255,255,.8); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; color:#fff; top:0; }
  .msg-dual-avatar .du-av.them { left:0; }
  .msg-dual-avatar .du-av.me { right:0; }
  .msg-group.them .msg-dual-avatar .du-av.them { z-index:3; }
  .msg-group.them .msg-dual-avatar .du-av.me { z-index:2; }
  .msg-group.me .msg-dual-avatar .du-av.me { z-index:3; }
  .msg-group.me .msg-dual-avatar .du-av.them { z-index:2; }

  .layout-yuyan .msg-group { align-items:stretch; }
  .layout-yuyan .msg-group .msg-avatar-top { margin-bottom:0; }
  .layout-yuyan .msg-dual-avatar { margin-bottom:0; }
  .layout-yuyan .msg-row { display:flex; align-items:flex-start; gap:8px; width:100%; }
  .layout-yuyan .msg-group.them .msg-row { flex-direction:row; justify-content:flex-start; }
  .layout-yuyan .msg-group.me .msg-row { flex-direction:row; justify-content:flex-end; }
  .layout-yuyan .msg-group.them .msg-dual-avatar { margin-right:0; }
  .layout-yuyan .msg-group.me .msg-dual-avatar { margin-left:0; }
  .layout-yuyan .msg-group .bubble { max-width:72%; }

  .bubble { max-width:85%; padding:16px 20px; border-radius:16px; font-size:15px; line-height:1.5; word-break:break-word; text-align:center; box-shadow:0 4px 15px rgba(0,0,0,.08); display:flex; flex-direction:column; gap:10px; transition: background .3s, color .3s; font-family: var(--bubble-font); font-weight:400; letter-spacing:0.03em; backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); }
  
  .msg-group.them .bubble { background:var(--bubble-daily-them); color:var(--text-daily); }
  .msg-group.me .bubble { background:var(--bubble-daily-me); color:var(--text-daily); }
  body.is-night-mode .msg-group.them .bubble { background:var(--bubble-night-them); color:var(--text-night); }
  body.is-night-mode .msg-group.me .bubble { background:var(--bubble-night-me); color:var(--text-night); }
  
  .msg-group.them .bubble.action-bubble { background:var(--bubble-action-them); border:1px solid rgba(255,150,150,.3); color:var(--action-daily-text); }
  .msg-group.me .bubble.action-bubble { background:var(--bubble-action-me); border:1px solid rgba(255,150,150,.3); color:var(--action-daily-text); }
  body.is-night-mode .msg-group.them .bubble.action-bubble { color:var(--text-night); }
  body.is-night-mode .msg-group.me .bubble.action-bubble { color:var(--text-night); }
  body.theme-cyber .msg-group .bubble, body.theme-space .msg-group .bubble, body.theme-nightpurple .msg-group .bubble, body.theme-pureblack .msg-group .bubble { color:var(--text-night); }

  .card-line { display:block; opacity:0; transform:translateY(5px); animation:cardIn .5s ease forwards; }
  .card-line.no-anim { animation:none !important; opacity:1 !important; transform:none !important; }
  @keyframes cardIn { to{opacity:1;transform:translateY(0)} }
  .bubble .sticker-img { display:block; max-width:100%; max-height:200px; border-radius:8px; margin:5px auto 0; opacity:0; animation:cardIn .5s ease forwards; }
  
  .msg-time-center { font-size:11px; color:var(--time-color); margin-top:6px; text-align:left; width:100%; display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:6px; flex-wrap:nowrap; }
  .msg-time-center .time-text { font-size:12px; white-space:nowrap; }
  .msg-time-center .rose-mark { width:22px; height:22px; flex:0 0 22px; object-fit:cover; opacity:0.45; border-radius:4px; }

  .composer { flex:0 0 auto; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom)); display:flex; align-items:flex-end; gap:8px; z-index:10; background:transparent; flex-wrap:wrap; transition: background .3s; }
  .composer textarea { flex:1; min-width:0; height:44px; max-height:120px; border-radius:22px; border:none; background:rgba(255,255,255,.45); backdrop-filter:blur(15px); padding:12px 16px; font-size:15px; color:var(--text-color); outline:none; resize:none; line-height:1.4; transition: background .3s; }
  body.is-night-mode .composer textarea { background: rgba(0,0,0,0.3); }
  .composer textarea::placeholder { color:var(--text-secondary); }
  .send-btn { width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.45); backdrop-filter:blur(15px); color:var(--primary); border:none; display:flex; align-items:center; justify-content:center; flex:0 0 44px; }
  .send-btn:not(:disabled) { background:var(--primary); color:#fff; opacity:.9; }
  .send-btn:disabled { opacity:.5; }
  .send-btn svg { width:22px; height:22px; fill:currentColor; margin-left:2px; }
  .pending-sticker-preview { width:100%; display:none; margin-bottom:5px; padding-left:10px; }
  .pending-sticker-preview.show { display:block; }
  .pending-sticker-preview img { height:50px; border-radius:6px; border:2px solid var(--primary); }

  .create-scroll { flex:1; overflow-y:auto; padding:20px; }
  .tab-item { flex:1; text-align:center; padding:12px 0; font-size:15px; color:var(--text-secondary); font-weight:500; }
  .tab-item.active { color:var(--primary); border-bottom:2px solid var(--primary); }
  .add-box { display:flex; flex-direction:column; background:var(--input-bg); border-radius:8px; padding:12px; margin-bottom:20px; }
  .add-textarea { width:100%; height:100px; border:none; background:transparent; color:var(--text-color); font-size:15px; outline:none; resize:none; }
  .add-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-light); padding-top:10px; margin-top:10px; }
  .add-count { font-size:13px; color:var(--text-secondary); }
  .btn-add { background:var(--primary); color:#fff; border:none; padding:6px 16px; border-radius:6px; font-size:14px; }
  .search-input { width:100%; height:40px; border-radius:8px; background:var(--input-bg); border:none; padding:0 14px; font-size:14px; color:var(--text-color); outline:none; margin-bottom:15px; }
  .toolbar { display:flex; justify-content:space-around; padding:10px 0; margin-bottom:10px; }
  .tool-btn { background:transparent; border:none; color:var(--text-color); font-size:14px; font-weight:500; padding:5px 10px; }
  .batch-toolbar { display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); padding:10px 15px; border-radius:8px; margin-bottom:10px; }
  .batch-btn { background:transparent; border:none; color:var(--primary); font-size:14px; font-weight:500; }
  .batch-btn.danger { color:#e53935; }
  .card-list-header { font-size:13px; color:var(--text-secondary); margin-bottom:10px; padding-left:5px; }
  .card-item { display:flex; justify-content:space-between; align-items:flex-start; background:var(--input-bg); border-radius:8px; padding:12px 14px; margin-bottom:12px; gap:10px; }
  .card-text { flex:1; font-size:15px; line-height:1.4; word-break:break-word; }
  .card-actions { display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
  .btn-edit,.btn-del { background:transparent; border:none; font-size:13px; }
  .btn-edit { color:var(--primary); } .btn-del { color:#e53935; }
  .stamp-upload-box { width:100%; height:120px; border:2px dashed var(--topbar-border); border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:15px; color:var(--text-secondary); margin-bottom:20px; background:rgba(128,128,128,.05); }
  .stamp-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stamp-item { aspect-ratio:1; border-radius:8px; overflow:hidden; background:var(--input-bg); position:relative; }
  .stamp-item img { width:100%; height:100%; object-fit:cover; }
  .stamp-checkbox { position:absolute; top:5px; right:5px; width:20px; height:20px; accent-color:#e53935; display:none; }
  .stamp-grid.batch-mode .stamp-checkbox { display:block; }
  .music-add-box { display:flex; flex-direction:column; background:var(--input-bg); border-radius:8px; padding:15px; margin-bottom:20px; gap:10px; }
  .music-input { width:100%; height:44px; border-radius:6px; background:rgba(128,128,128,.1); border:none; padding:0 12px; font-size:15px; color:var(--text-color); outline:none; }
  .music-upload-row { display:flex; gap:10px; }
  .music-file-box { flex:1; height:44px; border-radius:6px; border:1px dashed var(--topbar-border); display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--text-secondary); background:rgba(128,128,128,.05); overflow:hidden; white-space:nowrap; text-overflow:ellipsis; padding:0 10px; }
  .music-list-item { display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); border-radius:8px; padding:12px; margin-bottom:10px; gap:10px; }
  .music-info { flex:1; min-width:0; }
  .music-title { font-size:15px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .music-artist { font-size:13px; color:var(--text-secondary); margin-top:4px; }

  .menu-mask { position:fixed; inset:0; background:rgba(0,0,0,.25); display:none; z-index:50; }
  .menu-mask.show { display:block; }
  .menu { position:absolute; top:56px; right:10px; background:var(--bg-color); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.18); min-width:150px; overflow:hidden; border:1px solid var(--topbar-border); }
  .menu-item { padding:12px 18px; font-size:15px; color:var(--text-color); white-space:nowrap; }
  .menu-item.danger { color:#e53935; }
  .action-sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:150; align-items:center; justify-content:center; padding:20px; }
  .action-sheet-mask.show { display:flex; }
  .action-sheet { background:var(--bg-color); width:100%; max-width:260px; border-radius:12px; overflow:hidden; color:var(--text-color); }
  .action-item { padding:14px 20px; font-size:16px; text-align:center; border-bottom:1px solid var(--border-light); }
  .action-item.danger { color:#e53935; }
  
  .layout-panel-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:160; align-items:center; justify-content:center; padding:20px; }
  .layout-panel-mask.show { display:flex; }
  .layout-panel { background:var(--bg-color); width:100%; max-width:260px; border-radius:12px; overflow:hidden; color:var(--text-color); border:1px solid var(--topbar-border); }
  .layout-panel-title { padding:12px; text-align:center; font-size:15px; font-weight:600; border-bottom:1px solid var(--border-light); }
  .layout-option { padding:16px 20px; font-size:16px; text-align:center; border-bottom:1px solid var(--border-light); color:var(--text-color); }

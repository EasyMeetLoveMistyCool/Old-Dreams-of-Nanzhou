<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>南洲舊夢</title>
<style>
  /* ========== 基础重置 ========== */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "HarmonyOS Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    transition: background .3s, color .3s;
  }

  /* ========== 主题变量 ========== */
  :root {
    --bg-color: #f0f2f5; --topbar-border: #e4e6eb;
    --bubble-me: #d6ecff; --bubble-them: rgba(255,255,255,0.85);
    --bubble-action-me: rgba(255, 230, 235, 0.9); /* 绯红信笺底色 */
    --bubble-action-them: rgba(255, 235, 240, 0.85);
    --text-color: #000000; --text-secondary: #707579; --time-color: #a0a0a0;
    --input-bg: rgba(128,128,128,0.15); --primary: #3390ec; --border-light: rgba(0,0,0,0.05);
    --pinned-bg: rgba(255, 245, 246, 0.9);
  }
  body.theme-sky { --bg-color: #e6ebee; --bubble-me: #d6ecff; }
  body.theme-forest { --bg-color: #e8efe9; --bubble-me: #d4ebd9; --primary: #4caf50; }
  body.theme-sunset { --bg-color: #fdf5eb; --bubble-me: #ffe0b2; --primary: #ff9800; }
  body.theme-twilight { --bg-color: #e0e0e0; --bubble-me: #cfd8dc; --primary: #607d8b; }
  body.theme-crabapple { --bg-color: #fcf2f3; --bubble-me: #ffcdd2; --primary: #e57373; }
  body.theme-rain { --bg-color: #eef4f4; --bubble-me: #b2dfdb; --primary: #009688; }
  body.theme-paper { --bg-color: #f5f1e6; --bubble-me: #f0e6d2; --primary: #8d6e63; }
  body.theme-ink { --bg-color: #f4f4f4; --bubble-me: #e0e0e0; --primary: #424242; }
  
  body.theme-cyber { 
    --bg-color: #000000; --topbar-border: #222;
    --bubble-me: rgba(0, 51, 102, 0.85); --bubble-them: rgba(26, 26, 26, 0.85);
    --bubble-action-me: rgba(80, 30, 40, 0.85); --bubble-action-them: rgba(60, 20, 30, 0.85);
    --text-color: #ffffff; --text-secondary: #888; --time-color: #555;
    --input-bg: rgba(255,255,255,0.1); --primary: #00b0ff; --border-light: rgba(255,255,255,0.05); --pinned-bg: rgba(43, 31, 36, 0.9);
  }
  body.theme-space { 
    --bg-color: #0b1320; --topbar-border: #1a2639;
    --bubble-me: rgba(30, 58, 95, 0.85); --bubble-them: rgba(26, 38, 57, 0.85);
    --bubble-action-me: rgba(70, 30, 45, 0.85); --bubble-action-them: rgba(50, 20, 35, 0.85);
    --text-color: #e0e0e0; --text-secondary: #8fa0b5; --time-color: #5a6b7c;
    --input-bg: rgba(255,255,255,0.1); --primary: #4a90e2; --border-light: rgba(255,255,255,0.05); --pinned-bg: rgba(43, 31, 36, 0.9);
  }
  body.theme-nightpurple { 
    --bg-color: #150e1c; --topbar-border: #2b1d36;
    --bubble-me: rgba(68, 34, 102, 0.85); --bubble-them: rgba(43, 29, 54, 0.85);
    --bubble-action-me: rgba(80, 40, 60, 0.85); --bubble-action-them: rgba(60, 25, 45, 0.85);
    --text-color: #e8dff0; --text-secondary: #9a86a8; --time-color: #6c5a78;
    --input-bg: rgba(255,255,255,0.1); --primary: #b388ff; --border-light: rgba(255,255,255,0.05); --pinned-bg: rgba(43, 31, 36, 0.9);
  }
  body.theme-pureblack { 
    --bg-color: #000000; --topbar-border: #1a1a1a;
    --bubble-me: rgba(51, 51, 51, 0.85); --bubble-them: rgba(17, 17, 17, 0.85);
    --bubble-action-me: rgba(60, 40, 40, 0.85); --bubble-action-them: rgba(40, 25, 25, 0.85);
    --text-color: #e0e0e0; --text-secondary: #666; --time-color: #444;
    --input-bg: rgba(255,255,255,0.1); --primary: #888; --border-light: rgba(255,255,255,0.05); --pinned-bg: rgba(43, 31, 36, 0.9);
  }

  /* ========== 核心容器 ========== */
  #app { height:100dvh; display:flex; flex-direction:column; position:relative; overflow:hidden; background: var(--bg-color); }

  /* ========== 页面容器 ========== */
  .page { position:absolute; inset:0; display:flex; flex-direction:column; transition:transform .25s ease; }
  .page-list { z-index: 1; pointer-events: auto; } 
  .page-create, .page-sub, .page-settings { z-index: 2; transform:translateX(100%); pointer-events: auto; }
  .page-chat { z-index: 3; transform:translateX(100%); pointer-events: auto; }
  
  .page-chat.show, .page-create.show, .page-sub.show, .page-settings.show { transform:translateX(0); }

  /* ========== 顶栏 ========== */
  .topbar {
    min-height:56px; flex:0 0 auto; 
    display:flex; align-items:center;
    padding:0 8px;
    border-bottom:1px solid var(--topbar-border);
    position:relative; z-index:10;
    background: transparent;
  }
  .icon-btn {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--text-secondary); cursor:pointer;
    background:transparent; border:none; flex: 0 0 40px; z-index: 20;
  }
  .icon-btn:active { background:rgba(128,128,128,0.15); }
  
  .avatar-sm {
    width:36px; height:36px; border-radius:50%;
    background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex:0 0 36px; margin-right:10px;
  }
  
  .header-info { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; padding: 8px 0; }
  .header-title { 
    font-size:16px; font-weight:500; line-height:1.2; 
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; 
    color:var(--text-color); margin-bottom: 2px;
  }
  .header-sub { 
    font-size:12px; color:var(--text-secondary); line-height:1.3; 
    white-space: normal; word-break: break-word; 
  }

  /* ========== 列表页 ========== */
  .chat-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .chat-row {
    display:flex; align-items:center; gap:12px; padding:12px 14px; 
    background: transparent; cursor:pointer; border-bottom:1px solid var(--topbar-border); user-select: none;
  }
  .chat-row:active { background:rgba(128,128,128,0.1); }
  .chat-row.pinned { background: var(--pinned-bg); }

  .avatar-lg {
    width:48px; height:48px; border-radius:50%; background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center; font-size:20px; flex:0 0 48px;
  }
  .chat-info { flex:1; min-width:0; display:flex; flex-direction:column; justify-content:center; gap:3px; }
  .chat-top-row { display:flex; align-items:baseline; gap:6px; overflow:hidden; }
  .chat-room-name { font-size:16px; font-weight:600; color:var(--text-color); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-their-name { font-size:13px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-preview { font-size:14px; color:var(--text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-time { font-size:12px; color:var(--text-secondary); flex:0 0 auto; align-self:flex-start; margin-top:4px; }
  .chat-empty { text-align:center; color:var(--text-secondary); padding:40px 20px; font-size:14px; }

  .fab {
    position:absolute; right:18px; bottom:22px; width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:#fff; font-size:28px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(0,0,0,.2); cursor:pointer; z-index:5; border:none;
  }

  /* ========== 聊天页专属逻辑 ========== */
  .page-chat { background-size: cover; background-position: center; }
  .chat-bg-mask { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .page-chat .topbar { background: transparent !important; border-bottom: none; z-index: 10; }

  .messages-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; z-index: 2; }
  .messages { padding: 10px 14px 20px; display: flex; flex-direction: column; min-height: 100%; }
  
  .date-divider {
    align-self:center; background:rgba(0,0,0,.18); color:#fff; font-size:12px; padding:4px 12px; border-radius:12px;
    margin:16px 0; font-weight:500;
  }
  body.theme-cyber .date-divider, body.theme-space .date-divider, body.theme-nightpurple .date-divider, body.theme-pureblack .date-divider { background:rgba(255,255,255,.15); }

  .msg-group {
    display: flex; flex-direction: column; align-items: center;
    margin-bottom: 24px;
    width: 100%;
    animation: fadeIn 0.4s ease forwards;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-avatar-top {
    width: 36px; height: 36px; border-radius: 50%;
    background: var(--primary); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; margin-bottom: 8px; object-fit: cover;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }

  .bubble {
    max-width: 85%; padding: 16px 20px; border-radius: 16px; position: relative; font-size: 15px; line-height: 1.6;
    word-break: break-word; text-align: center;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    display: flex; flex-direction: column; gap: 10px;
  }

  .msg-group.them .bubble { background: var(--bubble-them); color: var(--text-color); border: 1px solid rgba(128,128,128,0.1); }
  .msg-group.me .bubble { background: var(--bubble-me); color: var(--text-color); border: 1px solid rgba(128,128,128,0.1); }

  /* 动作专属绯红信笺 */
  .msg-group.them .bubble.action-bubble { background: var(--bubble-action-them); border: 1px solid rgba(255, 150, 150, 0.3); }
  .msg-group.me .bubble.action-bubble { background: var(--bubble-action-me); border: 1px solid rgba(255, 150, 150, 0.3); }

  .card-line { 
    display:block; opacity: 0; transform: translateY(5px);
    animation: cardIn 0.5s ease forwards;
  }
  .card-line.no-anim {
    animation: none !important; opacity: 1 !important; transform: none !important;
  }
  @keyframes cardIn {
    to { opacity: 1; transform: translateY(0); }
  }
  
  .bubble .sticker-img { display:block; max-width:100%; max-height:200px; border-radius:8px; margin: 5px auto 0; opacity: 0; animation: cardIn 0.5s ease forwards; }
  .msg-time-center { font-size: 11px; color: var(--time-color); margin-top: 6px; text-align: right; width: 100%; }

  /* ========== 聊天页输入区 ========== */
  .composer {
    flex:0 0 auto; padding:10px; padding-bottom:calc(10px + env(safe-area-inset-bottom));
    display:flex; align-items:flex-end; gap:8px; z-index: 10; background: transparent; border-top: none; flex-wrap: wrap;
  }
  
  .pending-sticker-preview {
    width: 100%; display: none; margin-bottom: 5px; padding-left: 10px;
  }
  .pending-sticker-preview.show { display: block; }
  .pending-sticker-preview img {
    height: 50px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; border: 2px solid var(--primary);
  }

  .composer textarea {
    flex:1; min-width:0; height:44px; max-height:120px; border-radius:22px; border:none; 
    background: rgba(128,128,128,0.2); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
    padding:12px 16px; font-size:15px; color:var(--text-color); outline:none; transition: background .3s;
    resize: none; line-height: 1.4;
  }
  .composer textarea::placeholder { color:var(--text-secondary); }
  
  .send-btn {
    width:44px; height:44px; border-radius:50%; background: var(--primary); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center; flex:0 0 44px; cursor:pointer; transition: opacity .2s, background .3s; opacity: 0.9;
  }
  .send-btn:disabled { background: rgba(128,128,128,0.2); color:var(--text-secondary); opacity: 0.5; }
  .send-btn svg { width:22px; height:22px; fill:currentColor; margin-left:2px; }

  /* ========== 邮电所 ========== */
  .create-scroll { flex:1; overflow-y:auto; padding:20px; }
  .tab-bar { display:flex; background:transparent; border-bottom:1px solid var(--topbar-border); }
  .tab-item { flex:1; text-align:center; padding:12px 0; font-size:15px; color:var(--text-secondary); cursor:pointer; font-weight:500; }
  .tab-item.active { color:var(--primary); border-bottom:2px solid var(--primary); }

  .add-box { display: flex; flex-direction: column; background: var(--input-bg); border-radius: 8px; padding: 12px; margin-bottom: 20px; }
  .add-textarea { width:100%; height:100px; border:none; background:transparent; color:var(--text-color); font-size:15px; outline:none; resize:none; line-height:1.5; }
  .add-footer { display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border-light); padding-top:10px; margin-top:10px; }
  .add-count { font-size:13px; color:var(--text-secondary); }
  .btn-add { background:var(--primary); color:#fff; border:none; padding:6px 16px; border-radius:6px; font-size:14px; cursor:pointer; }

  .search-box { margin-bottom: 15px; }
  .search-input { width:100%; height:40px; border-radius:8px; background:var(--input-bg); border:none; padding:0 14px; font-size:14px; color:var(--text-color); outline:none; }

  .toolbar { display:flex; justify-content:space-around; padding:10px 0; margin-bottom:10px; }
  .tool-btn { background:transparent; border:none; color:var(--text-color); font-size:14px; font-weight:500; cursor:pointer; padding:5px 10px; }
  .tool-btn:active { opacity:0.7; }

  .batch-toolbar { display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); padding:10px 15px; border-radius:8px; margin-bottom:10px; }
  .batch-toolbar .batch-info { font-size:14px; color:var(--text-color); }
  .batch-btn { background:transparent; border:none; color:var(--primary); font-size:14px; cursor:pointer; font-weight:500; }
  .batch-btn.danger { color:#e53935; }

  .card-list-header { font-size:13px; color:var(--text-secondary); margin-bottom:10px; padding-left:5px; }
  .card-item { display:flex; justify-content:space-between; align-items:flex-start; background:var(--input-bg); border-radius:8px; padding:12px 14px; margin-bottom:12px; gap:10px; }
  .card-text { flex:1; font-size:15px; line-height:1.4; word-break:break-word; padding-top:2px; }
  .card-actions { display:flex; flex-direction:column; gap:8px; flex:0 0 auto; }
  .btn-edit, .btn-del { background:transparent; border:none; font-size:13px; cursor:pointer; padding:2px; }
  .btn-edit { color:var(--primary); }
  .btn-del { color:#e53935; }

  /* ========== 印花板块 ========== */
  .stamp-upload-box {
    width: 100%; height: 120px; border: 2px dashed var(--topbar-border); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 15px; color: var(--text-secondary);
    cursor: pointer; margin-bottom: 20px; background: rgba(128,128,128,0.05);
  }
  .stamp-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .stamp-item { aspect-ratio: 1; border-radius: 8px; overflow: hidden; background: var(--input-bg); position: relative; }
  .stamp-item img { width: 100%; height: 100%; object-fit: cover; }
  .stamp-checkbox {
    position: absolute; top: 5px; right: 5px; width: 20px; height: 20px; z-index: 2; accent-color: #e53935;
    display: none;
  }
  .stamp-grid.batch-mode .stamp-checkbox { display: block; }

  /* ========== 菜单 & 弹窗 ========== */
  .menu-mask { position:fixed; inset:0; background:rgba(0,0,0,.25); display:none; z-index:50; }
  .menu-mask.show { display:block; }
  .menu { position:absolute; top:56px; right:10px; background:var(--bg-color); border-radius:10px; box-shadow:0 4px 20px rgba(0,0,0,.18); min-width:150px; overflow:hidden; border: 1px solid var(--topbar-border); }
  .menu-item { padding:12px 18px; font-size:15px; color:var(--text-color); cursor:pointer; white-space:nowrap; }
  .menu-item:active { background:var(--input-bg); }
  .menu-item.danger { color:#e53935; }

  .action-sheet-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:150; align-items:center; justify-content:center; padding:20px; }
  .action-sheet-mask.show { display:flex; }
  .action-sheet { background:var(--bg-color); width:100%; max-width:260px; border-radius:12px; overflow:hidden; color:var(--text-color); box-shadow:0 8px 30px rgba(0,0,0,.2); }
  .action-item { padding:14px 20px; font-size:16px; text-align:center; border-bottom:1px solid var(--border-light); cursor:pointer; }
  .action-item:active { background:var(--input-bg); }
  .action-item.danger { color:#e53935; }

  .dialog-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .dialog-mask.show { display:flex; }
  .dialog { background:var(--bg-color); width:100%; max-width:320px; border-radius:12px; overflow:hidden; color:var(--text-color); }
  .dialog-title { padding:16px; font-weight:600; text-align:center; border-bottom:1px solid var(--border-light); }
  .dialog-content { padding:20px; font-size:15px; color:var(--text-color); text-align:center; }
  .dialog-input { width:100%; height:40px; border-radius:6px; border:1px solid var(--topbar-border); padding:0 10px; font-size:15px; outline:none; background:var(--input-bg); color:var(--text-color); margin-bottom:10px; }
  .dialog-footer { display:flex; border-top:1px solid var(--border-light); }
  .dialog-btn { flex:1; padding:14px 0; text-align:center; font-size:15px; cursor:pointer; border:none; background:transparent; color:var(--primary); }
  .dialog-btn:active { background:var(--input-bg); }
  .dialog-btn.cancel { color:var(--text-secondary); border-right:1px solid var(--border-light); }
  .dialog-btn.danger { color:#e53935; }

  .progress-dialog { padding: 30px 20px; text-align: center; }
  .progress-text { font-size: 15px; font-weight: 500; margin-bottom: 15px; color: var(--text-color); }
  .progress-bar-bg { width: 100%; height: 6px; background: var(--input-bg); border-radius: 3px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.1s linear; }

  .sticker-panel-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:250; align-items:flex-end; }
  .sticker-panel-mask.show { display:flex; }
  .sticker-panel { background:var(--bg-color); width:100%; max-height:50vh; border-radius:16px 16px 0 0; display:flex; flex-direction:column; animation: slideUp 0.25s ease; }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .sticker-panel-header { padding:12px; text-align:center; border-bottom:1px solid var(--border-light); font-size:15px; font-weight:600; position:relative; }
  .sticker-panel-close { position:absolute; right:15px; top:12px; font-size:16px; color:var(--text-secondary); cursor:pointer; }
  .sticker-panel-content { flex:1; overflow-y:auto; padding:15px; display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  .sticker-panel-content img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:pointer; }

  /* ⚡ 面板 */
  .flash-panel-mask { position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; z-index:250; align-items:center; justify-content:center; }
  .flash-panel-mask.show { display:flex; }
  .flash-panel { background:var(--bg-color); width:80%; max-width:300px; border-radius:16px; display:flex; flex-direction:column; overflow:hidden; animation: zoomIn 0.2s ease; }
  @keyframes zoomIn { from { transform: scale(0.9); opacity:0; } to { transform: scale(1); opacity:1; } }
  .flash-panel-header { padding:15px; text-align:center; border-bottom:1px solid var(--border-light); font-size:16px; font-weight:600; color:var(--text-color); }
  .flash-grid { display:grid; grid-template-columns: 1fr 1fr; gap:1px; background:var(--border-light); }
  .flash-item { background:var(--bg-color); padding:20px 0; text-align:center; font-size:16px; font-weight:500; color:var(--primary); cursor:pointer; }
  .flash-item:active { background:var(--input-bg); }

  .toast {
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:rgba(0,0,0,.75); color:#fff;
    font-size:13px; padding:8px 16px; border-radius:16px; z-index:300; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show { opacity:1; }
</style>
</head>
<body class="theme-sky">

<div id="app">
  <!-- 1. 列表页 -->
  <div class="page page-list" id="pageList">
    <div class="topbar">
      <div style="font-size:18px;font-weight:600;flex:1;padding-left:8px;">南洲舊夢</div>
      <button class="icon-btn" id="menuBtnList" style="color:var(--primary);">⋮</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <button class="fab" id="newChatBtn">＋</button>
  </div>

  <!-- 2. 新建页 -->
  <div class="page page-create" id="pageCreate">
    <div class="topbar">
      <button class="icon-btn" id="cancelCreateBtn">←</button>

<script>
/* ============ 基础工具 ============ */
const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);

/* ============ IndexedDB ============ */
const DB_NAME = 'nanzhou_jiu_meng';
const DB_VER = 5; // 升个版本，确保动作表建立
let db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if(!d.objectStoreNames.contains('chats')) d.createObjectStore('chats', { keyPath:'id' });
      if(!d.objectStoreNames.contains('messages')) {
        const s = d.createObjectStore('messages', { keyPath:'id' });
        s.createIndex('chatId', 'chatId', { unique:false });
      }
      if(!d.objectStoreNames.contains('cards')) {
        const s = d.createObjectStore('cards', { keyPath:'id' });
        s.createIndex('category', 'category', { unique:false });
      }
      if(!d.objectStoreNames.contains('stickers')) d.createObjectStore('stickers', { keyPath:'id' });
      // 新增动作表
      if(!d.objectStoreNames.contains('actions')) {
        const s = d.createObjectStore('actions', { keyPath:'id' });
        s.createIndex('category', 'category', { unique:false });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function reqToPromise(req){
  return new Promise((res, rej)=>{
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}

async function loadChats(){
  chats = await reqToPromise(tx('chats').getAll());
  chats.sort((a,b) => {
    const pinA = a.isPinned ? 1 : 0;
    const pinB = b.isPinned ? 1 : 0;
    if (pinA !== pinB) return pinB - pinA;
    return (b.updatedAt||0) - (a.updatedAt||0);
  });
}

/* ============ 列表页渲染 ============ */
async function renderChatList(){
  const list = $('#chatList');
  if(!chats.length){
    list.innerHTML = '<div class="chat-empty">尚無聊天室<br>點右下角 ＋ 建立新對話</div>';
    return;
  }
  list.innerHTML = '';
  for(const c of chats){
    const msgs = await getMessages(c.id);
    const last = msgs[msgs.length-1];
    let preview = '尚無訊息';
    if(last){
      if(last.type === 'sticker') preview = '[貼紙]';
      else if(last.cards && last.cards.length) preview = last.cards[0];
      else if(last.text) preview = last.text;
      else if(last.stickerData) preview = '[圖片]';
    }
    
    const avatarHtml = c.theirAvatar 
      ? `<img src="${c.theirAvatar}" class="avatar-lg">` 
      : `<div class="avatar-lg">${(c.theirNick || c.theirName ||'祂').charAt(0)}</div>`;
      
    const row = document.createElement('div');
    row.className = 'chat-row' + (c.isPinned ? ' pinned' : '');
    row.dataset.id = c.id;
    
    row.innerHTML = `
      ${avatarHtml}
      <div class="chat-info">
        <div class="chat-top-row">
          <span class="chat-room-name">${escapeHtml(c.roomName || '未命名')}</span>
          <span class="chat-their-name">${escapeHtml(c.theirName || '')}</span>
        </div>
        <div class="chat-preview">${escapeHtml(preview)}</div>
      </div>
      <div class="chat-time">${last ? fmtTime(last.time) : ''}</div>
    `;
    
    row.onclick = () => { if(!longPressTimer) openChat(c.id); };
    row.addEventListener('touchstart', (e) => {
      longPressTimer = setTimeout(() => {
        longPressTimer = null;
        activeChatForMenu = c;
        openActionSheet();
      }, 500);
    }, { passive: true });
    row.addEventListener('touchend', () => { clearTimeout(longPressTimer); longPressTimer = null; });
    row.addEventListener('touchmove', () => { clearTimeout(longPressTimer); longPressTimer = null; });
    list.appendChild(row);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(ts){
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString() === now.toDateString()) return '今天';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

/* ============ 消息逻辑 ============ */
function getMessages(chatId){
  return new Promise((res, rej)=>{
    const idx = tx('messages').index('chatId');
    const req = idx.getAll(chatId);
    req.onsuccess = ()=>{
      const arr = req.result || [];
      arr.sort((a,b)=>a.time-b.time);
      res(arr);
    };
    req.onerror = ()=>rej(req.error);
  });
}

/* ============ 聊天渲染 ============ */
function renderMessages(forceScrollBottom = false){
  const box = $('#messages');
  const wrap = $('#messagesWrap');
  
  const isNearBottom = wrap.scrollHeight - wrap.scrollTop - wrap.clientHeight < 150;
  const prevScrollTop = wrap.scrollTop;

  box.innerHTML = '';
  let lastDate = '';
  
  const c = chats.find(x=>x.id===currentChatId);
  
  for(let i = 0; i < currentMessages.length; i++){
    const m = currentMessages[i];
    const dstr = fmtDate(m.time);
    
    if(dstr !== lastDate){
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dstr;
      box.appendChild(div);
      lastDate = dstr;
    }
    
    const isMe = m.sender === 'me';
    const groupBox = document.createElement('div');
    groupBox.className = 'msg-group ' + (isMe ? 'me' : 'them');
    
    let avatarHtml = '';
    if (isMe) {
      if(c.myAvatar) avatarHtml = `<img src="${c.myAvatar}" class="msg-avatar-top">`;
      else avatarHtml = `<div class="msg-avatar-top" style="background:#999">${(c.myNick || c.myName || '我').charAt(0)}</div>`;
    } else {
      if(c.theirAvatar) avatarHtml = `<img src="${c.theirAvatar}" class="msg-avatar-top">`;
      else avatarHtml = `<div class="msg-avatar-top">${(c.theirNick || c.theirName || '祂').charAt(0)}</div>`;
    }
    groupBox.innerHTML = avatarHtml;
    
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    if(m.type === 'action') bubble.classList.add('action-bubble');
    
    let linesHtml = '';
    const isLatest = (i === currentMessages.length - 1);
    const useAnim = !forceScrollBottom && isLatest && !isMe; 
    
    if(m.cards && m.cards.length > 0){
      m.cards.forEach((cardText, idx) => {
        const animClass = useAnim ? '' : 'no-anim';
        const delay = useAnim ? (idx * (1 + Math.random() * 2)) : 0;
        linesHtml += `<span class="card-line ${animClass}" style="animation-delay: ${delay}s">${escapeHtml(cardText)}</span>`;
      });
    } else if(m.text) {
      linesHtml += `<span class="card-line no-anim">${escapeHtml(m.text)}</span>`;
    }

    let stickerHtml = '';
    if(m.stickerData) {
      const stickerAnimClass = useAnim ? '' : 'no-anim';
      const stickerDelay = useAnim ? ((m.cards ? m.cards.length : 1) * 2) : 0;
      stickerHtml = `<img class="sticker-img ${stickerAnimClass}" src="${m.stickerData}" style="animation-delay: ${stickerDelay}s">`;
    }
    
    const timeAnimClass = useAnim ? '' : 'no-anim';
    const timeDelay = useAnim ? ((m.cards ? m.cards.length : 1) * 2 + 1) : 0;
    const timeHtml = `<span class="msg-time-center ${timeAnimClass}" style="animation-delay: ${timeDelay}s">${fmtTime(m.time)}</span>`;
    
    bubble.innerHTML = linesHtml + stickerHtml + timeHtml;
    groupBox.appendChild(bubble);
    box.appendChild(groupBox);
  }
  
  if (forceScrollBottom) {
    setTimeout(() => { wrap.scrollTop = wrap.scrollHeight; }, 50);
  } else if (isNearBottom) {
    setTimeout(() => { wrap.scrollTop = wrap.scrollHeight; }, 50);
  } else {
    wrap.scrollTop = prevScrollTop;
  }
}

  const c = chats.find(x=>x.id===id);

  await reqToPromise(tx('chats','readwrite').put(c));
  await loadChats();
}

/* ============ 祂的回复 ============ */
async function replyFromThem(){
  if(!currentChatId) return;
  
  const allCards = await reqToPromise(tx('cards').getAll());
  const cards = allCards.filter(c => (c.category || 'normal') === 'normal');
  
  if(!cards.length){
    toast('郵電所中尚無常訊電文，請先新增');
    return;
  }
  
  const n = 1 + Math.floor(Math.random()*3); 
  const picked = [];
  const pool = [...cards];
  
  for(let i=0;i<n && pool.length;i++){
    const idx = Math.floor(Math.random()*pool.length);
    let cardText = pool.splice(idx,1)[0].text;
    
    if (Math.random() < 0.15) {
      const emoji = EMOJI_POOL[Math.floor(Math.random() * EMOJI_POOL.length)];
      cardText = (Math.random() < 0.5) ? (emoji + cardText) : (cardText + emoji);
    }
    picked.push(cardText);
  }

  let stickerData = null;
  const stickers = await reqToPromise(tx('stickers').getAll());
  if(stickers.length && Math.random() < 0.1){
    const s = stickers[Math.floor(Math.random()*stickers.length)];
    stickerData = s.data;
  }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'them',
    type: 'cards',
    text: '',
    cards: picked,
    stickerData: stickerData,
    time: Date.now()
  };
  
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  renderMessages(false);
  await touchChat(currentChatId);

  // 15% 概率触发独立动作卡片
  if (Math.random() < 0.15) {
    const allActions = await reqToPromise(tx('actions').getAll());
    const toMeActions = allActions.filter(a => a.category === 'to_me');
    if(toMeActions.length) {
      const a = toMeActions[Math.floor(Math.random()*toMeActions.length)];
      const actionMsg = {
        id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
        chatId: currentChatId,
        sender: 'them',
        type: 'action',
        text: '',
        cards: [a.text],
        stickerData: null,
        time: Date.now()
      };
      await reqToPromise(tx('messages','readwrite').add(actionMsg));
      currentMessages.push(actionMsg);
      renderMessages(false);
      await touchChat(currentChatId);
    }
  }
}

window.deleteSingleCard = function(id) {

    toast('已作廢');

/* ============ 郵電所：印花管理 ============ */
async function loadAndRenderStamps() {
  const stickers = await reqToPromise(tx('stickers').getAll());
  stickers.sort((a,b) => b.createdAt - a.createdAt);

  $('#stampListHeader').textContent = `印花：共 ${stickers.length} 張`;
  const grid = $('#stampGrid');
  grid.innerHTML = '';
  grid.className = 'stamp-grid' + (isStampBatchMode ? ' batch-mode' : '');

  if(!stickers.length) {
    grid.innerHTML = '<div style="grid-column: span 3; text-align:center; color:var(--text-secondary); margin-top:20px;">尚無印花</div>';
    return;
  }

  stickers.forEach(s => {
    const div = document.createElement('div');
    div.className = 'stamp-item';
    
    let checkHtml = '';
    if(isStampBatchMode) {
      checkHtml = `<input type="checkbox" class="stamp-checkbox" ${selectedStampIds.has(s.id) ? 'checked' : ''} onchange="toggleSelectStamp('${s.id}')">`;
    }

    div.innerHTML = `${checkHtml}<img src="${s.data}" alt="印花">`;
    
    if (!isStampBatchMode) {
      let pressTimer;
      div.addEventListener('touchstart', () => {
        pressTimer = setTimeout(() => {
          showCustomDialog('作廢印花', '確定要銷毀這張印花嗎？', false, '確定銷毀', async () => {
            await reqToPromise(tx('stickers', 'readwrite').delete(s.id));
            toast('印花已銷毀');
            loadAndRenderStamps();
          });
        }, 600);
      }, {passive: true});
      div.addEventListener('touchend', () => clearTimeout(pressTimer));
      div.addEventListener('touchmove', () => clearTimeout(pressTimer));
    } else {
      div.onclick = () => toggleSelectStamp(s.id);
    }

    grid.appendChild(div);
  });

  if (isStampBatchMode) {
    $('#stampNormalToolbar').style.display = 'none';
    $('#stampBatchToolbar').style.display = 'flex';
    $('#stampBatchCount').textContent = `已選 ${selectedStampIds.size} 張`;
  } else {
    $('#stampNormalToolbar').style.display = 'flex';
    $('#stampBatchToolbar').style.display = 'none';
  }
}

window.toggleSelectStamp = function(id) {
  if(selectedStampIds.has(id)) selectedStampIds.delete(id);
  else selectedStampIds.add(id);
  loadAndRenderStamps();
};

/* ============ 事件绑定 ============ */
function bindEvents(){
  // --- 邮电所标签切换 ---
  document.querySelectorAll('.tab-item').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      $('#tabContentCards').style.display = 'none';
      $('#tabContentStickers').style.display = 'none';
      $('#tabContentActions').style.display = 'none';
      $('#tabContentMusic').style.display = 'none';

      if(tab.dataset.tab === 'cards') {
        $('#tabContentCards').style.display = 'block';
        loadAndRenderCards();
      } else if(tab.dataset.tab === 'stickers') {
        $('#tabContentStickers').style.display = 'block';
        loadAndRenderStamps();
      } else if(tab.dataset.tab === 'actions') {
        $('#tabContentActions').style.display = 'block';
        loadAndRenderActions();
      } else {
        $('#tabContentMusic').style.display = 'block';
      }
    };
  });

  document.querySelectorAll('.sub-tab').forEach(tab => {
    if(tab.classList.contains('action-sub-tab')) return;
    tab.onclick = () => {
      document.querySelectorAll('.sub-tab:not(.action-sub-tab)').forEach(t => {
        t.classList.remove('active');
        t.style.color = 'var(--text-secondary)';
        t.style.borderBottom = 'none';
        t.style.fontWeight = 'normal';
      });
      tab.classList.add('active');
      tab.style.color = 'var(--primary)';
      tab.style.borderBottom = '2px solid var(--primary)';
      tab.style.fontWeight = '600';
      
      currentSubTab = tab.dataset.subtab;
      currentSearchQuery = '';
      $('#searchCardsInput').value = '';
      isBatchDeleteMode = false;
      selectedCardIds.clear();

      if(currentSubTab === 'normal') {
        $('#newCardsInput').placeholder = '起草新報文...';
      } else {
        $('#newCardsInput').placeholder = '起草私密電文...';
      }

      loadAndRenderCards();
    };
  });

  document.querySelectorAll('.action-sub-tab').forEach(tab => {
    tab.onclick = () => {
      document.querySelectorAll('.action-sub-tab').forEach(t => {
        t.classList.remove('active');
        t.style.color = 'var(--text-secondary)';
        t.style.borderBottom = 'none';
        t.style.fontWeight = 'normal';
      });
      tab.classList.add('active');
      tab.style.color = 'var(--primary)';
      tab.style.borderBottom = '2px solid var(--primary)';
      tab.style.fontWeight = '600';
      
      currentActionSubTab = tab.dataset.subtab;
      currentActionSearchQuery = '';
      $('#searchActionsInput').value = '';
      isActionBatchDeleteMode = false;
      selectedActionIds.clear();
      loadAndRenderActions();
    };
  });

  $('#backPostOfficeBtn').onclick = ()=> $('#pagePostOffice').classList.remove('show');

  // --- 電文工具栏 ---
  $('#newCardsInput').addEventListener('input', (e) => {
    const lines = e.target.value.split('\n').filter(l => l.trim() !== '');
    $('#draftCount').textContent = `待定稿：${lines.length} 份`;
  });

  $('#btnAddCards').onclick = async () => {
    const text = $('#newCardsInput').value.trim();
    if(!text) return;
    const lines = text.split('\n').filter(l => l.trim() !== '');
    if(!lines.length) return;

    const all = await reqToPromise(tx('cards').getAll());
    let added = 0; let duplicate = 0;

    for(let line of lines) {
      line = line.trim();
      if(all.find(c => c.text === line)) { duplicate++; continue; }
      const newCard = { id: 'c_'+Date.now()+Math.random(), text: line, category: currentSubTab, createdAt: Date.now() };
      await reqToPromise(tx('cards', 'readwrite').add(newCard));
      all.push(newCard);
      added++;
    }

    $('#newCardsInput').value = '';
    $('#draftCount').textContent = '待定稿：0 份';
    toast(`成功定稿 ${added} 份` + (duplicate ? `，略過 ${duplicate} 份重複` : ''));
    loadAndRenderCards();
  };

  $('#searchCardsInput').oninput = (e) => { currentSearchQuery = e.target.value.trim(); loadAndRenderCards(); };
  $('#btnBatchDelete').onclick = () => { isBatchDeleteMode = true; selectedCardIds.clear(); loadAndRenderCards(); };
  $('#btnSelectAll').onclick = () => {
    const checkboxes = document.querySelectorAll('#cardListContainer input[type="checkbox"]');
    if(selectedCardIds.size === checkboxes.length && checkboxes.length > 0) selectedCardIds.clear();
    else checkboxes.forEach(cb => selectedCardIds.add(cb.getAttribute('onchange').split("'")[1]));
    loadAndRenderCards();
  };
  $('#btnConfirmDelete').onclick = () => {
    if(selectedCardIds.size === 0) return;
    showCustomDialog('焚毀確認', `確定要焚毀這 ${selectedCardIds.size} 份電文嗎？`, false, '焚毀', async () => {
      for(const id of selectedCardIds) await reqToPromise(tx('cards', 'readwrite').delete(id));
      toast('已焚毀所選電文');
      isBatchDeleteMode = false; selectedCardIds.clear(); loadAndRenderCards();
    });
  };
  $('#btnCancelDelete').onclick = () => { isBatchDeleteMode = false; selectedCardIds.clear(); loadAndRenderCards(); };

  $('#btnDeduplicate').onclick = async () => {
    const all = await reqToPromise(tx('cards').getAll());
    const filtered = all.filter(c => (c.category || 'normal') === currentSubTab);
    const seen = new Set(); let dups = [];
    filtered.forEach(c => { if(seen.has(c.text)) dups.push(c.id); else seen.add(c.text); });
    if(!dups.length) { toast('未發現重複項'); return; }
    showCustomDialog('清冗', `發現 ${dups.length} 條重複電文，是否一併銷毀？`, false, '確認銷毀', async () => {
      for(const id of dups) await reqToPromise(tx('cards', 'readwrite').delete(id));
      toast('已清理重複項'); loadAndRenderCards();
    });
  };

  $('#btnImport').onclick = () => {
    let fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = '.json,.txt';
    fileInput.onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        let newCards = []; let added = 0, duplicate = 0;
        const all = await reqToPromise(tx('cards').getAll());
        try {
          if (file.name.endsWith('.json')) {
            const data = JSON.parse(event.target.result);
            if (Array.isArray(data)) data.forEach(item => { if (item.text) newCards.push({ text: item.text, category: item.category || currentSubTab }); });
          } else {
            const lines = event.target.result.split('\n');
            lines.forEach(line => { if(line.trim()) newCards.push({ text: line.trim(), category: currentSubTab }); });
          }
        } catch (err) { toast('收報失敗：文件格式錯誤'); return; }
        for (let card of newCards) {
          if (all.find(c => c.text === card.text)) duplicate++;
          else {
            await reqToPromise(tx('cards', 'readwrite').add({ id: 'c_'+Date.now()+Math.random(), text: card.text, category: card.category, createdAt: Date.now() }));
            added++;
          }
        }
        toast(`收報完成：導入 ${added} 份` + (duplicate ? `，略過 ${duplicate} 份重複` : ''));
        loadAndRenderCards();
      };
      reader.readAsText(file);
    };
    fileInput.click();
  };

  $('#btnExport').onclick = async () => {
    const all = await reqToPromise(tx('cards').getAll());
    const filtered = all.filter(c => (c.category || 'normal') === currentSubTab);
    if(!filtered.length) { toast('暫無電文可發報'); return; }
    $('#dialogTitle').textContent = '發報'; $('#dialogText').textContent = '請選擇發報格式：';
    $('#dialogInput').style.display = 'none';
    $('#dialogFooter').innerHTML = `
      <button class="dialog-btn" id="btnExportJson" style="color:var(--primary); border-right:1px solid var(--border-light);">JSON (完整)</button>
      <button class="dialog-btn" id="btnExportTxt" style="color:var(--primary); border-right:1px solid var(--border-light);">TXT (純文字)</button>
      <button class="dialog-btn cancel" id="btnExportCancel" style="color:var(--text-secondary); flex:0.5;">取消</button>
    `;
    $('#dialogMask').classList.add('show');
    $('#btnExportCancel').onclick = () => $('#dialogMask').classList.remove('show');
    $('#btnExportJson').onclick = () => {
      $('#dialogMask').classList.remove('show');
      const exportData = filtered.map(c => ({ text: c.text, category: c.category }));
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `電文_${currentSubTab}.json`; a.click();
      URL.revokeObjectURL(url); toast('已發報 (JSON)');
    };
    $('#btnExportTxt').onclick = () => {
      $('#dialogMask').classList.remove('show');
      const textData = filtered.map(c => c.text).join('\n');
      const blob = new Blob([textData], { type: 'text/plain' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `電文_${currentSubTab}.txt`; a.click();
      URL.revokeObjectURL(url); toast('已發報 (TXT)');
    };
  };

  // --- 印花操作 ---
  $('#stampUploadBox').onclick = () => $('#stampFileInput').click();
  $('#stampFileInput').onchange = async (e) => {
    const files = Array.from(e.target.files); if(!files.length) return;
    $('#progressDialogMask').classList.add('show');
    let progress = 0;
    const progressTimer = setInterval(() => {
      progress += Math.random() * 15; if(progress >= 100) progress = 100;
      $('#progressBarFill').style.width = progress + '%';
      $('#progressText').textContent = `正在沖印... ${Math.floor(progress)}%`;
      if(progress === 100) {
        clearInterval(progressTimer);
        setTimeout(async () => {
          for (let file of files) {
            await new Promise(resolve => {
              fileToBase64(file, async (base64) => {
                await reqToPromise(tx('stickers', 'readwrite').add({ id: 's_'+Date.now()+Math.random(), data: base64, createdAt: Date.now() }));
                resolve();
              });
            });
          }
          $('#progressDialogMask').classList.remove('show'); $('#progressBarFill').style.width = '0%';
          $('#stampFileInput').value = ''; loadAndRenderStamps(); toast('沖印完成，已添加印花');
        }, 500);
      }
    }, 100);
  };

  $('#btnStampImport').onclick = () => {
    let fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = '.json';
    fileInput.onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        try {
          const data = JSON.parse(event.target.result);
          if(Array.isArray(data)) {
            for (let item of data) {
              if(item.data) await reqToPromise(tx('stickers', 'readwrite').add({ id: 's_'+Date.now()+Math.random(), data: item.data, createdAt: Date.now() }));
            }
            toast('入畫完成'); loadAndRenderStamps();
          }
        } catch (err) { toast('入畫失敗：文件格式錯誤'); }
      };
      reader.readAsText(file);
    };
    fileInput.click();
  };

  $('#btnStampExport').onclick = async () => {
    const stickers = await reqToPromise(tx('stickers').getAll());
    if(!stickers.length) { toast('暫無印花可出畫'); return; }
    const exportData = stickers.map(s => ({ data: s.data }));
    const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `印花.json`; a.click();
    URL.revokeObjectURL(url); toast('已出畫 (JSON)');
  };

  $('#btnStampDeduplicate').onclick = async () => {
    const stickers = await reqToPromise(tx('stickers').getAll());
    const seen = new Set(); let dups = [];
    stickers.forEach(s => { if(seen.has(s.data)) dups.push(s.id); else seen.add(s.data); });
    if(!dups.length) { toast('未發現重複印花'); return; }
    showCustomDialog('清冗', `發現 ${dups.length} 張重複印花，是否一併銷毀？`, false, '確認銷毀', async () => {
      for(const id of dups) await reqToPromise(tx('stickers', 'readwrite').delete(id));
      toast('已清理重複項'); loadAndRenderStamps();
    });
  };

  $('#btnStampBatchDelete').onclick = () => { isStampBatchMode = true; selectedStampIds.clear(); loadAndRenderStamps(); };
  $('#btnStampSelectAll').onclick = () => {
    const checkboxes = document.querySelectorAll('#stampGrid input[type="checkbox"]');
    if(selectedStampIds.size === checkboxes.length && checkboxes.length > 0) selectedStampIds.clear();
    else checkboxes.forEach(cb => selectedStampIds.add(cb.getAttribute('onchange').split("'")[1]));
    loadAndRenderStamps();
  };
  $('#btnStampConfirmDelete').onclick = () => {
    if(selectedStampIds.size === 0) return;
    showCustomDialog('焚毀確認', `確定要焚毀這 ${selectedStampIds.size} 張印花嗎？`, false, '焚毀', async () => {
      for(const id of selectedStampIds) await reqToPromise(tx('stickers', 'readwrite').delete(id));
      toast('已焚毀所選印花'); isStampBatchMode = false; selectedStampIds.clear(); loadAndRenderStamps();
    });
  };
  $('#btnStampCancelDelete').onclick = () => { isStampBatchMode = false; selectedStampIds.clear(); loadAndRenderStamps(); };

  // --- 暗語操作 ---
  $('#newActionsInput').addEventListener('input', (e) => {
    const lines = e.target.value.split('\n').filter(l => l.trim() !== '');
    $('#actionDraftCount').textContent = `待定稿：${lines.length} 份`;
  });
  $('#btnAddActions').onclick = async () => {
    const text = $('#newActionsInput').value.trim(); if(!text) return;
    const lines = text.split('\n').filter(l => l.trim() !== ''); if(!lines.length) return;
    const all = await reqToPromise(tx('actions').getAll());
    let added = 0; let duplicate = 0;
    for(let line of lines) {
      line = line.trim();
      if(all.find(c => c.text === line)) { duplicate++; continue; }
      await reqToPromise(tx('actions', 'readwrite').add({ id: 'a_'+Date.now()+Math.random(), text: line, category: currentActionSubTab, createdAt: Date.now() }));
      all.push({ text: line }); added++;
    }
    $('#newActionsInput').value = ''; $('#actionDraftCount').textContent = '待定稿：0 份';
    toast(`成功留痕 ${added} 份` + (duplicate ? `，略過 ${duplicate} 份重複` : ''));
    loadAndRenderActions();
  };

  $('#searchActionsInput').oninput = (e) => { currentActionSearchQuery = e.target.value.trim(); loadAndRenderActions(); };
  $('#btnActionBatchDelete').onclick = () => { isActionBatchDeleteMode = true; selectedActionIds.clear(); loadAndRenderActions(); };

    if(selectedActionIds.size === checkboxes.length && checkboxes.length > 0) selectedActionIds.clear();
    else checkboxes.forEach(cb => selectedActionIds.add(cb.getAttribute('onchange').split("'")[1]));
    loadAndRenderActions();
  };
  $('#btnActionConfirmDelete').onclick = () => {
    if(selectedActionIds.size === 0) return;
    showCustomDialog('抹除確認', `確定要抹除這 ${selectedActionIds.size} 條暗語嗎？`, false, '抹除', async () => {
      for(const id of selectedActionIds) await reqToPromise(tx('actions', 'readwrite').delete(id));
      toast('已抹除所選暗語'); isActionBatchDeleteMode = false; selectedActionIds.clear(); loadAndRenderActions();
    });
  };
  $('#btnActionCancelDelete').onclick = () => { isActionBatchDeleteMode = false; selectedActionIds.clear(); loadAndRenderActions(); };

  $('#btnActionDeduplicate').onclick = async () => {
    const all = await reqToPromise(tx('actions').getAll());
    const filtered = all.filter(c => (c.category || 'to_them') === currentActionSubTab);
    const seen = new Set(); let dups = [];
    filtered.forEach(c => { if(seen.has(c.text)) dups.push(c.id); else seen.add(c.text); });
    if(!dups.length) { toast('未發現重複項'); return; }
    showCustomDialog('清影', `發現 ${dups.length} 條重複暗語，是否一併抹除？`, false, '確認抹除', async () => {
      for(const id of dups) await reqToPromise(tx('actions', 'readwrite').delete(id));
      toast('已清理重複項'); loadAndRenderActions();
    });
  };

  $('#btnActionImport').onclick = () => {
    let fileInput = document.createElement('input'); fileInput.type = 'file'; fileInput.accept = '.json,.txt';
    fileInput.onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = async (event) => {
        let newActions = []; let added = 0, duplicate = 0;
        const all = await reqToPromise(tx('actions').getAll());
        try {
          if (file.name.endsWith('.json')) {
            const data = JSON.parse(event.target.result);
            if (Array.isArray(data)) data.forEach(item => { if (item.text) newActions.push({ text: item.text, category: item.category || currentActionSubTab }); });
          } else {
            event.target.result.split('\n').forEach(line => { if(line.trim()) newActions.push({ text: line.trim(), category: currentActionSubTab }); });
          }
        } catch (err) { toast('納影失敗：文件格式錯誤'); return; }
        for (let act of newActions) {
          if (all.find(c => c.text === act.text)) duplicate++;
          else {
            await reqToPromise(tx('actions', 'readwrite').add({ id: 'a_'+Date.now()+Math.random(), text: act.text, category: act.category, createdAt: Date.now() }));
            added++;
          }
        }
        toast(`納影完成：導入 ${added} 份` + (duplicate ? `，略過 ${duplicate} 份重複` : ''));
        loadAndRenderActions();
      };
      reader.readAsText(file);
    };
    fileInput.click();
  };

  $('#btnActionExport').onclick = async () => {
    const all = await reqToPromise(tx('actions').getAll());
    const filtered = all.filter(c => (c.category || 'to_them') === currentActionSubTab);
    if(!filtered.length) { toast('暫無暗語可投映'); return; }
    $('#dialogTitle').textContent = '投映'; $('#dialogText').textContent = '請選擇投映格式：';
    $('#dialogInput').style.display = 'none';
    $('#dialogFooter').innerHTML = `
      <button class="dialog-btn" id="btnExportJson" style="color:var(--primary); border-right:1px solid var(--border-light);">JSON (完整)</button>
      <button class="dialog-btn" id="btnExportTxt" style="color:var(--primary); border-right:1px solid var(--border-light);">TXT (純文字)</button>
      <button class="dialog-btn cancel" id="btnExportCancel" style="color:var(--text-secondary); flex:0.5;">取消</button>
    `;
    $('#dialogMask').classList.add('show');
    $('#btnExportCancel').onclick = () => $('#dialogMask').classList.remove('show');
    $('#btnExportJson').onclick = () => {
      $('#dialogMask').classList.remove('show');
      const exportData = filtered.map(c => ({ text: c.text, category: c.category }));
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `暗語_${currentActionSubTab}.json`; a.click();
      URL.revokeObjectURL(url); toast('已投映 (JSON)');
    };
    $('#btnExportTxt').onclick = () => {
      $('#dialogMask').classList.remove('show');
      const textData = filtered.map(c => c.text).join('\n');
      const blob = new Blob([textData], { type: 'text/plain' });
      const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `暗語_${currentActionSubTab}.txt`; a.click();
      URL.revokeObjectURL(url); toast('已投映 (TXT)');
    };
  };

  // --- 聊天交互 ---
  $('#stickerBtn').onclick = async () => {
    const stickers = await reqToPromise(tx('stickers').getAll());
    const content = $('#stickerPanelContent'); if(!stickers.length) { toast('郵電所中尚無印花'); return; }
    content.innerHTML = '';
    stickers.forEach(s => {
      const img = document.createElement('img'); img.src = s.data;
      img.onclick = () => {
        pendingStickerData = s.data; $('#pendingStickerImg').src = s.data;
        $('#pendingStickerPreview').classList.add('show'); $('#stickerPanelMask').classList.remove('show');
        updateSendBtnState();
      };
      content.appendChild(img);
    });
    $('#stickerPanelMask').classList.add('show');
  };
  $('#closeStickerPanel').onclick = () => $('#stickerPanelMask').classList.remove('show');
  
  // ⚡ 闪电面板
  $('#smallFuncBtn').onclick = () => $('#flashPanelMask').classList.add('show');
  $('#flashPanelMask').onclick = (e) => { if(e.target === $('#flashPanelMask')) $('#flashPanelMask').classList.remove('show'); };
  
  // 面板选项
  $('#flashAction').onclick = async () => {
    $('#flashPanelMask').classList.remove('show');
    const allActions = await reqToPromise(tx('actions').getAll());
    const toThem = allActions.filter(a => a.category === 'to_them');
    if(!toThem.length) { toast('尚未留痕任何對祂的動作'); return; }
    
    // 用极简的弹出框让用户选
    const content = $('#stickerPanelContent');
    content.innerHTML = '';
    toThem.forEach(a => {
      const div = document.createElement('div');
      div.style.cssText = 'padding:15px; text-align:center; border-bottom:1px solid rgba(0,0,0,0.1); cursor:pointer; font-size:15px; background:var(--bg-color);';
      div.textContent = a.text;
      div.onclick = async () => {
        $('#stickerPanelMask').classList.remove('show');
        const msg = { id: 'm_'+Date.now(), chatId: currentChatId, sender: 'me', type: 'action', text: '', cards: [a.text], stickerData: null, time: Date.now() };
        await reqToPromise(tx('messages','readwrite').add(msg));
        currentMessages.push(msg);
        renderMessages(false);
        await touchChat(currentChatId);
      };
      content.appendChild(div);
    });
    $('.sticker-panel-header').innerHTML = '予祂 <span class="sticker-panel-close" id="closeStickerPanel">✕</span>';
    $('#stickerPanelMask').classList.add('show');
    $('#closeStickerPanel').onclick = () => $('#stickerPanelMask').classList.remove('show');
  };

  // 占位提示
  const soon = ['攝錄','舊簿','投問','相伴','留聲'];
  soon.forEach(t => {
    const btn = $('#flash' + (t==='攝錄'?'Photo':t==='舊簿'?'Album':t==='投問'?'Ask':t==='相伴'?'Accompany':'Music'));
    if(btn) btn.onclick = () => { $('#flashPanelMask').classList.remove('show'); toast(`${t} 功能籌備中...`); };
  });

  // --- 新建聊天室 ---
  $('#newChatBtn').onclick = ()=>{
    isEditingChatId = null; $('#createPageTitle').textContent = '建立新對話';
    $('#inputRoomName').value = ''; $('#inputTheirName').value = ''; $('#inputTheirNick').value = ''; $('#inputTheirSign').value = '';
    $('#inputMyName').value = ''; $('#inputMyNick').value = ''; $('#inputMySign').value = '';
    $('#theirAvatar').style.backgroundImage = ''; $('#theirAvatar').textContent = '祂';
    $('#myAvatar').style.backgroundImage = ''; $('#myAvatar').textContent = '我';
    tempTheirAvatar = null; tempMyAvatar = null;
    $('#pageCreate').classList.add('show');
  };
  $('#cancelCreateBtn').onclick = ()=> $('#pageCreate').classList.remove('show');
  $('#theirFile').onchange = e => { if(e.target.files[0]) fileToBase64(e.target.files[0], b => { tempTheirAvatar = b; $('#theirAvatar').style.backgroundImage = `url(${b})`; $('#theirAvatar').textContent=''; }); };
  $('#myFile').onchange = e => { if(e.target.files[0]) fileToBase64(e.target.files[0], b => { tempMyAvatar = b; $('#myAvatar').style.backgroundImage = `url(${b})`; $('#myAvatar').textContent=''; }); };

  $('#saveChatBtn').onclick = async ()=>{
    const roomName = $('#inputRoomName').value.trim(); const theirName = $('#inputTheirName').value.trim();
    const theirNick = $('#inputTheirNick').value.trim(); const theirSign = $('#inputTheirSign').value.trim();
    const myName = $('#inputMyName').value.trim(); const myNick = $('#inputMyNick').value.trim(); const mySign = $('#inputMySign').value.trim();
    if(!roomName) { toast('請輸入聊天室名稱'); return; }
    const c = { id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), roomName, theirName, theirNick, theirSign, myName, myNick, mySign, theirAvatar: tempTheirAvatar, myAvatar: tempMyAvatar, isPinned: false, createdAt: Date.now(), updatedAt: Date.now() };
    await reqToPromise(tx('chats','readwrite').add(c));
    toast('已建立新對話'); await loadChats(); renderChatList(); $('#pageCreate').classList.remove('show');
  };

  // --- 聊天页 ---
  $('#backBtn').onclick = ()=>{ $('#pageChat').classList.remove('show'); currentChatId = null; renderChatList(); };
  $('#msgInput').addEventListener('input', function() {
    this.style.height = '44px';
    this.style.height = (this.scrollHeight) + 'px';
    updateSendBtnState();
  });
  $('#sendBtn').onclick = sendMyMessage;
  
  // --- 全局菜单 ---
  const mask = $('#menuMask');
  function openMenu(){ mask.classList.add('show'); }
  function closeMenu(){ mask.classList.remove('show'); }
  $('#menuBtnList').onclick = openMenu;
  mask.onclick = e=>{ if(e.target === mask) closeMenu(); };
  $('#menuPanel').onclick = e=>{
    const act = e.target.dataset.act; if(!act) return; closeMenu();
    if(act === 'postoffice') { $('#pagePostOffice').classList.add('show'); loadAndRenderCards(); }
    else if(act === 'settings') $('#pageSettings').classList.add('show');
    else if(act === 'export') toast('存檔：匯出備份（待實作）');
    else if(act === 'clear') toast('焚稿：清空數據（待實作）');
    else if(act === 'about') toast('南洲誌：關於本網站（待實作）');
    else if(act === 'letters') toast('郵局：功能籌備中...');
    else if(act === 'messages') toast('簡訊：功能籌備中...');
  };

  // --- 佈景页面 ---
  $('#backSettingsBtn').onclick = ()=> $('#pageSettings').classList.remove('show');
  document.querySelectorAll('.theme-card').forEach(card => { card.onclick = () => setTheme(card.dataset.theme); });
  $('#mainBgFile').onchange = e => {
    if(e.target.files[0]) {
      fileToBase64(e.target.files[0], b => {
        globalBgImage = b; localStorage.setItem('nz_main_bg', b);
        applyThemeAndBg(); $('#mainBgUploadBox').style.backgroundImage = `url(${b})`; $('#mainBgText').textContent = '';
      });
    }
  };

  // 遮罩点空白取消
  const allMasks = ['#dialogMask', '#progressDialogMask', '#menuMask', '#actionSheetMask', '#stickerPanelMask', '#flashPanelMask'];
  allMasks.forEach(id => {
    const el = document.querySelector(id);
    if(el) {
      el.addEventListener('click', (e) => {
        if(e.target === el && id !== '#progressDialogMask') {
          el.classList.remove('show');
          if(id === '#dialogMask') {
            setTimeout(() => {
              $('#dialogFooter').innerHTML = `
                <button class="dialog-btn cancel" id="dialogCancelBtn">取消</button>
                <button class="dialog-btn danger" id="dialogOkBtn" style="color:var(--primary);">確定</button>
              `;
              $('#dialogCancelBtn').onclick = () => $('#dialogMask').classList.remove('show');
            }, 100);
          }
        }
      });
    }
  });
}

/* ============ 启动 ============ */
init().catch(err=>{
  console.error(err);
  toast('資料庫初始化失敗，請重新整理');
});
</script>
</body>
</html>

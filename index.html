<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>南洲舊夢</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Courier New", "Noto Serif TC", monospace;
  background: #1a120b;
  color: #ede8d5;
  overflow: hidden;
  height: 100vh;
  height: 100dvh;
}

/* ===== 頂部 ===== */
.top-bar {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  background: #1a120b;
  border-bottom: 1px solid #c9a84c;
}

.top-title {
  text-align: center;
  padding: 12px 0 8px;
  font-size: 18px;
  letter-spacing: 8px;
  color: #c9a84c;
}

.top-info {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 16px 8px;
  font-size: 11px;
  color: #6b6258;
}

.top-info .center-line {
  flex: 1;
  text-align: center;
  color: #c9a84c;
  opacity: 0.5;
}

.top-links {
  display: flex;
  gap: 12px;
}

.top-links span {
  color: #c9a84c;
  cursor: pointer;
  font-size: 11px;
}

.top-links span:active { opacity: 0.6; }

/* ===== 滾動區域 ===== */
.scroll-area {
  position: fixed;
  top: 78px;
  bottom: 56px;
  left: 0; right: 0;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 12px 4%;
}

/* ===== 底部輸入區 ===== */
.input-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: #1a120b;
  border-top: 1px solid #c9a84c;
  padding: 10px 4%;
  display: flex;
  align-items: center;
  gap: 8px;
}

.input-bar input {
  flex: 1;
  background: transparent;
  border: none;
  border-bottom: 1px solid #c9a84c;
  color: #ede8d5;
  font-family: inherit;
  font-size: 14px;
  padding: 6px 0;
  outline: none;
}

.input-bar input::placeholder { color: #6b6258; }

.input-bar .send-btn {
  color: #c9a84c;
  font-size: 14px;
  cursor: pointer;
  white-space: nowrap;
  background: none;
  border: none;
  font-family: inherit;
}

.input-bar .send-btn:active { opacity: 0.6; }

/* ===== 電報單 ===== */
.telegram {
  background: #ede8d5;
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  margin-bottom: 16px;
  width: 100%;
}

.telegram-header {
  border-bottom: 1px solid #1a1a1a;
  padding: 6px 10px;
  font-size: 12px;
  font-weight: bold;
  display: flex;
  justify-content: space-between;
}

.telegram-body {
  padding: 10px;
  font-size: 14px;
  line-height: 1.8;
  white-space: pre-wrap;
  word-break: break-all;
}

.telegram-sep {
  border: none;
  border-top: 1px solid #1a1a1a;
  margin: 6px 0;
}

.telegram-stamp {
  margin: 8px 0 4px;
  text-align: center;
}

.telegram-stamp img {
  max-width: 100%;
  max-height: 200px;
  border: 1px solid #1a1a1a;
  display: block;
  margin: 0 auto;
}

.telegram-footer {
  border-top: 1px solid #1a1a1a;
  padding: 4px 10px;
  text-align: right;
  font-size: 11px;
  color: #6b6258;
}

/* ===== 頁面切換 ===== */
.page { display: none; }
.page.active { display: block; }

/* ===== 電碼本 / 郵戳冊 列表 ===== */
.list-item {
  background: #ede8d5;
  color: #1a1a1a;
  border: 1px solid #1a1a1a;
  margin-bottom: 8px;
  padding: 10px;
  cursor: pointer;
}

.list-item:active { opacity: 0.7; }

.list-item .item-no {
  font-size: 11px;
  color: #6b6258;
  margin-bottom: 4px;
}

.list-item .item-preview {
  font-size: 14px;
  line-height: 1.6;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

/* 郵戳項 */
.stamp-item {
  display: inline-block;
  width: calc(33.33% - 6px);
  margin: 3px;
  text-align: center;
}

.stamp-item img {
  width: 100%;
  aspect-ratio: 1;
  object-fit: cover;
  border: 1px solid #1a1a1a;
}

.stamp-item .stamp-no {
  font-size: 10px;
  color: #6b6258;
  margin-top: 2px;
}

/* ===== 底部按鈕區 ===== */
.btn-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  z-index: 100;
  background: #1a120b;
  border-top: 1px solid #c9a84c;
  display: flex;
  flex-wrap: wrap;
}

.btn-bar button {
  flex: 1;
  background: none;
  border: none;
  border-right: 1px solid rgba(201,168,76,0.3);
  border-bottom: 1px solid rgba(201,168,76,0.3);
  color: #c9a84c;
  font-family: inherit;
  font-size: 12px;
  padding: 10px 4px;
  cursor: pointer;
}

.btn-bar button:nth-child(3n) { border-right: none; }
.btn-bar button:active { background: rgba(201,168,76,0.15); }

/* ===== 彈窗 ===== */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 200;
  display: none;
  justify-content: center;
  align-items: center;
}

.modal-overlay.active { display: flex; }

.modal {
  background: #ede8d5;
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  width: 92%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 16px;
}

.modal h3 {
  text-align: center;
  margin-bottom: 12px;
  font-size: 16px;
  border-bottom: 1px solid #1a1a1a;
  padding-bottom: 8px;
}

.modal textarea {
  width: 100%;
  min-height: 200px;
  background: transparent;
  border: 1px solid #1a1a1a;
  color: #1a1a1a;
  font-family: inherit;
  font-size: 14px;
  line-height: 1.8;
  padding: 8px;
  outline: none;
  resize: vertical;
}

.modal .modal-stats {
  text-align: center;
  font-size: 12px;
  color: #6b6258;
  margin: 8px 0;
}

.modal .modal-btns {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.modal .modal-btns button {
  flex: 1;
  padding: 10px;
  border: 1px solid #1a1a1a;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.modal .modal-btns .confirm-btn {
  background: #1a1a1a;
  color: #ede8d5;
}

/* 確認彈窗 */
.confirm-modal {
  background: #ede8d5;
  color: #1a1a1a;
  border: 2px solid #1a1a1a;
  width: 80%;
  padding: 20px;
  text-align: center;
}

.confirm-modal p { margin-bottom: 16px; font-size: 14px; }

.confirm-modal .confirm-btns {
  display: flex;
  gap: 12px;
}

.confirm-modal .confirm-btns button {
  flex: 1;
  padding: 8px;
  border: 1px solid #1a1a1a;
  background: transparent;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.confirm-modal .confirm-btns .danger { background: #1a1a1a; color: #ede8d5; }

/* 空狀態 */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: #6b6258;
  font-size: 14px;
  line-height: 2;
}

/* 選擇模式 */
.select-checkbox {
  display: inline-block;
  width: 18px; height: 18px;
  border: 1px solid #1a1a1a;
  margin-right: 8px;
  vertical-align: middle;
  text-align: center;
  line-height: 16px;
  font-size: 12px;
}

.select-checkbox.checked::after { content: "✓"; }

/* 隱藏 */
.hidden { display: none !important; }

/* 附郵戳預覽 */
.attach-preview {
  margin-top: 6px;
  text-align: right;
}

.attach-preview img {
  max-width: 60px;
  max-height: 60px;
  border: 1px solid #c9a84c;
}

.attach-preview .remove-attach {
  color: #c9a84c;
  font-size: 12px;
  cursor: pointer;
  margin-left: 6px;
}
</style>
</head>
<body>

<!-- ===== 頂部 ===== -->
<div class="top-bar">
  <div class="top-title" id="topTitle">南 洲 舊 夢</div>
  <div class="top-info">
    <span>發 · 此端</span>
    <span class="center-line">───────</span>
    <span>收 · 舊夢</span>
  </div>
  <div class="top-links" id="topLinks">
    <span onclick="switchPage('codebook')">電碼本</span>
    <span onclick="switchPage('stampbook')">郵戳冊</span>
  </div>
</div>

<!-- ===== 消息流頁面 ===== -->
<div class="page active" id="pageChat">
  <div class="scroll-area" id="chatArea">
    <div class="empty-state" id="chatEmpty">
      ∅ 尚無消息<br>落筆發出第一封電報
    </div>
  </div>
</div>

<!-- ===== 電碼本頁面 ===== -->
<div class="page" id="pageCodebook">
  <div class="scroll-area" id="codebookArea">
    <div class="empty-state" id="codebookEmpty" style="display:none;">
      ∅ 電碼本尚無一字<br>落筆寫下第一封電文吧
    </div>
    <div id="codebookList"></div>
  </div>
  <div class="btn-bar" id="codebookBtns">
    <button onclick="showSearch()">翻查</button>
    <button onclick="showWrite()">落筆</button>
    <button onclick="dedup('codebook')">剔重</button>
    <button onclick="importFile('codebook')">謄入</button>
    <button onclick="exportFile('codebook')">抄出</button>
    <button onclick="toggleSelect('codebook')">焚毀</button>
  </div>
</div>

<!-- ===== 郵戳冊頁面 ===== -->
<div class="page" id="pageStampbook">
  <div class="scroll-area" id="stampbookArea">
    <div class="empty-state" id="stampbookEmpty" style="display:none;">
      ∅ 郵戳冊尚無印記<br>去附上第一枚郵戳吧
    </div>
    <div id="stampbookList" style="display:flex;flex-wrap:wrap;"></div>
  </div>
  <div class="btn-bar" id="stampbookBtns">
    <button onclick="attachStamp()">附郵戳</button>
    <button onclick="dedup('stamp')">剔重</button>
    <button onclick="importFile('stamp')">謄入</button>
    <button onclick="exportFile('stamp')">抄出</button>
    <button onclick="toggleSelect('stamp')">焚毀</button>
    <button disabled style="opacity:0.3">────</button>
  </div>
</div>

<!-- ===== 底部輸入區（消息頁用） ===== -->
<div class="input-bar" id="inputBar">
  <input type="text" id="msgInput" placeholder="落筆..." onkeydown="if(event.key==='Enter')sendMsg()">
  <button class="send-btn" onclick="attachMyStamp()">附郵戳 ▸</button>
  <button class="send-btn" onclick="sendMsg()">發報 ▸</button>
  <div id="myAttachPreview" class="attach-preview hidden"></div>
</div>

<!-- ===== 落筆彈窗 ===== -->
<div class="modal-overlay" id="writeModal">
  <div class="modal">
    <h3>落 筆</h3>
    <div style="font-size:11px;color:#6b6258;text-align:center;margin-bottom:8px;">一句一行，換行即分隔</div>
    <textarea id="writeInput" placeholder="星星很多的時候我總想起你
記得去年也是這樣的夜
別貪涼"></textarea>
    <div class="modal-stats" id="writeStats">共 0 句</div>
    <div class="modal-btns">
      <button onclick="closeWrite()">取消</button>
      <button class="confirm-btn" onclick="saveWrite()">封存</button>
    </div>
  </div>
</div>

<!-- ===== 翻查彈窗 ===== -->
<div class="modal-overlay" id="searchModal">
  <div class="modal">
    <h3>翻 查</h3>
    <input type="text" id="searchInput" placeholder="輸入關鍵詞..." style="width:100%;padding:8px;border:1px solid #1a1a1a;background:transparent;font-family:inherit;font-size:14px;color:#1a1a1a;outline:none;" oninput="doSearch()">
    <div id="searchResults" style="margin-top:12px;"></div>
    <div class="modal-btns">
      <button onclick="closeSearch()">返回</button>
    </div>
  </div>
</div>

<!-- ===== 確認彈窗 ===== -->
<div class="modal-overlay" id="confirmModal">
  <div class="confirm-modal">
    <p id="confirmText">確認？</p>
    <div class="confirm-btns">
      <button onclick="closeConfirm()">取消</button>
      <button class="danger" id="confirmBtn">確認</button>
    </div>
  </div>
</div>

<!-- ===== 文件輸入（隱藏） ===== -->
<input type="file" id="fileInput" class="hidden" onchange="handleFile(event)">
<input type="file" id="stampInput" class="hidden" accept="image/*" multiple onchange="handleStamps(event)">
<input type="file" id="singleStampInput" class="hidden" accept="image/*" onchange="handleSingleStamp(event)">

<script>
// ===== IndexedDB =====
const DB_NAME = '南洲舊夢';
const DB_VERSION = 1;
let db;

const request = indexedDB.open(DB_NAME, DB_VERSION);
request.onerror = () => alert('數據庫打開失敗');
request.onsuccess = (e) => { db = e.target.result; initLoad(); };
request.onupgradeneeded = (e) => {
  db = e.target.result;
  if (!db.objectStoreNames.contains('messages')) {
    db.createObjectStore('messages', { keyPath 'id', autoIncrement: true });
  }
  if (!db.objectStoreNames.contains('codebook')) {
    db.createObjectStore('codebook', { keyPath: 'id', autoIncrement: true });
  }
  if (!db.objectStoreNames.contains('stampbook')) {
    db.createObjectStore('stampbook', { keyPath: 'id', autoIncrement: true });
  }
};

// ===== 全局狀態 =====
let currentPage = 'chat';
let codebookData = [];
let stampbookData = [];
let messages = [];
let myAttachedStamp = null; // 本次發報附的郵戳
let selectMode = false;
let selectedItems = new Set();
let searchMode = false;
let editingId = null; // 修訂中的電文id

// ===== 頁面切換 =====
function switchPage(page) {
  currentPage = page;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('inputBar').style.display = page === 'chat' ? 'flex' : 'none';
  
  if (page === 'chat') {
    document.getElementById('pageChat').classList.add('active');
    document.getElementById('topTitle').textContent = '南 洲 舊 夢';
  } else if (page === 'codebook') {
    document.getElementById('pageCodebook').classList.add('active');
    document.getElementById('topTitle').textContent = '電 碼 本';
    loadCodebook();
  } else if (page === 'stampbook') {
    document.getElementById('pageStampbook').classList.add('active');
    document.getElementById('topTitle').textContent = '郵 戳 冊';
    loadStampbook();
  }
}

// ===== 初始化載入 =====
function initLoad() {
  loadMessages();
  loadCodebook();
  loadStampbook();
}

// ===== 消息 =====
function loadMessages() {
  const tx = db.transaction('messages', 'readonly');
  const store = tx.objectStore('messages');
  const req = store.getAll();
  req.onsuccess = () => {
    messages = req.result.sort((a,b) => a.id - b.id);
    renderMessages();
  };
}

function renderMessages() {
  const area = document.getElementById('chatArea');
  const empty = document.getElementById('chatEmpty');
  area.innerHTML = '';
  if (messages.length === 0) { area.appendChild(empty); empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  messages.forEach(m => {
    const div = document.createElement('div');
    div.className = 'telegram';
    if (m.type === 'sent') {
      div.innerHTML = `
        <div class="telegram-header"><span>† 發報 · № ${String(m.id).padStart(4,'0')}</span></div>
        <div class="telegram-body">${escapeHtml(m.text)}</div>
        ${m.stamp ? `<div class="telegram-stamp"><img src="${m.stamp}"></div>` : ''}
        <div class="telegram-footer">${m.time}</div>
      `;
    } else {
      div.innerHTML = `
        <div class="telegram-header"><span>‡ 來電 · № ${String(m.id).padStart(4,'0')}</span></div>
        <div class="telegram-body">${m.texts.map((t,i) => `${i>0?'<hr class="telegram-sep">':''}${escapeHtml(t)}`).join('')}</div>
        ${m.stamp ? `<div class="telegram-stamp"><img src="${m.stamp}"></div>` : ''}
        <div class="telegram-footer">${m.time}</div>
      `;
    }
    area.appendChild(div);
  });
  area.scrollTop = area.scrollHeight;
}

function sendMsg() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} · ${now.getMonth()+1}.${now.getDate()}`;
  
  // 存發報
  const sent = { type: 'sent', text, stamp: myAttachedStamp, time, date: now.toISOString() };
  addToStore('messages', sent);
  
  // 清空附郵戳
  myAttachedStamp = null;
  document.getElementById('myAttachPreview').classList.add('hidden');
  document.getElementById('myAttachPreview').innerHTML = '';
  
  // 重新載入
  loadMessages();
  
  // 延遲回覆
  const delay = 1500 + Math.random() * 1000;
  setTimeout(() => generateReply(), delay);
}

function attachMyStamp() {
  document.getElementById('singleStampInput').click();
}

function handleSingleStamp(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    myAttachedStamp = ev.target.result;
    const preview = document.getElementById('myAttachPreview');
    preview.innerHTML = `<img src="${myAttachedStamp}"><span class="remove-attach" onclick="removeMyStamp()">×</span>`;
    preview.classList.remove('hidden');
  };
  reader.readAsDataURL(file);
}

function removeMyStamp() {
  myAttachedStamp = null;
  document.getElementById('myAttachPreview').classList.add('hidden');
  document.getElementById('myAttachPreview').innerHTML = '';
}

function generateReply() {
  // 抽電文
  if (codebookData.length === 0) {
    showEmptyReply();
    return;
  }
  
  const count = Math.min(Math.floor(Math.random() * 3) + 1, codebookData.length);
  const shuffled = [...codebookData].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, count).map(c => c.text);
  
  // 抽郵戳
  let stamp = null;
  if (stampbookData.length > 0) {
    const rnd = Math.floor(Math.random() * stampbookData.length);
    stamp = stampbookData[rnd].data;
  }
  
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} · ${now.getMonth()+1}.${now.getDate()}`;
  
  const reply = { type: 'received', texts: selected, stamp, time, date: now.toISOString() };
  addToStore('messages', reply);
  loadMessages();
}

function showEmptyReply() {
  const now = new Date();
  const time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} · ${now.getMonth()+1}.${now.getDate()}`;
  const reply = { type: 'received', texts: ['∅ 電碼本尚無一字', '∅ 郵戳冊尚無印記', '去寫下第一封電文吧'], stamp: null, time, date: now.toISOString() };
  addToStore('messages', reply);
  loadMessages();
}

// ===== 電碼本 =====
function loadCodebook() {
  const tx = db.transaction('codebook', 'readonly');
  const store = tx.objectStore('codebook');
  const req = store.getAll();
  req.onsuccess = () => {
    codebookData = req.result.sort((a,b) => a.id - b.id);
    renderCodebook();
  };
}

function renderCodebook() {
  const list = document.getElementById('codebookList');
  const empty = document.getElementById('codebookEmpty');
  list.innerHTML = '';
  
  if (codebookData.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  
  codebookData.forEach(item => {
    const div = document.createElement('div');
    div.className = 'list-item';
    div.innerHTML = `
      ${selectMode ? `<span class="select-checkbox ${selectedItems.has(item.id)?'checked':''}" onclick="toggleItem(${item.id})"></span>` : ''}
      <div class="item-no">№ ${String(item.id).padStart(4,'0')}</div>
      <div class="item-preview">${escapeHtml(item.text)}</div>
    `;
    if (!selectMode) {
      div.onclick = () => editItem(item);
      div.ontouchstart = () => longPressTimer = setTimeout(() => confirmDelete('codebook', item.id), 600);
      div.ontouchend = () => clearTimeout(longPressTimer);
    } else {
      div.onclick = () => toggleItem(item.id);
    }
    list.appendChild(div);
  });
}

function showWrite(id) {
  editingId = id || null;
  document.getElementById('writeInput').value = id ? codebookData.find(c=>c.id===id).text : '';
  updateWriteStats();
  document.getElementById('writeModal').classList.add('active');
}

function closeWrite() { document.getElementById('writeModal').classList.remove('active'); editingId = null; }

function updateWriteStats() {
  const text = document.getElementById('writeInput').value;
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l);
  document.getElementById('writeStats').textContent = `共 ${lines.length} 句`;
}

document.getElementById('writeInput').addEventListener('input', updateWriteStats);

function saveWrite() {
  const text = document.getElementById('writeInput').value;
  const lines = text.split('\n').map(l=>l.trim()).filter(l=>l);
  if (lines.length === 0) { closeWrite(); return; }
  
  if (editingId) {
    // 修訂：替換為新內容（一行或多行）
    const tx = db.transaction('codebook', 'readwrite');
    const store = tx.objectStore('codebook');
    const getReq = store.get(editingId);
    getReq.onsuccess = () => {
      const old = getReq.result;
      // 刪除舊的
      store.delete(editingId);
      // 寫入新的（每行一條）
      lines.forEach(line => store.add({ text: line, date: new Date().toISOString() }));
      tx.oncomplete = () => { closeWrite(); loadCodebook(); };
    };
  } else {
    // 封存：每行一條
    const tx = db.transaction('codebook', 'readwrite');
    const store = tx.objectStore('codebook');
    lines.forEach(line => store.add({ text: line, date: new Date().toISOString() }));
    tx.oncomplete = () => { closeWrite(); loadCodebook(); };
  }
}

function editItem(item) { showWrite(item.id); }

let longPressTimer;
function confirmDelete(type, id) {
  showConfirm('確認焚毀此電文？', () => {
    deleteFromStore(type === 'codebook' ? 'codebook' : 'stampbook', id);
    if (type === 'codebook') loadCodebook();
    else loadStampbook();
  });
}

// ===== 郵戳冊 =====
function loadStampbook() {
  const tx = db.transaction('stampbook', 'readonly');
  const store = tx.objectStore('stampbook');
  const req = store.getAll();
  req.onsuccess = () => {
    stampbookData = req.result.sort((a,b) => a.id - b.id);
    renderStampbook();
  };
}

function renderStampbook() {
  const list = document.getElementById('stampbookList');
  const empty = document.getElementById('stampbookEmpty');
  list.innerHTML = '';
  
  if (stampbookData.length === 0) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';
  
  stampbookData.forEach(item => {
    const div = document.createElement('div');
    div.className = 'stamp-item';
    div.innerHTML = `
      ${selectMode ? `<span class="select-checkbox ${selectedItems.has(item.id)?'checked':''}" style="position:absolute;"></span>` : ''}
      <img src="${item.data}" onclick="${selectMode ? `toggleItem(${item.id})` : `viewStamp(${item.id})`}">
      <div class="stamp-no">№ ${String(item.id).padStart(4,'0')}</div>
    `;
    if (!selectMode) {
      div.ontouchstart = () => longPressTimer = setTimeout(() => confirmDelete('stamp', item.id), 600);
      div.ontouchend = () => clearTimeout(longPressTimer);
    }
    list.appendChild(div);
  });
}

function attachStamp() { document.getElementById('stampInput').click(); }

function handleStamps(e) {
  const files = Array.from(e.target.files);
  if (files.length === 0) return;
  let loaded = 0;
  files.forEach(file => {
    const reader = new FileReader();
    reader.onload = (ev) => {
      addToStore('stampbook', { data: ev.target.result, date: new Date().toISOString() });
      loaded++;
      if (loaded === files.length) { loadStampbook(); }
    };
    reader.readAsDataURL(file);
  });
}

function viewStamp(id) {
  const item = stampbookData.find(s=>s.id===id);
  if (!item) return;
  showConfirm('替換郵戳？', () => { document.getElementById('singleStampInput').click(); });
}

// ===== 翻查 =====
function showSearch() {
  document.getElementById('searchModal').classList.add('active');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchResults').innerHTML = '';
}

function closeSearch() { document.getElementById('searchModal').classList.remove('active'); }

function doSearch() {
  const keyword = document.getElementById('searchInput').value.trim();
  const results = document.getElementById('searchResults');
  if (!keyword) { results.innerHTML = ''; return; }
  
  const matched = codebookData.filter(c => c.text.includes(keyword));
  results.innerHTML = matched.map(m => `
    <div class="list-item" onclick="editItem(${JSON.stringify(m).replace(/"/g,'&quot;')})">
      <div class="item-no">№ ${String(m.id).padStart(4,'0')}</div>
      <div class="item-preview">${escapeHtml(m.text)}</div>
    </div>
  `).join('') || '<div style="text-align:center;color:#6b6258;padding:20px;">∅ 無匹配</div>';
}

// ===== 剔重 =====
function dedup(type) {
  const storeName = type === 'codebook' ? 'codebook' : 'stampbook';
  const data = type === 'codebook' ? codebookData : stampbookData;
  
  // 找重複
  const seen = new Map();
  const duplicates = [];
  data.forEach(item => {
    const key = type === 'codebook' ? item.text : item.data;
    if (seen.has(key)) {
      duplicates.push(item.id);
    } else {
      seen.set(key, item.id);
    }
  });
  
  if (duplicates.length === 0) { showConfirm('∅ 無重複項', () => {}); return; }
  
  showConfirm(`發現 ${duplicates.length} 項重複，確認焚毀？`, () => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    duplicates.forEach(id => store.delete(id));
    tx.oncomplete = () => {
      if (type === 'codebook') loadCodebook();
      else loadStampbook();
    };
  });
}

// ===== 謄入/抄出 =====
function importFile(type) {
  if (type === 'codebook') {
    document.getElementById('fileInput').accept = '.txt,.json';
    document.getElementById('fileInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        let texts = [];
        if (file.name.endsWith('.json')) {
          try { texts = JSON.parse(ev.target.result).map(t => typeof t === 'string' ? t : t.text); }
          catch { alert('JSON格式錯誤'); return; }
        } else {
          texts = ev.target.result.split('\n').map(l=>l.trim()).filter(l=>l);
        }
        const tx = db.transaction('codebook', 'readwrite');
        const store = tx.objectStore('codebook');
        texts.forEach(t => store.add({ text: t, date: new Date().toISOString() }));
        tx.oncomplete = () => { loadCodebook(); alert(`謄入成功，共 ${texts.length} 條`); };
      };
      reader.readAsText(file);
    };
    document.getElementById('fileInput').click();
  } else {
    // 郵戳冊批量選圖
    document.getElementById('stampInput').click();
  }
}

function exportFile(type) {
  if (type === 'codebook') {
    const data = codebookData.map(c => c.text);
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    downloadFile(blob, `電碼本_${dateStr()}.json`);
    alert('抄出成功');
  } else {
    // 郵戳冊逐張下載（瀏覽器限制只能逐個或打包）
    stampbookData.forEach((s, i) => {
      const blob = dataURItoBlob(s.data);
      downloadFile(blob, `郵戳_${String(i+1).padStart(3,'0')}.jpg`);
    });
    alert(`抄出成功，共 ${stampbookData.length} 枚`);
  }
}

function downloadFile(blob, filename) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}

function dataURItoBlob(dataURI) {
  const byteString = atob(dataURI.split(',')[1]);
  const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
  const ab = new ArrayBuffer(byteString.length);
  const ia = new Uint8Array(ab);
  for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
  return new Blob([ab], { type: mimeString });
}

function dateStr() { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; }

// ===== 焚毀（批量選擇） =====
function toggleSelect(type) {
  selectMode = !selectMode;
  selectedItems.clear();
  if (type === 'codebook') renderCodebook();
  else renderStampbook();
}

function toggleItem(id) {
  if (selectedItems.has(id)) selectedItems.delete(id);
  else selectedItems.add(id);
  if (currentPage === 'codebook') renderCodebook();
  else renderStampbook();
}

// ===== 確認彈窗 =====
function showConfirm(text, onConfirm) {
  document.getElementById('confirmText').textContent = text;
  document.getElementById('confirmBtn').onclick = () => { closeConfirm(); onConfirm(); };
  document.getElementById('confirmModal').classList.add('active');
}

function closeConfirm() { document.getElementById('confirmModal').classList.remove('active'); }

// ===== 工具 =====
function addToStore(storeName, data) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.add(data);
    tx.oncomplete = resolve;
  });
}

function deleteFromStore(storeName, id) {
  return new Promise((resolve) => {
    const tx = db.transaction(storeName, 'readwrite');
    const store = tx.objectStore(storeName);
    store.delete(id);
    tx.oncomplete = resolve;
  });
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// 初始化
switchPage('chat');
</script>

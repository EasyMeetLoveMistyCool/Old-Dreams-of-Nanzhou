<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>南洲舊夢</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f0e8;color:#1a1a1a;font-family:"Courier New","Noto Serif TC",monospace;height:100vh;overflow:hidden}

.top{position:fixed;top:0;left:0;right:0;z-index:100;background:#f5f0e8;border-bottom:1px solid #c9a84c;padding-top:12px}
.top h1{text-align:center;font-size:15px;letter-spacing:10px;color:#c9a84c;font-weight:normal;padding-bottom:6px}
.top .info{display:flex;justify-content:space-between;padding:0 20px 4px;font-size:9px;color:#8b7d6b}
.top .line{flex:1;text-align:center;color:#c9a84c;opacity:.3}
.top .tabs{display:flex;justify-content:center;gap:24px;padding-bottom:8px}
.top .tabs span{color:#8b7d6b;font-size:12px;letter-spacing:2px;cursor:pointer;padding:2px 0}
.top .tabs span.active{color:#c9a84c;border-bottom:1px solid #c9a84c}

.list{position:fixed;top:88px;bottom:56px;left:0;right:0;overflow-y:auto;padding:14px 5%;-webkit-overflow-scrolling:touch}

.msg{background:#ede8d5;color:#1a1a1a;border:1px solid #1a1a1a;margin-bottom:14px;padding:12px;font-size:13px;line-height:1.9}
.msg .label{font-size:10px;font-weight:bold;border-bottom:1px solid #1a1a1a;padding-bottom:4px;margin-bottom:8px;display:flex;justify-content:space-between}
.msg .stamp{text-align:right;margin-top:8px;border-top:1px solid #1a1a1a;padding-top:6px}
.msg .stamp img{max-width:60px;max-height:60px;display:block;margin-left:auto;border:1px solid #1a1a1a}
.msg .time{text-align:right;font-size:9px;color:#6b6258;margin-top:6px}

.item{background:#ede8d5;color:#1a1a1a;border:1px solid #1a1a1a;margin-bottom:10px;padding:10px;font-size:13px;line-height:1.7}
.item .item-head{display:flex;justify-content:space-between;font-size:10px;color:#6b6258;border-bottom:1px solid #1a1a1a;padding-bottom:3px;margin-bottom:6px}
.item .item-actions{display:flex;gap:12px;margin-top:6px;border-top:1px solid #1a1a1a;padding-top:4px}
.item .item-actions span{font-size:10px;color:#c9a84c;cursor:pointer}

.btn-row{position:fixed;bottom:0;left:0;right:0;display:flex;flex-wrap:wrap;border-top:1px solid #c9a84c;background:#f5f0e8}
.btn-row button{flex:1 0 33.33%;max-width:33.33%;border:none;border-right:1px solid rgba(201,168,76,.3);border-bottom:1px solid rgba(201,168,76,.3);background:none;color:#1a1a1a;font-family:inherit;font-size:11px;padding:12px 2px;cursor:pointer;letter-spacing:1px}
.btn-row button:active{background:rgba(201,168,76,.15)}

.input-row{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px 5%;border-top:1px solid #c9a84c;background:#f5f0e8}
.input-row input{flex:1;background:transparent;border:none;border-bottom:1px solid #c9a84c;color:#1a1a1a;font-family:inherit;font-size:14px;padding:4px 0;outline:none}
.input-row button{background:none;border:none;color:#c9a84c;font-family:inherit;font-size:13px;padding:4px 10px;cursor:pointer;letter-spacing:1px}

.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(26,18,11,.5);z-index:200;justify-content:center;align-items:center}
.modal.show{display:flex}
.modal-box{background:#ede8d5;color:#1a1a1a;border:1px solid #1a1a1a;width:92%;max-height:85vh;overflow-y:auto;padding:16px}
.modal-box h3{text-align:center;margin:0 0 12px;font-size:14px;border-bottom:1px solid #1a1a1a;padding-bottom:8px;letter-spacing:4px}
.modal-box textarea{width:100%;min-height:200px;background:transparent;border:1px solid #1a1a1a;color:#1a1a1a;font-family:inherit;font-size:14px;line-height:1.8;padding:8px;outline:none;resize:vertical}
.modal-box input[type=text]{width:100%;padding:8px;border:1px solid #1a1a1a;background:transparent;color:#1a1a1a;font-family:inherit;font-size:14px;outline:none;margin-bottom:8px}
.modal-box input[type=file]{width:100%;font-size:11px;margin-bottom:8px}
.modal-btns{display:flex;gap:8px;margin-top:12px}
.modal-btns button{flex:1;padding:10px;border:1px solid #1a1a1a;background:transparent;color:#1a1a1a;font-family:inherit;font-size:12px;cursor:pointer;letter-spacing:2px}
.modal-btns button.primary{background:#1a1a1a;color:#c9a84c;border-color:#1a1a1a}

.empty{text-align:center;color:#8b7d6b;padding:40px 0;font-size:12px;line-height:2}
#status{position:fixed;top:92px;left:50%;transform:translateX(-50%);font-size:10px;padding:4px 12px;background:#c9a84c;color:#1a1a1a;display:none;z-index:999;letter-spacing:1px}
</style>
</head>
<body>

<div class="top">
  <h1>南 洲 舊 夢</h1>
  <div class="info"><span>發 · 此端</span><span class="line">─────</span><span>收 · 舊夢</span></div>
  <div class="tabs">
    <span class="active" onclick="switchTab('chat')">來電</span>
    <span onclick="switchTab('code')">電碼本</span>
    <span onclick="switchTab('stamp')">郵戳冊</span>
  </div>
</div>

<div id="status"></div>
<div class="list" id="list"></div>

<!-- 聊天页输入区 -->
<div class="input-row" id="inputRow">
  <input id="inputRowInput" placeholder="落筆...">
  <button onclick="sendMsg()">發報 ▸</button>
</div>

<!-- 底部按钮区（仅电码本/邮戳册使用） -->
<div class="btn-row" id="btnRow"></div>

<!-- 落筆彈窗 -->
<div class="modal" id="writeModal">
  <div class="modal-box">
    <h3>† 落筆</h3>
    <textarea id="writeInput" placeholder="每行一句，換行即分隔&#10;封存後自動拆為多條電文"></textarea>
    <div class="modal-btns">
      <button onclick="closeModal('writeModal')">取消</button>
      <button class="primary" onclick="sealText()">封存</button>
    </div>
  </div>
</div>

<!-- 修訂彈窗 -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>† 修訂</h3>
    <input type="text" id="editInput">
    <div class="modal-btns">
      <button onclick="closeModal('editModal')">取消</button>
      <button class="primary" onclick="saveEdit()">存檔</button>
    </div>
  </div>
</div>

<!-- 謄入彈窗 -->
<div class="modal" id="importModal">
  <div class="modal-box">
    <h3>† 謄入</h3>
    <input type="file" id="importFile" accept=".txt,.json">
    <div class="modal-btns">
      <button onclick="closeModal('importModal')">取消</button>
      <button class="primary" onclick="doImport()">確認</button>
    </div>
  </div>
</div>

<!-- 附郵戳彈窗 -->
<div class="modal" id="stampModal">
  <div class="modal-box">
    <h3>† 附郵戳</h3>
    <input type="file" id="stampFile" accept="image/jpeg,image/png" multiple>
    <div class="modal-btns">
      <button onclick="closeModal('stampModal')">取消</button>
      <button class="primary" onclick="doStampAdd()">封存</button>
    </div>
  </div>
</div>

<script>
var db=null,currentTab='chat',editId=null,editType='';
var chatMsgs=[],codeList=[],stampList=[];

function $(id){return document.getElementById(id)}
function showStatus(m){var el=$('status');el.textContent=m;el.style.display='block';setTimeout(function(){el.style.display='none'},1800)}
function esc(t){var d=document.createElement('div');d.textContent=t;return d.innerHTML}
function fmtTime(d){return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' · '+(d.getMonth()+1)+'.'+d.getDate()}

// DB
var req=indexedDB.open('南洲舊夢',2);
req.onerror=function(){showStatus('數據庫錯誤')};
req.onsuccess=function(e){db=e.target.result;showStatus('就緒');loadAll()};
req.onupgradeneeded=function(e){
  db=e.target.result;
  if(!db.objectStoreNames.contains('messages')) db.createObjectStore('messages',{keyPath:'id',autoIncrement:true});
  if(!db.objectStoreNames.contains('codes')) db.createObjectStore('codes',{keyPath:'id',autoIncrement:true});
  if(!db.objectStoreNames.contains('stamps')) db.createObjectStore('stamps',{keyPath:'id',autoIncrement:true});
};

function tx(store,mode){return db.transaction(store,mode).objectStore(store)}
function loadAll(){loadChat();loadCodes();loadStamps();render()}

function loadChat(){var r=tx('messages','readonly').getAll();r.onsuccess=function(){chatMsgs=r.result||[];if(currentTab==='chat')render()}}
function loadCodes(){var r=tx('codes','readonly').getAll();r.onsuccess=function(){codeList=r.result||[];if(currentTab==='code')render()}}
function loadStamps(){var r=tx('stamps','readonly').getAll();r.onsuccess=function(){stampList=r.result||[];if(currentTab==='stamp')render()}}

function switchTab(t){
  currentTab=t;
  document.querySelectorAll('.tabs span').forEach(function(s,i){s.className=i===({'chat':0,'code':1,'stamp':2}[t])?'active':''});
  render()
}

function render(){
  var list=$('list'),btns=$('btnRow');
  list.innerHTML='';btns.innerHTML='';
  if(currentTab==='chat'){
    $('inputRow').style.display='flex';
    renderChat(list);
    $('list').style.bottom='56px';
  } else {
    $('inputRow').style.display='none';
    if(currentTab==='code') renderCode(list);
    else if(currentTab==='stamp') renderStamp(list);
    renderBtns(btns);
    $('list').style.bottom='104px';
  }
}

function renderChat(list){
  if(!chatMsgs.length){list.innerHTML='<div class="empty">∅ 尚無來電<br>落筆發報，靜候回音</div>';return}
  chatMsgs.sort(function(a,b){return b.id-a.id}).forEach(function(m){
    var d=document.createElement('div');d.className='msg';
    var stampHtml=m.stamp?'<div class="stamp"><img src="'+m.stamp+'"></div>':'';
    d.innerHTML='<div class="label"><span>† 來電 № '+('000'+m.id).slice(-4)+'</span><span>'+esc(m.sender||'舊夢')+'</span></div><div>'+esc(m.text)+'</div>'+stampHtml+'<div class="time">'+m.time+'</div>';
    list.appendChild(d)
  })
}

function buildCodeItem(c){
  var d=document.createElement('div');d.className='item';
  d.innerHTML='<div class="item-head"><span>№ '+('000'+c.id).slice(-4)+'</span><span>'+c.time+'</span></div><div>'+esc(c.text)+'</div><div class="item-actions"><span onclick="editItem(\'code\','+c.id+',\''+esc(c.text)+'\')">修訂</span><span onclick="deleteItem(\'code\','+c.id+')">焚毀</span></div>';
  return d
}
function renderCode(list){
  if(!codeList.length){list.innerHTML='<div class="empty">∅ 電碼本空空如也</div>';return}
  codeList.forEach(function(c){list.appendChild(buildCodeItem(c))})
}
function renderStamp(list){
  if(!stampList.length){list.innerHTML='<div class="empty">∅ 郵戳冊尚無收藏</div>';return}
  stampList.forEach(function(s){
    var d=document.createElement('div');d.className='item';
    d.innerHTML='<div class="item-head"><span>№ '+('000'+s.id).slice(-4)+'</span><span>'+s.time+'</span></div><div style="text-align:center;padding:6px 0"><img src="'+s.data+'" style="max-width:80px;max-height:80px;border:1px solid #1a1a1a"></div><div class="item-actions"><span onclick="editItem(\'stamp\','+s.id+',\''+esc(s.note||'')+'\')">修訂</span><span onclick="deleteItem(\'stamp\','+s.id+')">焚毀</span></div>';
    list.appendChild(d)
  })
}

function renderBtns(btns){
  if(currentTab==='code'){
    btns.innerHTML=
      '<button onclick="searchCode()">翻查</button>'+
      '<button onclick="openModal(\'writeModal\')">落筆</button>'+
      '<button onclick="dedup(\'code\')">剔重</button>'+
      '<button onclick="openModal(\'importModal\')">謄入</button>'+
      '<button onclick="exportData(\'code\')">抄出</button>'+
      '<button onclick="clearAll(\'code\')">焚毀</button>';
  }
  else if(currentTab==='stamp'){
    btns.innerHTML=
      '<button onclick="openModal(\'stampModal\')">附郵戳</button>'+
      '<button onclick="dedup(\'stamp\')">剔重</button>'+
      '<button onclick="openModal(\'importModal\')">謄入</button>'+
      '<button onclick="exportData(\'stamp\')">抄出</button>'+
      '<button onclick="clearAll(\'stamp\')">焚毀</button>'+
      '<button style="visibility:hidden">占位</button>';
  }
}

function sendMsg(){
  if(!db){showStatus('數據庫未就緒');return}
  var input=$('inputRowInput');
  var text=input.value.trim();
  if(!text){showStatus('無內容');return}
  input.value='';
  var now=new Date(),time=fmtTime(now);
  var tx2=db.transaction('messages','readwrite'),store=tx2.objectStore('messages');
  store.add({text:text,time:time,date:now.toISOString(),sender:'此端'});
  tx2.oncomplete=function(){
    showStatus('已發出，等候回電...');
    setTimeout(function(){genReply(text)},1500+Math.random()*1000)
  }
}

function genReply(origText){
  if(!codeList.length){showStatus('電碼本空，無法回電');return}
  var count=1+Math.floor(Math.random()*3),replies=[];
  for(var i=0;i<count;i++){replies.push(codeList[Math.floor(Math.random()*codeList.length)].text)}
  var replyText=replies.join('　　');
  var stampData=stampList.length?stampList[Math.floor(Math.random()*stampList.length)].data:null;
  var now=new Date(),time=fmtTime(now);
  var tx2=db.transaction('messages','readwrite'),store=tx2.objectStore('messages');
  store.add({text:replyText,time:time,date:now.toISOString(),sender:'舊夢',stamp:stampData});
  tx2.oncomplete=function(){loadChat()}
}

function sealText(){
  var text=$('writeInput').value.trim();
  if(!text){showStatus('無內容');return}
  var lines=text.split('\n').map(function(l){return l.trim()}).filter(function(l){return l});
  if(!lines.length){showStatus('無有效內容');return}
  var now=new Date(),time=fmtTime(now);
  var t=db.transaction('codes','readwrite'),store=t.objectStore('codes');
  lines.forEach(function(l){store.add({text:l,time:time,date:now.toISOString()})});
  t.oncomplete=function(){showStatus('封存 '+lines.length+' 條');$('writeInput').value='';closeModal('writeModal');loadCodes()}
}

function doImport(){
  var file=$('importFile').files[0];
  if(!file){showStatus('未選文件');return}
  var reader=new FileReader();
  reader.onload=function(e){
    try{
      var data=JSON.parse(e.target.result);
      var list=Array.isArray(data)?data:data.list||data.codes||data.texts||[];
      if(!list.length&&typeof data==='string'){list=data.split('\n').map(function(l){return l.trim()}).filter(function(l){return l})}
      if(!list.length){showStatus('格式錯誤');return}
      var now=new Date(),time=fmtTime(now),t=db.transaction('codes','readwrite'),store=t.objectStore('codes');
      list.forEach(function(item){var txt=typeof item==='string'?item:item.text||item.content||'';if(txt)store.add({text:txt,time:time,date:now.toISOString()})});
      t.oncomplete=function(){showStatus('導入 '+list.length+' 條');closeModal('importModal');loadCodes()}
    }catch(err){showStatus('解析失敗')}
  };
  reader.readAsText(file)
}

function doStampAdd(){
  var files=$('stampFile').files;
  if(!files.length){showStatus('未選圖片');return}
  var loaded=0,total=files.length;
  for(var i=0;i<files.length;i++){
    (function(file){
      var reader=new FileReader();
      reader.onload=function(e){
        var now=new Date(),time=fmtTime(now);
        var t=db.transaction('stamps','readwrite'),store=t.objectStore('stamps');
        store.add({data:e.target.result,time:time,date:now.toISOString(),note:file.name});
        t.oncomplete=function(){loaded++;if(loaded>=total){showStatus('附戳 '+loaded+' 張');closeModal('stampModal');loadStamps()}}
      };
      reader.readAsDataURL(file)
    })(files[i])
  }
}

function editItem(type,id,curVal){
  editType=type;editId=id;$('editInput').value=curVal||'';
  openModal('editModal')
}
function saveEdit(){
  var val=$('editInput').value.trim();
  if(!val){showStatus('無內容');return}
  var t=db.transaction(editType==='code'?'codes':'stamps','readwrite');
  var store=t.objectStore(editType==='code'?'codes':'stamps');
  var getReq=store.get(editId);
  getReq.onsuccess=function(){
    var obj=getReq.result;
    if(editType==='code') obj.text=val;else obj.note=val;
    store.put(obj);
    t.oncomplete=function(){showStatus('已修訂');closeModal('editModal');editId=null;loadCodes();loadStamps()}
  }
}

function deleteItem(type,id){
  if(!confirm('確認焚毀？'))return;
  var t=db.transaction(type==='code'?'codes':'stamps','readwrite');
  var store=t.objectStore(type==='code'?'codes':'stamps');
  store.delete(id);
  t.oncomplete=function(){showStatus('已焚毀');loadCodes();loadStamps()}
}

function clearAll(type){
  if(!confirm('確認焚毀整冊？此操作不可復原'))return;
  var storeName=type==='code'?'codes':'stamps';
  var t=db.transaction(storeName,'readwrite');
  t.objectStore(storeName).clear();
  t.oncomplete=function(){showStatus('已焚毀整冊');loadCodes();loadStamps()}
}

function dedup(type){
  var list=type==='code'?codeList:stampList;
  var seen={},dups=[];
  list.forEach(function(item){var key=type==='code'?item.text:item.data;if(seen[key])dups.push(item.id);else seen[key]=true});
  if(!dups.length){showStatus('無重複');return}
  var t=db.transaction(type==='code'?'codes':'stamps','readwrite');
  var store=t.objectStore(type==='code'?'codes':'stamps');
  dups.forEach(function(id){store.delete(id)});
  t.oncomplete=function(){showStatus('剔重 '+dups.length+' 條');loadCodes();loadStamps()}
}

function exportData(type){
  var list=type==='code'?codeList:stampList;
  if(!list.length){showStatus('無數據');return}
  if(type==='code'){
    var text=list.map(function(c){return c.text}).join('\n');
    var blob=new Blob([text],{type:'text/plain;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='電碼本.txt';a.click()
  } else {
    var json=JSON.stringify(list.map(function(s){return{id:s.id,note:s.note,data:s.data}}),null,2);
    var blob=new Blob([json],{type:'application/json;charset=utf-8'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='郵戳冊.json';a.click()
  }
  showStatus('已抄出')
}

function searchCode(){
  var q=prompt('輸入關鍵字：');
  if(!q)return;
  var r=codeList.filter(function(c){return c.text.indexOf(q)>-1});
  if(!r.length){showStatus('無結果');return}
  var list=$('list');list.innerHTML='';
  r.forEach(function(c){list.appendChild(buildCodeItem(c))});
  showStatus('翻得 '+r.length+' 條')
}

function openModal(id){$(''+id).classList.add('show')}
function closeModal(id){$(''+id).classList.remove('show')}

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&$('inputRowInput')===document.activeElement){sendMsg()}
});

if(db){loadAll()}else{var wait=setInterval(function(){if(db){clearInterval(wait);loadAll()}else if(Date.now()-start>5000){clearInterval(wait);showStatus('數據庫連接超時')}},200)}
var start=Date.now();
</script>
</body>
</html>

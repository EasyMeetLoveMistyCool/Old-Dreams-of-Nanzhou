<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>南洲舊夢</title>
<style>
  /* 基础重置 */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; }
  body {
    font-family: -apple-system, "HarmonyOS Sans", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg-color);
    color: var(--text-color);
    transition: background .3s, color .3s;
  }

  /* ========== 主题变量 ========== */
  :root {
    /* 默认：淺綠 */
    --bg-color: #e6ebee;
    --topbar-bg: #ffffff;
    --topbar-border: #e4e6eb;
    --bubble-me: #effdde;
    --bubble-them: #ffffff;
    --text-color: #000000;
    --text-secondary: #707579;
    --time-color: #a0a0a0;
    --input-bg: #f0f2f5;
    --primary: #3390ec;
    --border-light: #f0f2f5;
  }
  body.theme-blue { --bubble-me: #d6ecff; }
  body.theme-purple { --bubble-me: #e8def8; }
  body.theme-pink { --bubble-me: #fce4ec; }
  body.theme-dark {
    --bg-color: #0e1621;
    --topbar-bg: #17212b;
    --topbar-border: #101921;
    --bubble-me: #2b5278;
    --bubble-them: #182533;
    --text-color: #ffffff;
    --text-secondary: #7f91a4;
    --time-color: #6c7883;
    --input-bg: #17212b;
    --primary: #64b5f6;
    --border-light: #101921;
  }
  body.theme-darkblue {
    --bg-color: #17212b;
    --topbar-bg: #1c2733;
    --topbar-border: #121a22;
    --bubble-me: #3a6ea5;
    --bubble-them: #212d3b;
    --text-color: #ffffff;
    --text-secondary: #7f91a4;
    --time-color: #6c7883;
    --input-bg: #212d3b;
    --primary: #64b5f6;
    --border-light: #121a22;
  }

  #app { height:100dvh; display:flex; flex-direction:column; position:relative; }

  /* ========== 顶栏 ========== */
  .topbar {
    height:56px; flex:0 0 56px;
    background:var(--topbar-bg);
    display:flex; align-items:center;
    padding:0 8px;
    border-bottom:1px solid var(--topbar-border);
    position:relative; z-index:10;
    transition: background .3s, border-color .3s;
  }
  .icon-btn {
    width:40px; height:40px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:22px; color:var(--text-secondary); cursor:pointer;
    background:transparent; border:none;
  }
  .icon-btn:active { background:rgba(128,128,128,0.15); }
  
  /* 顶栏头像 */
  .avatar-sm {
    width:36px; height:36px; border-radius:50%;
    background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; flex:0 0 36px; margin-right:10px;
  }
  
  /* 顶栏双层文字 */
  .header-info { flex:1; display:flex; flex-direction:column; justify-content:center; min-width:0; }
  .header-title { font-size:16px; font-weight:500; line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; color:var(--text-color); }
  .header-sub { font-size:12px; color:var(--text-secondary); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ========== 页面容器 ========== */
  .page { flex:1; overflow:hidden; position:relative; }
  .page-list, .page-chat, .page-create { 
    position:absolute; inset:0; display:flex; flex-direction:column; 
    background:var(--bg-color); transition:transform .22s ease, background .3s; 
  }
  .page-list { z-index:2; }
  .page-chat, .page-create { z-index:3; transform:translateX(100%); }
  .page-chat.show, .page-create.show { transform:translateX(0); }

  /* ========== 列表页 ========== */
  .chat-list { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  .chat-row {
    display:flex; align-items:center; gap:12px;
    padding:10px 14px; background:var(--topbar-bg); cursor:pointer;
    border-bottom:1px solid var(--topbar-border);
    transition: background .3s;
  }
  .chat-row:active { background:rgba(128,128,128,0.1); }
  .avatar-lg {
    width:48px; height:48px; border-radius:50%;
    background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    font-size:20px; flex:0 0 48px;
  }
  .chat-info { flex:1; min-width:0; }
  .chat-name { font-size:16px; font-weight:500; color:var(--text-color); }
  .chat-preview { font-size:13px; color:var(--text-secondary); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .chat-time { font-size:12px; color:var(--text-secondary); flex:0 0 auto; }
  .chat-empty { text-align:center; color:var(--text-secondary); padding:40px 20px; font-size:14px; }

  .fab {
    position:absolute; right:18px; bottom:22px;
    width:56px; height:56px; border-radius:50%;
    background:var(--primary); color:#fff; font-size:28px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 12px rgba(51,144,236,.4);
    cursor:pointer; z-index:5; border:none;
  }

  /* ========== 聊天页 ========== */
  .messages {
    flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:10px 10px 6px;
    display:flex; flex-direction:column;
  }
  .date-divider {
    align-self:center;
    background:rgba(0,0,0,.18); color:#fff;
    font-size:12px; padding:4px 12px; border-radius:12px;
    margin:10px 0; font-weight:500;
  }
  body.theme-dark .date-divider, body.theme-darkblue .date-divider { background:rgba(255,255,255,.15); }

  /* 消息行布局（加入头像） */
  .msg-row { display:flex; margin:2px 0; align-items:flex-end; gap:6px; }
  .msg-row.me { justify-content:flex-end; flex-direction:row-reverse; }
  .msg-row.them { justify-content:flex-start; }
  .msg-row.grouped { margin-top:2px; }
  .msg-row:not(.grouped) { margin-top:8px; }

  /* 气泡旁边的头像 (28px) */
  .msg-avatar {
    width:28px; height:28px; border-radius:50%;
    background:var(--primary); color:#fff; object-fit:cover;
    display:flex; align-items:center; justify-content:center;
    font-size:12px; flex:0 0 28px; margin-bottom:2px;
  }
  /* 连续消息隐藏头像 */
  .msg-row.grouped .msg-avatar { visibility:hidden; }

  .bubble {
    max-width:75%;
    padding:6px 10px;
    border-radius:12px;
    position:relative;
    font-size:15px;
    line-height:1.4;
    word-break:break-word;
    box-shadow:0 1px 2px rgba(0,0,0,.1);
    transition: background .3s;
  }
  
  .msg-row.me .bubble {
    background:var(--bubble-me); color:var(--text-color);
    border-bottom-right-radius:4px;
  }
  .msg-row.them .bubble {
    background:var(--bubble-them); color:var(--text-color);
    border-bottom-left-radius:4px;
  }

  /* 气泡尾巴 */
  .msg-row:not(.grouped) .bubble::after {
    content:''; position:absolute; bottom:0; width:0; height:0;
    border-style:solid;
  }
  .msg-row.me:not(.grouped) .bubble::after {
    right:-6px; border-width:0 0 10px 10px;
    border-color:transparent transparent var(--bubble-me) transparent;
  }
  .msg-row.them:not(.grouped) .bubble::after {
    left:-6px; border-width:0 10px 10px 0;
    border-color:transparent var(--bubble-them) transparent transparent;
  }

  /* 文本与图片排版 */
  .bubble .card-line { display:block; margin-bottom:2px; }
  .bubble .sticker-img {
    display:block; max-width:160px; max-height:160px; border-radius:8px; margin-top:4px;
  }
  
  /* 时间戳 */
  .bubble .meta {
    float:right;
    font-size:11px; color:var(--time-color);
    margin:8px 0 -2px 8px;
    line-height:1;
  }
  .bubble::after { content:''; display:block; clear:both; }

  /* ========== 输入区 ========== */
  .composer {
    flex:0 0 auto;
    background:var(--topbar-bg);
    border-top:1px solid var(--topbar-border);
    padding:6px 8px;
    padding-bottom:calc(6px + env(safe-area-inset-bottom));
    display:flex; align-items:center; gap:6px;
    transition: background .3s;
  }
  
  /* 待发送的贴纸预览 */
  .pending-sticker-box {
    display:none; background:var(--input-bg); padding:6px 12px; border-top:1px solid var(--topbar-border);
  }
  .pending-sticker-box.show { display:flex; align-items:center; gap:10px; }
  .pending-sticker-box img { height:40px; border-radius:4px; }
  .pending-sticker-box .close-btn { font-size:18px; color:var(--text-secondary); cursor:pointer; margin-left:auto; }

  .composer input {
    flex:1; min-width:0;
    height:40px; border-radius:20px;
    border:none; background:var(--input-bg);
    padding:0 14px; font-size:15px; color:var(--text-color);
    outline:none; transition: background .3s;
  }
  .composer input::placeholder { color:var(--text-secondary); }

  .send-btn {
    width:40px; height:40px; border-radius:50%;
    background:var(--primary); color:#fff; border:none;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 40px; cursor:pointer;
    transition: opacity .2s, background .3s;
  }
  .send-btn:disabled { background:var(--input-bg); color:var(--text-secondary); }
  .send-btn svg { width:20px; height:20px; fill:currentColor; margin-left:2px; }

  /* ========== 新建页面 (编辑资料) ========== */
  .create-scroll { flex:1; overflow-y:auto; padding:20px; }
  .form-group { margin-bottom:24px; display:flex; flex-direction:column; align-items:center; }
  .form-label { font-size:13px; color:var(--text-secondary); margin-bottom:8px; align-self:flex-start; margin-left:10px; font-weight:500; }
  .avatar-upload {
    width:80px; height:80px; border-radius:50%;
    background:var(--input-bg); color:var(--text-secondary);
    display:flex; align-items:center; justify-content:center;
    font-size:32px; cursor:pointer; overflow:hidden;
    margin-bottom:12px; border:2px solid var(--topbar-border);
    background-size:cover; background-position:center;
  }
  .form-input {
    width:100%; height:48px; border-radius:8px;
    background:var(--topbar-bg); border:1px solid var(--topbar-border);
    padding:0 14px; font-size:15px; color:var(--text-color);
    outline:none; text-align:center;
  }
  .form-input:focus { border-color:var(--primary); }
  
  .btn-primary {
    width:100%; height:48px; border-radius:8px;
    background:var(--primary); color:#fff;
    font-size:16px; font-weight:500; border:none; cursor:pointer;
  }
  .btn-primary:active { opacity:0.8; }

  /* ========== 菜单 & 弹窗 ========== */
  .menu-mask { position:fixed; inset:0; background:rgba(0,0,0,.25); display:none; z-index:50; }
  .menu-mask.show { display:block; }
  .menu {
    position:absolute; top:56px; right:10px;
    background:var(--topbar-bg); border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,.18);
    min-width:150px; overflow:hidden;
  }
  .menu-item { padding:12px 18px; font-size:15px; color:var(--text-color); cursor:pointer; white-space:nowrap; }
  .menu-item:active { background:var(--input-bg); }
  .menu-item.danger { color:#e53935; }

  .toast {
    position:fixed; left:50%; bottom:90px; transform:translateX(-50%);
    background:rgba(0,0,0,.75); color:#fff;
    font-size:13px; padding:8px 16px; border-radius:16px;
    z-index:100; opacity:0; transition:opacity .2s; pointer-events:none;
  }
  .toast.show { opacity:1; }

  .dialog-mask { position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:200; display:none; align-items:center; justify-content:center; padding:20px; }
  .dialog-mask.show { display:flex; }
  .dialog { background:var(--topbar-bg); width:100%; max-width:320px; border-radius:12px; overflow:hidden; color:var(--text-color); }
  .dialog-title { padding:16px; font-weight:600; text-align:center; border-bottom:1px solid var(--border-light); }
  .dialog-list { max-height:300px; overflow-y:auto; }
  .dialog-item { padding:12px 20px; border-bottom:1px solid var(--border-light); cursor:pointer; text-align:center; }
  .dialog-item:active { background:var(--input-bg); }
</style>
</head>
<body class="theme-green">

<div id="app">

      <div style="font-size:18px;font-weight:600;flex:1;padding-left:8px;">南洲舊夢</div>

      <div class="header-title" style="flex:1; text-align:center; font-size:17px;">建立新對話</div>

    </div>
    <div class="create-scroll">

      <!-- 通话图标 -->

          <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>

<!-- 菜单与弹窗 -->
<div class="menu-mask" id="menuMask">

</div>

<div class="dialog-mask" id="stickerDialogMask">

    <div class="dialog-title">選擇貼紙</div>
    <div class="dialog-list" id="stickerList" style="display:flex;flex-wrap:wrap;padding:10px;justify-content:center;gap:10px;"></div>

  </div>
</div>

<div class="dialog-mask" id="themeDialogMask">

<script>
/* ============ 基础工具 ============ */
const $ = s => document.querySelector(s);
const toastEl = $('#toast');
let toastTimer = null;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('show'), 1800);
}

/* ============ 主题逻辑 ============ */
function initTheme() {
  let savedTheme = localStorage.getItem('nz_theme') || 'theme-green';
  document.body.className = savedTheme;
}
function setTheme(themeName) {
  document.body.className = themeName;
  localStorage.setItem('nz_theme', themeName);
  $('#themeDialogMask').classList.remove('show');
}
initTheme();

/* ============ 头像转 Base64 工具 ============ */
function fileToBase64(file, callback) {
  const reader = new FileReader();
  reader.onload = e => callback(e.target.result);
  reader.readAsDataURL(file);
}

/* ============ IndexedDB (版本升级到2清空旧数据) ============ */
const DB_NAME = 'nanzhou_jiu_meng';
const DB_VER = 2; 
let db = null;

function openDB(){
  return new Promise((resolve, reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      // 删掉旧表重来
      if(d.objectStoreNames.contains('chats')) d.deleteObjectStore('chats');
      if(d.objectStoreNames.contains('messages')) d.deleteObjectStore('messages');
      if(d.objectStoreNames.contains('cards')) d.deleteObjectStore('cards');
      if(d.objectStoreNames.contains('stickers')) d.deleteObjectStore('stickers');
      
      // 重建新表
      d.createObjectStore('chats', { keyPath:'id' });
      const s = d.createObjectStore('messages', { keyPath:'id' });
      s.createIndex('chatId', 'chatId', { unique:false });
      d.createObjectStore('cards', { keyPath:'id' });
      d.createObjectStore('stickers', { keyPath:'id' });
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e.target.error);
  });
}
function tx(store, mode='readonly'){ return db.transaction(store, mode).objectStore(store); }
function reqToPromise(req){
  return new Promise((res, rej)=>{
    req.onsuccess = ()=>res(req.result);
    req.onerror = ()=>rej(req.error);
  });
}

/* ============ 全局状态 ============ */
let chats = [];
let currentChatId = null;
let currentMessages = [];
let pendingStickerData = null; 

// 新建时的暂存状态
let tempTheirAvatar = null;
let tempMyAvatar = null;

/* ============ 初始化 ============ */
async function init(){
  await openDB();
  await loadChats();
  renderChatList();
  bindEvents();
}

async function loadChats(){
  chats = await reqToPromise(tx('chats').getAll());
  chats.sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0));
}

/* ============ 列表页渲染 ============ */
async function renderChatList(){
  const list = $('#chatList');
  if(!chats.length){
    list.innerHTML = '<div class="chat-empty">尚無聊天室<br>點右下角 ＋ 建立新對話</div>';
    return;
  }
  list.innerHTML = '';
  for(const c of chats){
    const msgs = await getMessages(c.id);
    const last = msgs[msgs.length-1];
    let preview = '尚無訊息';
    if(last){
      if(last.type === 'sticker') preview = '[貼紙]';
      else if(last.cards && last.cards.length) preview = last.cards[0];
      else if(last.text) preview = last.text;
      else if(last.stickerData) preview = '[圖片]';
    }
    
    // 渲染头像（有图用图，没图用首字）
    const avatarHtml = c.theirAvatar 
      ? `<img src="${c.theirAvatar}" class="avatar-lg">` 
      : `<div class="avatar-lg">${(c.theirNick||'祂').charAt(0)}</div>`;
      
    const row = document.createElement('div');
    row.className = 'chat-row';
    row.innerHTML = `
      ${avatarHtml}
      <div class="chat-info">
        <div class="chat-name">${escapeHtml(c.roomName||'未命名')}</div>
        <div class="chat-preview">${escapeHtml(preview)}</div>
      </div>
      <div class="chat-time">${last ? fmtTime(last.time) : ''}</div>
    `;
    row.onclick = ()=>openChat(c.id);
    list.appendChild(row);
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[m]));
}
function fmtTime(ts){
  const d = new Date(ts);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtDate(ts){
  const d = new Date(ts);
  const now = new Date();
  if(d.toDateString() === now.toDateString()) return '今天';
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

/* ============ 消息读取与渲染 ============ */
function getMessages(chatId){
  return new Promise((res, rej)=>{
    const idx = tx('messages').index('chatId');
    const req = idx.getAll(chatId);
    req.onsuccess = ()=>{
      const arr = req.result || [];
      arr.sort((a,b)=>a.time-b.time);
      res(arr);
    };
    req.onerror = ()=>rej(req.error);
  });
}

async function openChat(id){
  currentChatId = id;
  const c = chats.find(x=>x.id===id);
  if(!c) return;
  
  $('#chatTitle').textContent = c.roomName || '聊天室';
  $('#chatSub').textContent = c.theirNick || '最近曾上線';
  
  // 头像
  const avatarEl = $('#chatAvatar');
  if(c.theirAvatar) {
    avatarEl.innerHTML = `<img src="${c.theirAvatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">`;
  } else {
    avatarEl.textContent = (c.theirNick||'祂').charAt(0);
    avatarEl.innerHTML = (c.theirNick||'祂').charAt(0);
  }
  
  currentMessages = await getMessages(id);
  renderMessages();
  
  $('#msgInput').value = '';
  pendingStickerData = null;
  updatePendingStickerUI();
  updateSendBtnState();
  
  $('#pageChat').classList.add('show');
}

function renderMessages(){
  const box = $('#messages');
  box.innerHTML = '';
  let lastDate = '';
  let prevSender = null;
  
  const c = chats.find(x=>x.id===currentChatId);
  
  for(const m of currentMessages){
    const dstr = fmtDate(m.time);
    if(dstr !== lastDate){
      const div = document.createElement('div');
      div.className = 'date-divider';
      div.textContent = dstr;
      box.appendChild(div);
      lastDate = dstr;
      prevSender = null;
    }
    const row = document.createElement('div');
    const senderClass = m.sender === 'me' ? 'me' : 'them';
    row.className = 'msg-row ' + senderClass;
    if(prevSender === m.sender) row.classList.add('grouped');

    // 渲染气泡旁边的头像
    let avatarHtml = '';
    if(m.sender === 'them') {
      if(c.theirAvatar) avatarHtml = `<img src="${c.theirAvatar}" class="msg-avatar">`;
      else avatarHtml = `<div class="msg-avatar">${(c.theirNick||'祂').charAt(0)}</div>`;
    } else {
      if(c.myAvatar) avatarHtml = `<img src="${c.myAvatar}" class="msg-avatar">`;
      else avatarHtml = `<div class="msg-avatar" style="background:#999">${(c.myNick||'我').charAt(0)}</div>`;
    }

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    let html = '';
    if(m.cards && m.cards.length){
      html += m.cards.map(c=>`<span class="card-line">${escapeHtml(c)}</span>`).join('');
    }
    if(m.text) html += `<span class="card-line">${escapeHtml(m.text)}</span>`;
    if(m.stickerData) html += `<img class="sticker-img" src="${m.stickerData}" alt="圖片">`;
    html += `<span class="meta">${fmtTime(m.time)}</span>`;
    
    bubble.innerHTML = html;
    row.innerHTML = avatarHtml;
    row.appendChild(bubble);
    box.appendChild(row);
    prevSender = m.sender;
  }
  box.scrollTop = box.scrollHeight;
}

/* ============ 发送逻辑 ============ */
function updateSendBtnState() {
  const text = $('#msgInput').value.trim();
  const btn = $('#sendBtn');
  if(text || pendingStickerData) {
    btn.disabled = false;
    btn.style.background = 'var(--primary)';
    btn.style.color = '#fff';
  } else {
    btn.disabled = true;
    btn.style.background = 'var(--input-bg)';
    btn.style.color = 'var(--text-secondary)';
  }
}

function updatePendingStickerUI() {
  const box = $('#pendingStickerBox');
  const img = $('#pendingStickerImg');
  if(pendingStickerData) {
    img.src = pendingStickerData;
    box.classList.add('show');
  } else {
    box.classList.remove('show');
    img.src = '';
  }
}

async function sendMyMessage(){
  const input = $('#msgInput');
  const text = input.value.trim();
  if(!text && !pendingStickerData) return;
  if(!currentChatId){ toast('請先選擇聊天室'); return; }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'me',
    type: 'text',
    text: text,
    cards: [],
    stickerData: pendingStickerData,
    time: Date.now()
  };
  
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  
  input.value = '';
  pendingStickerData = null;
  updatePendingStickerUI();
  updateSendBtnState();
  
  renderMessages();
  await touchChat(currentChatId);

  setTimeout(replyFromThem, 600);
}

async function touchChat(id){
  const c = chats.find(x=>x.id===id);
  if(!c) return;
  c.updatedAt = Date.now();
  await reqToPromise(tx('chats','readwrite').put(c));
}

/* ============ 祂的回复 ============ */
async function replyFromThem(){
  if(!currentChatId) return;
  
  const cards = await reqToPromise(tx('cards').getAll());
  if(!cards.length){
    toast('驛囊中尚無字卡，請先至「驛囊」新增字卡');
    return;
  }
  
  const n = 3 + Math.floor(Math.random()*3); 
  const picked = [];
  const pool = [...cards];
  for(let i=0;i<n && pool.length;i++){
    const idx = Math.floor(Math.random()*pool.length);
    picked.push(pool.splice(idx,1)[0].text);
  }

  let stickerData = null;
  const stickers = await reqToPromise(tx('stickers').getAll());
  if(stickers.length && Math.random() < 0.4){
    const s = stickers[Math.floor(Math.random()*stickers.length)];
    stickerData = s.data;
  }

  const msg = {
    id: 'm_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
    chatId: currentChatId,
    sender: 'them',
    type: 'cards',
    text: '',
    cards: picked,
    stickerData: stickerData,
    time: Date.now()
  };
  
  await reqToPromise(tx('messages','readwrite').add(msg));
  currentMessages.push(msg);
  renderMessages();
  await touchChat(currentChatId);
}

/* ============ 事件绑定 ============ */
function bindEvents(){
  // --- 列表页 ---
  $('#newChatBtn').onclick = ()=>{
    // 重置新建表单
    $('#inputRoomName').value = '';
    $('#inputTheirNick').value = '';
    $('#inputMyNick').value = '';
    $('#theirAvatar').style.backgroundImage = '';
    $('#theirAvatar').textContent = '祂';
    $('#myAvatar').style.backgroundImage = '';
    $('#myAvatar').textContent = '我';
    tempTheirAvatar = null;
    tempMyAvatar = null;
    
    $('#pageCreate').classList.add('show');
  };

  // --- 新建页 ---
  $('#cancelCreateBtn').onclick = ()=>{
    $('#pageCreate').classList.remove('show');
  };

  $('#theirFile').onchange = e => {
    if(e.target.files[0]) {
      fileToBase64(e.target.files[0], base64 => {
        tempTheirAvatar = base64;
        const el = $('#theirAvatar');
        el.style.backgroundImage = `url(${base64})`;
        el.textContent = '';
      });
    }
  };
  
  $('#myFile').onchange = e => {
    if(e.target.files[0]) {
      fileToBase64(e.target.files[0], base64 => {
        tempMyAvatar = base64;
        const el = $('#myAvatar');
        el.style.backgroundImage = `url(${base64})`;
        el.textContent = '';
      });
    }
  };

  $('#saveChatBtn').onclick = async ()=>{
    const roomName = $('#inputRoomName').value.trim();
    const theirNick = $('#inputTheirNick').value.trim();
    const myNick = $('#inputMyNick').value.trim();
    
    if(!roomName) { toast('請輸入聊天室名稱'); return; }
    
    const c = {
      id: 'c_' + Date.now() + '_' + Math.random().toString(36).slice(2,7),
      roomName: roomName,
      theirNick: theirNick || '祂',
      myNick: myNick || '我',
      theirAvatar: tempTheirAvatar,
      myAvatar: tempMyAvatar,
      createdAt: Date.now(),
      updatedAt: Date.now()
    };
    
    await reqToPromise(tx('chats','readwrite').add(c));
    chats.unshift(c);
    renderChatList();
    $('#pageCreate').classList.remove('show');
    toast('已建立新對話');
  };

  // --- 聊天页 ---
  $('#backBtn').onclick = ()=>{
    $('#pageChat').classList.remove('show');
    currentChatId = null;
    renderChatList();
  };

  $('#sendBtn').onclick = sendMyMessage;
  $('#msgInput').addEventListener('input', updateSendBtnState);
  $('#msgInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter' && !e.isComposing) sendMyMessage();
  });
  
  $('#callBtn').onclick = ()=> toast('通話功能尚未開放');

  $('#cancelStickerBtn').onclick = ()=>{
    pendingStickerData = null;
    updatePendingStickerUI();
    updateSendBtnState();
  };

  // --- 贴纸选择器 ---
  $('#stickerBtn').onclick = async ()=>{
    const stickers = await reqToPromise(tx('stickers').getAll());
    const list = $('#stickerList');
    if(!stickers.length) {
      toast('驛囊中尚無貼紙，請先至「驛囊」新增');
      return;
    }
    list.innerHTML = '';
    stickers.forEach(s => {
      const img = document.createElement('img');
      img.src = s.data;
      img.style.cssText = 'width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer;';
      img.onclick = () => {
        pendingStickerData = s.data;
        updatePendingStickerUI();
        updateSendBtnState();
        $('#stickerDialogMask').classList.remove('show');
      };
      list.appendChild(img);
    });
    $('#stickerDialogMask').classList.add('show');
  };
  $('#closeStickerDialog').onclick = ()=> $('#stickerDialogMask').classList.remove('show');
  
  // --- 侧边菜单 ---
  const mask = $('#menuMask');
  function openMenu(){ mask.classList.add('show'); }
  function closeMenu(){ mask.classList.remove('show'); }
  $('#menuBtnList').onclick = openMenu;
  mask.onclick = e=>{ if(e.target === mask) closeMenu(); };
  $('#menuPanel').onclick = e=>{
    const act = e.target.dataset.act;
    if(!act) return;
    closeMenu();
    handleMenu(act);
  };
  $('#closeThemeDialog').onclick = ()=> $('#themeDialogMask').classList.remove('show');
}

function handleMenu(act){
  if(act === 'pouch') toast('驛囊：字卡與貼紙管理（待實作）');
  else if(act === 'theme') $('#themeDialogMask').classList.add('show');
  else if(act === 'export') toast('存檔：匯出備份（待實作）');
  else if(act === 'clear') toast('焚稿：清空記錄（待實作）');
  else if(act === 'about') toast('南洲誌：關於本網站（待實作）');
}

/* ============ 启动 ============ */
init().catch(err=>{
  console.error(err);
  toast('資料庫初始化失敗，請重新整理');
});
</script>
</body>
</html>
